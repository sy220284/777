name: v46-consensus-fusion

on:
  push:
    branches:
      - v4-6-nonlinear-challenger
    paths:
      - "tools/v4_6_consensus_fusion.py"
      - ".github/workflows/v46-consensus-fusion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 编译检查
        run: python -m compileall -q tools/v4_6_consensus_fusion.py tools/v4_6_outball_corrected.py tools/v4_6_transition_features.py models
      - name: 运行共识融合实验
        run: python tools/v4_6_consensus_fusion.py
      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: v46-consensus-fusion
          path: backtests/v4_6/consensus_fusion.json
          if-no-files-found: error
