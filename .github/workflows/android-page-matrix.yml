name: Android Page Size Matrix

on:
  pull_request:
    paths:
      - '.github/workflows/android-page-matrix.yml'
      - '.github/workflows/ci.yml'
      - '.github/scripts/run-android-page-matrix.sh'
      - '.github/scripts/run-android17-ten-rounds.sh'
      - '.github/scripts/analyze-android17-ten-rounds.py'
      - '.github/scripts/compare-android-page-matrix.py'
      - '.github/scripts/classify-ci-scope.py'
      - 'app/src/androidTest/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Independent of the normal CI, but PR and manual dispatch for one feature
# branch share one queue to avoid duplicate four-device test runs.
# Main commit checks must remain immutable and uncancelled.
concurrency:
  group: page-size-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event_name != 'pull_request' && github.ref_name == 'main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_name != 'main' }}

jobs:
  android-16-17-four-way:
    runs-on: ubuntu-latest
    # 60-minute maximum wait for exact-SHA CI APKs, then up to 90 minutes for
    # four Android page-size cells; never reuse another commit's APKs.
    timeout-minutes: 150
    # All four performance cells share one runner and APKs built by this SHA's CI.
    # SHA-256 and checkout identity are rechecked before any device boots.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 27
      - uses: ./.github/actions/setup-android-cached
        with:
          packages: 'platform-tools emulator platforms;android-37.0 build-tools;37.0.0'
      - name: Validate matrix scripts
        run: |
          set -euo pipefail
          bash -n .github/scripts/run-android-page-matrix.sh
          bash -n .github/scripts/run-android17-ten-rounds.sh
          python3 -m py_compile .github/scripts/analyze-android17-ten-rounds.py .github/scripts/compare-android-page-matrix.py
      - name: Reuse SHA-256 verified CI APKs from this exact checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .github/scripts/wait-android-device-artifacts.sh --self-test
          bash .github/scripts/wait-android-device-artifacts.sh --from-ci
          bash .github/scripts/verify-android16-apk.sh .ci/device-apks/app-optimized.apk x86_64
          echo 'Benchmark APK Node runtime version:'
          unzip -p .ci/device-apks/app-debug.apk assets/runtime/node/node-version.txt | tee .ci/device-apks/node-version.txt
          grep -Eq '^26\.[0-9]+\.[0-9]+$' .ci/device-apks/node-version.txt
      - name: Execute Android16/17 x 4KB/16KB on one runner
        run: |
          set -euo pipefail
          bash .github/scripts/run-android-page-matrix.sh --local-apks
      - name: Upload all matrix evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android16-17-four-way-raw
          path: |
            .ci/android-page-matrix/
            .ci/android16-4k-ten-rounds/
            .ci/android16-16k-ten-rounds/
            .ci/android17-4k-ten-rounds/
            .ci/android17-16k-ten-rounds/
            .ci/device-apks/sha256.txt
            .ci/device-apks/node-version.txt
          if-no-files-found: warn
          retention-days: 14
