name: Android Page Size Matrix

on:
  pull_request:
    paths:
      - '.github/workflows/android-page-matrix.yml'
      - '.github/workflows/ci.yml'
      - '.github/scripts/run-android-page-matrix.sh'
      - '.github/scripts/run-android17-ten-rounds.sh'
      - '.github/scripts/analyze-android17-ten-rounds.py'
      - '.github/scripts/compare-android-page-matrix.py'
      - '.github/scripts/classify-ci-scope.py'
      - 'app/src/androidTest/**'
  workflow_dispatch:

permissions:
  contents: read

# Independent of the normal Android 16/17 CI workflow. This avoids a previous
# 180-minute four-cell job blocking current full-CI feedback.
concurrency:
  group: page-size-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-16-17-four-way:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    # The same pinned Node 26.12.1 runtime now builds production and benchmark
    # APKs, with signed index and package SHA verification in both ABIs.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 27
      - uses: ./.github/actions/setup-android-cached
        with:
          packages: 'platform-tools emulator platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: ./.github/actions/setup-runtime-cached
        with:
          abi: x86_64
      - name: Validate matrix scripts
        run: |
          set -euo pipefail
          bash -n .github/scripts/run-android-page-matrix.sh
          bash -n .github/scripts/run-android17-ten-rounds.sh
          python3 -m py_compile .github/scripts/analyze-android17-ten-rounds.py .github/scripts/compare-android-page-matrix.py
      - name: Build one identical x86_64 APK set for four cells
        run: |
          set -euo pipefail
          DSH_RUNTIME_ABIS=x86_64 ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleOptimized --stacktrace --console=plain
          .github/scripts/verify-android16-apk.sh app/build/outputs/apk/optimized/app-optimized.apk x86_64
          TEST_APK="$(find app/build/outputs/apk/androidTest -type f -name '*androidTest*.apk' -print -quit)"
          test -n "$TEST_APK"
          mkdir -p .ci/device-apks
          cp app/build/outputs/apk/debug/app-debug.apk .ci/device-apks/app-debug.apk
          cp "$TEST_APK" .ci/device-apks/app-debug-androidTest.apk
          cp app/build/outputs/apk/optimized/app-optimized.apk .ci/device-apks/app-optimized.apk
          sha256sum .ci/device-apks/*.apk | tee .ci/device-apks/sha256.txt
          echo 'Benchmark APK Node runtime version:'
          unzip -p .ci/device-apks/app-debug.apk assets/runtime/node/node-version.txt | tee .ci/device-apks/node-version.txt
          grep -qx '26.12.1' .ci/device-apks/node-version.txt
      - name: Execute Android16/17 x 4KB/16KB on one runner
        run: |
          set -euo pipefail
          bash .github/scripts/run-android-page-matrix.sh --local-apks
      - name: Upload all matrix evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android16-17-four-way-raw
          path: |
            .ci/android-page-matrix/
            .ci/android16-4k-ten-rounds/
            .ci/android16-16k-ten-rounds/
            .ci/android17-4k-ten-rounds/
            .ci/android17-16k-ten-rounds/
            .ci/device-apks/sha256.txt
            .ci/device-apks/node-version.txt
          if-no-files-found: warn
          retention-days: 14
