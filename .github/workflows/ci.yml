name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'screen.png'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'screen.png'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify official golden fixture provenance
        run: |
          corepack enable
          bash tools/reference-validation/refresh-official-fixtures.sh
          git diff --exit-code -- reference-validation/src/test/resources/official
      - name: Guard hard-coded UI text
        run: python3 .github/scripts/check-ui-hardcoded-cjk.py
      - name: Guard UI design-system boundaries
        run: python3 .github/scripts/check-ui-design-system-boundaries.py
      - name: Guard Kotlin risk patterns
        run: python3 .github/scripts/check-kotlin-risk-patterns.py
      - name: Guard local performance invariants
        run: python3 .github/scripts/check-local-performance-invariants.py
      - name: Guard local architecture boundaries
        run: python3 .github/scripts/check-local-architecture-boundaries.py
      - name: Test bundled runtime compactor
        run: python3 tools/runtime/compact-runtime-assets.py --self-test
      - name: Test OSS update mirror publisher
        run: python3 .github/scripts/publish-oss-update-mirror.py --self-test
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Unit tests
        run: ./gradlew :core:test :harness-core:test :harness-runtime-android:test :harness-interop:test :harness-device-android:testDebugUnitTest :mock-harness:test :app:testDebugUnitTest --stacktrace
      - name: Official Harness conformance
        run: ./gradlew :reference-validation:test --stacktrace

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Lint
        run: |
          set +e
          ./gradlew :app:lintDebug --stacktrace
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== lint text report ==="
            find app/build -type f -name 'lint-results-debug.txt' -print -exec cat {} \; || true
          fi
          exit "$status"
      - name: Assemble optimized APK
        run: ./gradlew :app:assembleOptimized --stacktrace
      - name: Verify Android 16 APK
        run: .github/scripts/verify-android16-apk.sh app/build/outputs/apk/optimized/app-optimized.apk
      - name: Enforce APK size budget
        run: |
          BYTES="$(stat -c '%s' app/build/outputs/apk/optimized/app-optimized.apk)"
          BUDGET=94371840
          echo "Optimized APK: $BYTES bytes (budget: $BUDGET)"
          test "$BYTES" -le "$BUDGET"
      - name: Upload optimized APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-mobile-optimized
          path: app/build/outputs/apk/optimized/*.apk
          retention-days: 3

  android-16-instrumented:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::error::/dev/kvm is unavailable on this runner"
            exit 1
          fi
      - name: Android 16 instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          script: |
            DSH_RUNTIME_ABIS=x86_64 ./gradlew :app:connectedDebugAndroidTest :app:assembleDebug :app:assembleOptimized --stacktrace
            adb shell am force-stop com.sy220284.dshmobile.debug || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.sy220284.dshmobile.debug -c android.intent.category.LAUNCHER 1
            sleep 2
            adb shell pidof com.sy220284.dshmobile.debug
            adb shell am force-stop com.sy220284.dshmobile.debug || true
            adb install -r app/build/outputs/apk/optimized/app-optimized.apk
            bash .github/scripts/smoke-test-android-startup.sh com.sy220284.dshmobile.debug

  android-17-instrumented:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools emulator platforms;android-37.0 build-tools;37.0.0 system-images;android-37.0;google_apis_ps16k;x86_64'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::error::/dev/kvm is unavailable on this runner"
            exit 1
          fi
      - name: Android 17 instrumentation tests
        run: |
          echo no | avdmanager create avd --force -n android17 \
            --package 'system-images;android-37.0;google_apis_ps16k;x86_64'
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd android17 \
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim &
          adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          set +e
          DSH_RUNTIME_ABIS=x86_64 ./gradlew :app:connectedDebugAndroidTest :app:assembleDebug :app:assembleOptimized --stacktrace
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== connected test XML ==="
            find app/build -type f -path '*androidTest-results*' -name '*.xml' -print -exec cat {} \; || true
            exit "$status"
          fi
          set -e
          adb shell am force-stop com.sy220284.dshmobile.debug || true
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell monkey -p com.sy220284.dshmobile.debug -c android.intent.category.LAUNCHER 1
          sleep 2
          adb shell pidof com.sy220284.dshmobile.debug
          adb shell am force-stop com.sy220284.dshmobile.debug || true
          adb install -r app/build/outputs/apk/optimized/app-optimized.apk
          bash .github/scripts/smoke-test-android-startup.sh com.sy220284.dshmobile.debug

  # 统一合并门禁：main 分支保护只需依赖这一项状态检查。
  # 仓库设置需将 “CI / merge-gate” 设为必需检查；任何失败、取消或跳过都会在这里收口为失败。
  merge-gate:
    if: always()
    needs:
      - preflight
      - build
      - android-16-instrumented
      - android-17-instrumented
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI lane to complete successfully
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          ANDROID16_RESULT: ${{ needs['android-16-instrumented'].result }}
          ANDROID17_RESULT: ${{ needs['android-17-instrumented'].result }}
        run: |
          set -eu
          for result in "$PREFLIGHT_RESULT" "$BUILD_RESULT" "$ANDROID16_RESULT" "$ANDROID17_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::CI 未通过：存在失败、取消或跳过的必需验证任务（结果：$result）"
              exit 1
            fi
          done
          echo "CI 合并门禁通过：所有必需验证任务均成功"
