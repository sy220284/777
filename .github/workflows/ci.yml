name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` package is no longer published on current runners.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      # :app was missing here, so nothing under app/src/test ever ran on CI.
      - name: Unit tests
        run: ./gradlew :core:test :mock-harness:test :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Assemble optimized APK
        run: ./gradlew :app:assembleOptimized --stacktrace
      - name: Verify Android 16 APK
        run: .github/scripts/verify-android16-apk.sh app/build/outputs/apk/optimized/app-optimized.apk
      - name: Enforce APK size budget
        run: |
          BYTES="$(stat -c '%s' app/build/outputs/apk/optimized/app-optimized.apk)"
          test "$BYTES" -le 57671680
          echo "Optimized APK: $BYTES bytes (budget: 57671680)"
      - name: Upload optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-optimized
          path: app/build/outputs/apk/optimized/*.apk

  android-16-instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::error::/dev/kvm is unavailable on this runner"
            exit 1
          fi
      - name: Android 16 instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest :app:assembleOptimized --stacktrace
            adb shell am force-stop com.sy220284.dshmobile.debug || true
            adb install -r app/build/outputs/apk/optimized/app-optimized.apk
            adb shell monkey -p com.sy220284.dshmobile.debug -c android.intent.category.LAUNCHER 1
            sleep 2
            adb shell pidof com.sy220284.dshmobile.debug
