name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      run_static: ${{ steps.classify.outputs.run_static }}
      run_architecture: ${{ steps.classify.outputs.run_architecture }}
      run_unit: ${{ steps.classify.outputs.run_unit }}
      run_build: ${{ steps.classify.outputs.run_build }}
      run_device: ${{ steps.classify.outputs.run_device }}
      run_android16: ${{ steps.classify.outputs.run_android16 }}
      run_android17: ${{ steps.classify.outputs.run_android17 }}
      run_fixture: ${{ steps.classify.outputs.run_fixture }}
      run_relay: ${{ steps.classify.outputs.run_relay }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Bootstrap CI control plane
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/scripts/classify-ci-scope.py \
            .github/scripts/check-ci-repository-integrity.py
          python3 .github/scripts/classify-ci-scope.py --self-test
          python3 .github/scripts/check-ci-repository-integrity.py
      - name: Collect changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git ls-files > changed-files.txt
            echo "手动执行：强制完整 CI"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMRD "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            base="$BEFORE_SHA"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse "$CURRENT_SHA^")"
            fi
            git diff --name-only --diff-filter=ACMRD "$base" "$CURRENT_SHA" > changed-files.txt
            git diff --check "$base" "$CURRENT_SHA"
          fi
          echo "本次变更文件："
          cat changed-files.txt
      - name: Classify CI scope
        id: classify
        run: |
          args=(--paths-file changed-files.txt --github-output "$GITHUB_OUTPUT")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            args+=(--force-full)
          fi
          python3 .github/scripts/classify-ci-scope.py "${args[@]}"
      - name: Verify selected scope coverage
        env:
          RUN_STATIC: ${{ steps.classify.outputs.run_static }}
          RUN_ARCHITECTURE: ${{ steps.classify.outputs.run_architecture }}
          RUN_UNIT: ${{ steps.classify.outputs.run_unit }}
          RUN_BUILD: ${{ steps.classify.outputs.run_build }}
          RUN_DEVICE: ${{ steps.classify.outputs.run_device }}
          RUN_ANDROID16: ${{ steps.classify.outputs.run_android16 }}
          RUN_ANDROID17: ${{ steps.classify.outputs.run_android17 }}
          RUN_FIXTURE: ${{ steps.classify.outputs.run_fixture }}
          RUN_RELAY: ${{ steps.classify.outputs.run_relay }}
        run: |
          set -euo pipefail

          require_true() {
            value="$1"
            label="$2"
            path="$3"
            if [ "$value" != "true" ]; then
              echo "::error::$path 必须启用 $label，但范围分类结果为 $value"
              exit 1
            fi
          }

          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ci.yml|.github/scripts/classify-ci-scope.py)
                require_true "$RUN_STATIC" "static-gates" "$path"
                require_true "$RUN_ARCHITECTURE" "architecture-3-gates" "$path"
                require_true "$RUN_RELAY" "relay-conformance" "$path"
                ;;
              AGENTS.md|docs/ARCHITECTURE.md|docs/SYSTEM-AUDIT-GUIDE.zh-CN.md|docs/VALIDATION.md|.github/scripts/check-ci-repository-integrity.py|.github/scripts/check-local-architecture-boundaries.py|.github/scripts/check-local-performance-invariants.py)
                require_true "$RUN_STATIC" "static-gates" "$path"
                require_true "$RUN_ARCHITECTURE" "architecture-3-gates" "$path"
                ;;
              .github/scripts/verify-android16-apk.sh|.github/scripts/smoke-test-android-startup.sh|.github/scripts/check-apk-runtime-layout.py)
                require_true "$RUN_STATIC" "static-gates" "$path"
                require_true "$RUN_ARCHITECTURE" "architecture-3-gates" "$path"
                require_true "$RUN_UNIT" "unit-tests" "$path"
                require_true "$RUN_BUILD" "build-arm64" "$path"
                require_true "$RUN_DEVICE" "device-artifacts-x86" "$path"
                require_true "$RUN_ANDROID16" "android-16-instrumented" "$path"
                require_true "$RUN_ANDROID17" "android-17-instrumented" "$path"
                ;;
              upstream/deepseek-harness.lock.json|tools/reference-validation/official-runner.ts|tools/reference-validation/refresh-official-fixtures.sh|tools/reference-validation/package.json|tools/reference-validation/package-lock.json)
                require_true "$RUN_STATIC" "static-gates" "$path"
                require_true "$RUN_UNIT" "unit-tests" "$path"
                require_true "$RUN_FIXTURE" "fixture-provenance" "$path"
                ;;
              app/src/test/java/com/labteto/dshmobile/connection/RelayConformanceTest.kt)
                require_true "$RUN_STATIC" "static-gates" "$path"
                require_true "$RUN_UNIT" "unit-tests" "$path"
                require_true "$RUN_RELAY" "relay-conformance" "$path"
                ;;
              .github/scripts/check-*.py)
                require_true "$RUN_STATIC" "static-gates" "$path"
                ;;
            esac
          done < changed-files.txt

  static-gates:
    needs: scope
    if: ${{ needs.scope.outputs.run_static == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate workflow semantics
        run: |
          set -euo pipefail
          VERSION=1.7.12
          ARCHIVE="actionlint_${VERSION}_linux_amd64.tar.gz"
          URL="https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${ARCHIVE}"
          SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 "$URL" -o "$RUNNER_TEMP/$ARCHIVE"
          printf '%s  %s\n' "$SHA256" "$RUNNER_TEMP/$ARCHIVE" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint"
      - name: Validate Python and shell automation syntax
        run: |
          python3 -m compileall -q .github/scripts tools/runtime
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find .github/scripts tools/runtime tools/reference-validation -type f -name '*.sh' -print0)
      - name: Validate Android security boundaries
        run: python3 .github/scripts/check-android-security-boundaries.py
      - name: Validate static product guards
        run: |
          python3 .github/scripts/check-ui-hardcoded-cjk.py
          python3 .github/scripts/check-ui-design-system-boundaries.py
          python3 .github/scripts/check-notification-presentation.py
          python3 .github/scripts/check-kotlin-risk-patterns.py
          python3 .github/scripts/check-build-baseline.py
          python3 .github/scripts/check-test-quality.py
          python3 tools/runtime/compact-runtime-assets.py --self-test
      - name: Validate release version format
        run: |
          value="$(tr -d '\r\n' < .github/release-version)"
          [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+-777\.[0-9]+$ ]]

  architecture-3-gates:
    needs: [scope, static-gates]
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.run_architecture == 'true' && needs.static-gates.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Architecture 3.0 ownership and dependencies
        run: python3 .github/scripts/check-local-architecture-boundaries.py
      - name: Validate Architecture 3.0 execution invariants
        run: python3 .github/scripts/check-local-performance-invariants.py

  fixture-provenance:
    needs: [scope, static-gates]
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.run_fixture == 'true' && needs.static-gates.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify official golden fixture provenance
        run: |
          corepack enable
          bash tools/reference-validation/refresh-official-fixtures.sh
          git diff --exit-code -- reference-validation/src/test/resources/official

  unit-tests:
    needs: [scope, static-gates, architecture-3-gates]
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.run_unit == 'true' && needs.static-gates.result == 'success' && (needs.scope.outputs.run_architecture != 'true' || needs.architecture-3-gates.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Unit tests and Harness conformance
        run: |
          ./gradlew             :core:test             :harness-core:test             :harness-runtime-android:test             :harness-interop:test             :harness-device-android:testDebugUnitTest             :mock-harness:test             :app:testDebugUnitTest             :reference-validation:test             --stacktrace
      - name: Verify JVM 21 bytecode output
        run: python3 .github/scripts/check-jvm21-bytecode.py


  relay-conformance:
    needs: [scope, static-gates, architecture-3-gates]
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.run_relay == 'true' && needs.static-gates.result == 'success' && (needs.scope.outputs.run_architecture != 'true' || needs.architecture-3-gates.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sorsama/deepseek-harness-relay
          ref: 10c2758e77192413d9450a4d641daafb2a675286
          path: .ci/dsh-relay
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Install pinned dsh-relay dependencies
        run: |
          set -euo pipefail
          corepack enable
          cd .ci/dsh-relay
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify Android client against real dsh-relay
        env:
          DSH_RELAY_SRC: ${{ github.workspace }}/.ci/dsh-relay
          DSH_RELAY_CONFORMANCE_REQUIRED: true
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests com.labteto.dshmobile.connection.RelayConformanceTest \
            --stacktrace

  build-arm64:
    needs: [scope, static-gates, architecture-3-gates]
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.run_build == 'true' && needs.static-gates.result == 'success' && (needs.scope.outputs.run_architecture != 'true' || needs.architecture-3-gates.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .gradle/runtime-cache
          key: runtime-${{ runner.os }}-arm64-v8a-${{ hashFiles('tools/runtime/prepare-termux-*.sh', 'tools/runtime/prepare-hdiffpatch.sh') }}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Lint and assemble optimized APK
        run: ./gradlew :app:lintDebug :app:assembleOptimized --stacktrace
      - name: Verify arm64 APK
        run: .github/scripts/verify-android16-apk.sh app/build/outputs/apk/optimized/app-optimized.apk arm64-v8a
      - name: Enforce APK size budget
        run: |
          BYTES="$(stat -c '%s' app/build/outputs/apk/optimized/app-optimized.apk)"
          BUDGET=94371840
          echo "Optimized APK: $BYTES bytes (budget: $BUDGET)"
          test "$BYTES" -le "$BUDGET"
      - name: Upload optimized APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-mobile-optimized
          path: app/build/outputs/apk/optimized/*.apk
          retention-days: 3

  device-artifacts-x86:
    needs: [scope, static-gates, architecture-3-gates]
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.run_device == 'true' && needs.static-gates.result == 'success' && (needs.scope.outputs.run_architecture != 'true' || needs.architecture-3-gates.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .gradle/runtime-cache
          key: runtime-${{ runner.os }}-x86_64-${{ hashFiles('tools/runtime/prepare-termux-*.sh', 'tools/runtime/prepare-hdiffpatch.sh') }}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build shared Android test artifacts
        run: |
          DSH_RUNTIME_ABIS=x86_64 ./gradlew             :app:assembleDebug             :app:assembleDebugAndroidTest             :app:assembleOptimized             --stacktrace
      - name: Verify and stage x86_64 APKs
        run: |
          set -euo pipefail
          .github/scripts/verify-android16-apk.sh app/build/outputs/apk/optimized/app-optimized.apk x86_64
          TEST_APK="$(find app/build/outputs/apk/androidTest -type f -name '*androidTest*.apk' -print -quit)"
          test -n "$TEST_APK"
          mkdir -p .ci/device-apks
          cp app/build/outputs/apk/debug/app-debug.apk .ci/device-apks/app-debug.apk
          cp "$TEST_APK" .ci/device-apks/app-debug-androidTest.apk
          cp app/build/outputs/apk/optimized/app-optimized.apk .ci/device-apks/app-optimized.apk
      - name: Upload shared Android test artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-x86_64-test-apks
          path: .ci/device-apks/*.apk
          retention-days: 1
          if-no-files-found: error

  android-16-instrumented:
    needs: [scope, static-gates, device-artifacts-x86]
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.run_android16 == 'true' && needs.static-gates.result == 'success' && needs.device-artifacts-x86.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-x86_64-test-apks
          path: .ci/device-apks
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "::error::/dev/kvm is unavailable on this runner"
            exit 1
          fi
      - name: Android 16 instrumentation and startup tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r .ci/device-apks/app-debug.apk
            adb install -r .ci/device-apks/app-debug-androidTest.apk
            adb shell am instrument -w -r com.sy220284.dshmobile.debug.test/androidx.test.runner.AndroidJUnitRunner
            adb shell am force-stop com.sy220284.dshmobile.debug || true
            adb shell monkey -p com.sy220284.dshmobile.debug -c android.intent.category.LAUNCHER 1
            sleep 2
            adb shell pidof com.sy220284.dshmobile.debug
            adb shell am force-stop com.sy220284.dshmobile.debug || true
            adb install -r .ci/device-apks/app-optimized.apk
            bash .github/scripts/smoke-test-android-startup.sh com.sy220284.dshmobile.debug

  android-17-instrumented:
    needs: [scope, static-gates, device-artifacts-x86]
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.run_android17 == 'true' && needs.static-gates.result == 'success' && needs.device-artifacts-x86.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-x86_64-test-apks
          path: .ci/device-apks
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools emulator platforms;android-37.0 build-tools;37.0.0 system-images;android-37.0;google_apis_ps16k;x86_64'
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "::error::/dev/kvm is unavailable on this runner"
            exit 1
          fi
      - name: Android 17 instrumentation and startup tests
        run: |
          set -euo pipefail
          echo no | avdmanager create avd --force -n android17             --package 'system-images;android-37.0;google_apis_ps16k;x86_64'
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd android17             -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim &
          adb wait-for-device
          booted=false
          for _ in $(seq 1 150); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [ "$booted" != "true" ]; then
            echo "::error::Android 17 emulator did not finish booting within 300 seconds"
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r .ci/device-apks/app-debug.apk
          adb install -r .ci/device-apks/app-debug-androidTest.apk
          adb shell am instrument -w -r com.sy220284.dshmobile.debug.test/androidx.test.runner.AndroidJUnitRunner
          adb shell am force-stop com.sy220284.dshmobile.debug || true
          adb shell monkey -p com.sy220284.dshmobile.debug -c android.intent.category.LAUNCHER 1
          sleep 2
          adb shell pidof com.sy220284.dshmobile.debug
          adb shell am force-stop com.sy220284.dshmobile.debug || true
          adb install -r .ci/device-apks/app-optimized.apk
          bash .github/scripts/smoke-test-android-startup.sh com.sy220284.dshmobile.debug

  merge-gate:
    if: always()
    needs:
      - scope
      - static-gates
      - architecture-3-gates
      - fixture-provenance
      - unit-tests
      - relay-conformance
      - build-arm64
      - device-artifacts-x86
      - android-16-instrumented
      - android-17-instrumented
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected CI lane to succeed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_NAME: ${{ needs.scope.outputs.scope }}
          REQUIRE_STATIC: ${{ needs.scope.outputs.run_static }}
          REQUIRE_ARCHITECTURE: ${{ needs.scope.outputs.run_architecture }}
          REQUIRE_FIXTURE: ${{ needs.scope.outputs.run_fixture }}
          REQUIRE_UNIT: ${{ needs.scope.outputs.run_unit }}
          REQUIRE_RELAY: ${{ needs.scope.outputs.run_relay }}
          REQUIRE_BUILD: ${{ needs.scope.outputs.run_build }}
          REQUIRE_DEVICE: ${{ needs.scope.outputs.run_device }}
          REQUIRE_ANDROID16: ${{ needs.scope.outputs.run_android16 }}
          REQUIRE_ANDROID17: ${{ needs.scope.outputs.run_android17 }}
          STATIC_RESULT: ${{ needs.static-gates.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture-3-gates.result }}
          FIXTURE_RESULT: ${{ needs.fixture-provenance.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          RELAY_RESULT: ${{ needs.relay-conformance.result }}
          BUILD_RESULT: ${{ needs.build-arm64.result }}
          DEVICE_RESULT: ${{ needs.device-artifacts-x86.result }}
          ANDROID16_RESULT: ${{ needs.android-16-instrumented.result }}
          ANDROID17_RESULT: ${{ needs.android-17-instrumented.result }}
        run: |
          set -eu
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "::error::CI 范围识别失败：$SCOPE_RESULT"
            exit 1
          fi

          check_lane() {
            required="$1"
            result="$2"
            lane="$3"
            if [ "$required" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "::error::$lane 为本次任务必需检查，但结果为 $result"
                exit 1
              fi
            elif [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::$lane 虽非本次必需检查，但出现异常结果：$result"
              exit 1
            fi
          }

          check_lane "$REQUIRE_STATIC" "$STATIC_RESULT" "static-gates"
          check_lane "$REQUIRE_ARCHITECTURE" "$ARCHITECTURE_RESULT" "architecture-3-gates"
          check_lane "$REQUIRE_FIXTURE" "$FIXTURE_RESULT" "fixture-provenance"
          check_lane "$REQUIRE_UNIT" "$UNIT_RESULT" "unit-tests"
          check_lane "$REQUIRE_RELAY" "$RELAY_RESULT" "relay-conformance"
          check_lane "$REQUIRE_BUILD" "$BUILD_RESULT" "build-arm64"
          check_lane "$REQUIRE_DEVICE" "$DEVICE_RESULT" "device-artifacts-x86"
          check_lane "$REQUIRE_ANDROID16" "$ANDROID16_RESULT" "android-16-instrumented"
          check_lane "$REQUIRE_ANDROID17" "$ANDROID17_RESULT" "android-17-instrumented"

          echo "CI 合并门禁通过：scope=$SCOPE_NAME，所有本次必需检查均成功"
