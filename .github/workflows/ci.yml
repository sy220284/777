name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'screen.png'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/release-version'
      - '**/src/test/**'
      - '**/src/testFixtures/**'
      - '**/src/androidTest/**'
      - 'tools/reference-validation/**'
      - 'tools/capture/**'
      - 'reference-validation/**'
      - 'mock-harness/**'
      - 'upstream/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      run_automation: ${{ steps.classify.outputs.run_automation }}
      run_preflight: ${{ steps.classify.outputs.run_preflight }}
      run_build: ${{ steps.classify.outputs.run_build }}
      run_android16: ${{ steps.classify.outputs.run_android16 }}
      run_android17: ${{ steps.classify.outputs.run_android17 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Collect changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git ls-files > changed-files.txt
            echo "手动执行：强制完整 CI"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMRD "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            base="$BEFORE_SHA"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse "$CURRENT_SHA^")"
            fi
            git diff --name-only --diff-filter=ACMRD "$base" "$CURRENT_SHA" > changed-files.txt
            git diff --check "$base" "$CURRENT_SHA"
          fi
          echo "本次变更文件："
          cat changed-files.txt
      - name: Classify CI scope
        id: classify
        run: |
          args=(--paths-file changed-files.txt --github-output "$GITHUB_OUTPUT")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            args+=(--force-full)
          fi
          python3 .github/scripts/classify-ci-scope.py "${args[@]}"

  automation-check:
    needs: scope
    if: ${{ needs.scope.outputs.run_automation == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate CI scope policy
        run: python3 .github/scripts/classify-ci-scope.py --self-test
      - name: Validate workflow YAML syntax
        run: |
          ruby -rpsych -e 'ARGV.each { |file| Psych.parse_file(file); puts "YAML OK: #{file}" }' .github/workflows/*.yml
      - name: Validate Python and shell automation syntax
        run: |
          python3 -m compileall -q .github/scripts
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find .github/scripts -type f -name '*.sh' -print0)
      - name: Validate static guard behavior
        run: |
          python3 .github/scripts/check-ui-hardcoded-cjk.py
          python3 .github/scripts/check-ui-design-system-boundaries.py
          python3 .github/scripts/check-notification-presentation.py
          python3 .github/scripts/check-kotlin-risk-patterns.py
          python3 .github/scripts/check-local-performance-invariants.py
          python3 .github/scripts/check-local-architecture-boundaries.py
      - name: Validate release version format
        run: |
          value="$(tr -d '\r\n' < .github/release-version)"
          [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+-777\.[0-9]+$ ]]

  preflight:
    needs: scope
    if: ${{ needs.scope.outputs.run_preflight == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify official golden fixture provenance
        run: |
          corepack enable
          bash tools/reference-validation/refresh-official-fixtures.sh
          git diff --exit-code -- reference-validation/src/test/resources/official
      - name: Guard hard-coded UI text
        run: python3 .github/scripts/check-ui-hardcoded-cjk.py
      - name: Guard UI design-system boundaries
        run: python3 .github/scripts/check-ui-design-system-boundaries.py
      - name: Guard notification presentation
        run: python3 .github/scripts/check-notification-presentation.py
      - name: Guard Kotlin risk patterns
        run: python3 .github/scripts/check-kotlin-risk-patterns.py
      - name: Guard local performance invariants
        run: python3 .github/scripts/check-local-performance-invariants.py
      - name: Guard local architecture boundaries
        run: python3 .github/scripts/check-local-architecture-boundaries.py
      - name: Test bundled runtime compactor
        run: python3 tools/runtime/compact-runtime-assets.py --self-test
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Unit tests
        run: ./gradlew :core:test :harness-core:test :harness-runtime-android:test :harness-interop:test :harness-device-android:testDebugUnitTest :mock-harness:test :app:testDebugUnitTest --stacktrace
      - name: Official Harness conformance
        run: ./gradlew :reference-validation:test --stacktrace

  build:
    needs: [scope, preflight]
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.run_build == 'true' && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Lint
        run: |
          set +e
          ./gradlew :app:lintDebug --stacktrace
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== lint text report ==="
            find app/build -type f -name 'lint-results-debug.txt' -print -exec cat {} \; || true
          fi
          exit "$status"
      - name: Assemble optimized APK
        run: ./gradlew :app:assembleOptimized --stacktrace
      - name: Verify Android 16 APK
        run: .github/scripts/verify-android16-apk.sh app/build/outputs/apk/optimized/app-optimized.apk
      - name: Enforce APK size budget
        run: |
          BYTES="$(stat -c '%s' app/build/outputs/apk/optimized/app-optimized.apk)"
          BUDGET=94371840
          echo "Optimized APK: $BYTES bytes (budget: $BUDGET)"
          test "$BYTES" -le "$BUDGET"
      - name: Upload optimized APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-mobile-optimized
          path: app/build/outputs/apk/optimized/*.apk
          retention-days: 3

  android-16-instrumented:
    needs: [scope, preflight]
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.run_android16 == 'true' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::error::/dev/kvm is unavailable on this runner"
            exit 1
          fi
      - name: Android 16 instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          script: |
            DSH_RUNTIME_ABIS=x86_64 ./gradlew :app:connectedDebugAndroidTest :app:assembleDebug :app:assembleOptimized --stacktrace
            adb shell am force-stop com.sy220284.dshmobile.debug || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.sy220284.dshmobile.debug -c android.intent.category.LAUNCHER 1
            sleep 2
            adb shell pidof com.sy220284.dshmobile.debug
            adb shell am force-stop com.sy220284.dshmobile.debug || true
            adb install -r app/build/outputs/apk/optimized/app-optimized.apk
            bash .github/scripts/smoke-test-android-startup.sh com.sy220284.dshmobile.debug

  android-17-instrumented:
    needs: [scope, preflight]
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.run_android17 == 'true' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools emulator platforms;android-37.0 build-tools;37.0.0 system-images;android-37.0;google_apis_ps16k;x86_64'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::error::/dev/kvm is unavailable on this runner"
            exit 1
          fi
      - name: Android 17 instrumentation tests
        run: |
          echo no | avdmanager create avd --force -n android17 \
            --package 'system-images;android-37.0;google_apis_ps16k;x86_64'
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd android17 \
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim &
          adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          set +e
          DSH_RUNTIME_ABIS=x86_64 ./gradlew :app:connectedDebugAndroidTest :app:assembleDebug :app:assembleOptimized --stacktrace
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== connected test XML ==="
            find app/build -type f -path '*androidTest-results*' -name '*.xml' -print -exec cat {} \; || true
            exit "$status"
          fi
          set -e
          adb shell am force-stop com.sy220284.dshmobile.debug || true
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell monkey -p com.sy220284.dshmobile.debug -c android.intent.category.LAUNCHER 1
          sleep 2
          adb shell pidof com.sy220284.dshmobile.debug
          adb shell am force-stop com.sy220284.dshmobile.debug || true
          adb install -r app/build/outputs/apk/optimized/app-optimized.apk
          bash .github/scripts/smoke-test-android-startup.sh com.sy220284.dshmobile.debug

  # 统一合并门禁：根据 scope 只要求本次任务需要的 lane 成功。
  # 若仓库启用分支保护，应只要求 “CI / merge-gate”。
  merge-gate:
    if: always()
    needs:
      - scope
      - automation-check
      - preflight
      - build
      - android-16-instrumented
      - android-17-instrumented
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all selected CI lanes to succeed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_NAME: ${{ needs.scope.outputs.scope }}
          REQUIRE_AUTOMATION: ${{ needs.scope.outputs.run_automation }}
          REQUIRE_PREFLIGHT: ${{ needs.scope.outputs.run_preflight }}
          REQUIRE_BUILD: ${{ needs.scope.outputs.run_build }}
          REQUIRE_ANDROID16: ${{ needs.scope.outputs.run_android16 }}
          REQUIRE_ANDROID17: ${{ needs.scope.outputs.run_android17 }}
          AUTOMATION_RESULT: ${{ needs.automation-check.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          ANDROID16_RESULT: ${{ needs['android-16-instrumented'].result }}
          ANDROID17_RESULT: ${{ needs['android-17-instrumented'].result }}
        run: |
          set -eu

          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "::error::CI 范围识别失败：$SCOPE_RESULT"
            exit 1
          fi

          check_lane() {
            required="$1"
            result="$2"
            lane="$3"

            if [ "$required" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "::error::$lane 为本次任务必需检查，但结果为 $result"
                exit 1
              fi
            elif [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::$lane 虽非本次必需检查，但出现异常结果：$result"
              exit 1
            fi
          }

          check_lane "$REQUIRE_AUTOMATION" "$AUTOMATION_RESULT" "automation-check"
          check_lane "$REQUIRE_PREFLIGHT" "$PREFLIGHT_RESULT" "preflight"
          check_lane "$REQUIRE_BUILD" "$BUILD_RESULT" "build"
          check_lane "$REQUIRE_ANDROID16" "$ANDROID16_RESULT" "android-16-instrumented"
          check_lane "$REQUIRE_ANDROID17" "$ANDROID17_RESULT" "android-17-instrumented"

          echo "CI 合并门禁通过：scope=$SCOPE_NAME，所有本次必需检查均成功"
