name: 功能树与源码证据自动同步
on:
  push:
    branches:
      - refactor/restore-native-v63-remove-ui3-zhaoxi-20261019
      - fix/large-file-stability-20261031
      - feat/architecture-31-20261031
      - 'feat/ui-*'
      - feat/codex-capability-alignment-20261112
    # The source fingerprint scans repository-wide Kotlin, Python, shell, Gradle and
    # workflow files. A partial path allowlist made some code changes invisible here.
    # Only machine-written outputs are excluded; mixed source+generated pushes still run.
    paths-ignore:
      - 'docs/FEATURE-TREE.zh-CN.md'
      - 'docs/FEATURE-TREE.zh-CN.html'
      - 'docs/FEATURE-SOURCE-INDEX.auto.json'
      - 'docs/FEATURE-REVIEW.auto.json'
      - 'docs/ACCEPTANCE-MATRIX.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: feature-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild-index:
    if: github.repository == 'sy220284/777' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: 基于分支最新源码可靠重建索引并提交
        id: sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A PR may receive more changes while this job runs. Rebase the generated output
          # by regenerating from the latest remote snapshot, not by force-pushing stale docs.
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin "refs/heads/${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            python3 .github/scripts/sync-feature-tree.py
            python3 .github/scripts/check-feature-tree-sync.py
            git add docs/FEATURE-TREE.zh-CN.md docs/FEATURE-TREE.zh-CN.html docs/ACCEPTANCE-MATRIX.json docs/FEATURE-TREE-SOURCE-REGISTRY.json docs/FEATURE-SOURCE-INDEX.auto.json docs/FEATURE-REVIEW.auto.json
            if git diff --cached --quiet; then
              echo "功能证据已与分支最新源码一致，无需提交"
              echo "updated=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "自动同步真实源码功能树与证据索引"
            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              echo "updated=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "远端分支已前进，第 $attempt 次重建发生竞争，将基于最新提交重试"
            sleep "$((attempt * 2))"
          done
          echo "::error::最新分支索引同步连续发生冲突"
          exit 1
      - name: 对机器人写回的最新提交直接触发完整代码和设备验收
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The GITHUB_TOKEN push does not trigger normal push/PR workflows.
          # workflow_dispatch is the official exception: run tests on the generated HEAD.
          expected="$(git rev-parse HEAD)"
          actual="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "分支已经出现更新的源码提交，将由最新提交对应的 CI 验收"
            exit 0
          fi
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
          gh workflow run android-page-matrix.yml --ref "$GITHUB_REF_NAME"
