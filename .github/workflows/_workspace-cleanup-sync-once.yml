name: 工作区缓存清理源码索引一次性同步
on:
  push:
    branches: [fix/large-file-stability-20261031]
    paths:
      - .github/workflows/_workspace-cleanup-sync-once.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 获取提交
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/large-file-stability-20261031
          persist-credentials: true
      - name: 更新官方索引并移除临时工作流
        run: |
          set -euo pipefail
          rm .github/workflows/_workspace-cleanup-sync-once.yml
          python3 .github/scripts/sync-feature-tree.py
          python3 .github/scripts/check-feature-tree-sync.py
          python3 .github/scripts/sync-feature-tree.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/FEATURE-TREE.zh-CN.md docs/FEATURE-TREE.zh-CN.html docs/FEATURE-SOURCE-INDEX.auto.json docs/FEATURE-REVIEW.auto.json
          git add -u .github/workflows/_workspace-cleanup-sync-once.yml
          git diff --cached --quiet && exit 0
          git commit -m '更新工作区中间产物清理功能索引并移除一次性同步工作流'
          git push origin HEAD:fix/large-file-stability-20261031
