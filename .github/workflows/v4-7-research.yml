name: v4-7-research

on:
  push:
    branches: [v4-7-optimization]
    paths:
      - 'tools/v4_7_research.py'
      - 'tools/v4_7_research_strict.py'
      - 'tools/v4_7_fast_repair.py'
      - 'models/**'
      - 'data/**'
      - 'requirements.txt'
      - '.github/workflows/v4-7-research.yml'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 编译检查
        run: python -m compileall -q tools models
      - name: 运行快模型补漏研究
        run: python tools/v4_7_fast_repair.py
      - name: 保存研究结果
        uses: actions/upload-artifact@v4
        with:
          name: v4-7-fast-repair-summary
          path: backtests/v4_7/fast_repair_summary.json
          if-no-files-found: error
