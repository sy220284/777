name: v452-experiment

on:
  push:
    branches:
      - v4-5-2-tiered-concentration
    paths:
      - 'models/v4_5_2/**'
      - '.github/workflows/v452-experiment.yml'
      - 'models/v4/**'
      - 'models/v4_3/**'
      - 'models/v4_5/**'
      - 'models/v4_5_1/**'
      - 'tools/load_history.py'
      - 'data/**'
  pull_request:
    branches:
      - main
    paths:
      - 'models/v4_5_2/**'
      - '.github/workflows/v452-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 编译检查
        run: python -m compileall -q models/v4_5_2
      - name: 数据完整性检查
        run: python ssq.py verify
      - name: 分层集中度严格前向实验
        run: python models/v4_5_2/experiment.py
      - name: 输出关键结果
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('backtests/v4_5_2/experiment_summary.json')
          x = json.loads(p.read_text(encoding='utf-8'))
          print('BASELINE', json.dumps(x['baseline_v451'], ensure_ascii=False))
          for name, row in x['variants'].items():
              print('VARIANT', name, json.dumps(row['delta_vs_v451'], ensure_ascii=False))
              print('FORWARD56', name, json.dumps(row['forward56'], ensure_ascii=False))
              print('TIERS', name, json.dumps(row['signal_tier_counts'], ensure_ascii=False))
          PY
