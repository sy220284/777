name: v452-experiment

on:
  push:
    branches:
      - v4-5-2-tiered-concentration
    paths:
      - 'models/v4_5_2/**'
      - '.github/workflows/v452-experiment.yml'
      - 'models/v4/**'
      - 'models/v4_3/**'
      - 'models/v4_5/**'
      - 'models/v4_5_1/**'
      - 'tools/load_history.py'
      - 'data/**'
  pull_request:
    branches:
      - main
    paths:
      - 'models/v4_5_2/**'
      - '.github/workflows/v452-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 编译检查
        run: python -m compileall -q models/v4_5_2
      - name: 数据完整性检查
        run: python ssq.py verify
      - name: 蓝球最终奖级转化实验
        run: python models/v4_5_2/blue_prize_conversion.py
      - name: 输出奖级关键结果
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path('backtests/v4_5_2/blue_prize_conversion_summary.json').read_text(encoding='utf-8'))
          b = x['summaries']['v451_baseline']
          print('BASE_FULL', json.dumps(b['full'], ensure_ascii=False))
          print('BASE_FORWARD56', json.dumps(b['forward56'], ensure_ascii=False))
          for name, delta in x['delta_vs_v451'].items():
              print('DELTA', name, json.dumps(delta, ensure_ascii=False))
              print('FULL', name, json.dumps(x['summaries'][name]['full'], ensure_ascii=False))
              print('FORWARD56', name, json.dumps(x['summaries'][name]['forward56'], ensure_ascii=False))
          PY
