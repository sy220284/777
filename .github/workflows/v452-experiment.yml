name: v452-experiment

on:
  push:
    branches:
      - v4-5-2-tiered-concentration
    paths:
      - 'models/v4_5_2/**'
      - '.github/workflows/v452-experiment.yml'
      - 'models/v4/**'
      - 'tools/load_history.py'
      - 'data/**'
  pull_request:
    branches:
      - main
    paths:
      - 'models/v4_5_2/**'
      - '.github/workflows/v452-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 编译检查
        run: python -m compileall -q models/v4_5_2
      - name: 数据完整性检查
        run: python ssq.py verify
      - name: 独立时序红球特征实验
        run: python models/v4_5_2/feature_experiment.py
      - name: 输出新特征关键结果
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path('backtests/v4_5_2/feature_experiment_summary.json').read_text(encoding='utf-8'))
          base = x['summaries']['v4_baseline']
          print('BASE_FULL', json.dumps(base['full'], ensure_ascii=False))
          print('BASE_FORWARD56', json.dumps(base['forward56'], ensure_ascii=False))
          for name, check in x['promotion_checks'].items():
              print('CANDIDATE', name, json.dumps(check, ensure_ascii=False))
              print('FULL', name, json.dumps(x['summaries'][name]['full'], ensure_ascii=False))
              print('FORWARD56', name, json.dumps(x['summaries'][name]['forward56'], ensure_ascii=False))
          PY
