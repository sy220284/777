name: Cleanup Old Releases

on:
  release:
    types: [published]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-old-releases-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep latest three published releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "777-release-retention",
          }

          releases = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  batch = json.load(resp)

              if not batch:
                  break

              releases.extend(
                  release for release in batch
                  if not release.get("draft")
                  and not release.get("prerelease")
                  and release.get("published_at")
              )
              if len(batch) < 100:
                  break
              page += 1

          version_pattern = re.compile(r"^v(\d+)\.(\d+)\.(\d+)-777\.(\d+)$")

          def release_sort_key(release):
              match = version_pattern.match(release.get("tag_name") or "")
              if match:
                  version = tuple(int(part) for part in match.groups())
                  return (1, *version, release.get("published_at") or "", release.get("id") or 0)
              return (0, 0, 0, 0, 0, release.get("published_at") or "", release.get("id") or 0)

          formal_releases = [
              release for release in releases
              if version_pattern.match(release.get("tag_name") or "")
          ]
          formal_releases.sort(key=release_sort_key, reverse=True)

          keep = formal_releases[:3]
          remove = formal_releases[3:]

          print("保留版本号最高的 3 个已发布版本：")
          for release in keep:
              print(f"  - {release['tag_name']} ({release['published_at']})")

          if not remove:
              print("没有需要清理的旧发行版。")
              raise SystemExit(0)

          print(f"准备删除 {len(remove)} 个旧发行版；Git 标签与提交历史不会删除。")
          for release in remove:
              url = f"https://api.github.com/repos/{repo}/releases/{release['id']}"
              req = urllib.request.Request(url, headers=headers, method="DELETE")
              try:
                  with urllib.request.urlopen(req) as resp:
                      if resp.status not in (200, 204):
                          raise RuntimeError(
                              f"删除 {release['tag_name']} 失败：HTTP {resp.status}"
                          )
              except Exception as exc:
                  raise RuntimeError(
                      f"删除 {release['tag_name']} 失败：{exc}"
                  ) from exc
              print(f"已删除：{release['tag_name']}")
          PY
