name: Cleanup Old Releases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-old-releases.yml'
  workflow_run:
    workflows: ['Release APK']
    types: [completed]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-old-releases-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep recent published releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "777-release-retention",
          }

          releases = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  batch = json.load(resp)

              if not batch:
                  break

              releases.extend(
                  release for release in batch
                  if not release.get("draft") and release.get("published_at")
              )

              if len(batch) < 100:
                  break
              page += 1

          releases.sort(
              key=lambda release: (
                  release.get("published_at") or "",
                  release.get("created_at") or "",
                  release.get("id") or 0,
              ),
              reverse=True,
          )

          cutoff = datetime.now(timezone.utc) - timedelta(days=14)
          newest_ids = {release["id"] for release in releases[:3]}

          def published_at(release):
              return datetime.fromisoformat(release["published_at"].replace("Z", "+00:00"))

          keep = [
              release for release in releases
              if release["id"] in newest_ids or published_at(release) >= cutoff
          ]
          keep_ids = {release["id"] for release in keep}
          remove = [release for release in releases if release["id"] not in keep_ids]

          print("保留发行版（至少最新 3 个，并保留最近 14 天）：")
          for release in keep:
              print(f"  - {release['tag_name']} ({release['published_at']})")

          if not remove:
              print("没有需要清理的旧发行版。")
              raise SystemExit(0)

          print(f"准备删除 {len(remove)} 个旧发行版；Git 标签与提交历史不会删除。")

          for release in remove:
              url = f"https://api.github.com/repos/{repo}/releases/{release['id']}"
              req = urllib.request.Request(url, headers=headers, method="DELETE")
              try:
                  with urllib.request.urlopen(req) as resp:
                      if resp.status not in (200, 204):
                          raise RuntimeError(
                              f"删除 {release['tag_name']} 失败：HTTP {resp.status}"
                          )
              except Exception as exc:
                  raise RuntimeError(
                      f"删除 {release['tag_name']} 失败：{exc}"
                  ) from exc

              print(f"已删除：{release['tag_name']}")
          PY
