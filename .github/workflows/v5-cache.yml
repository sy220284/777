name: V5 causal cache

on:
  push:
    branches:
      - research/v5-milestone
    paths:
      - 'tools/v5_export_research_cache.py'
      - '.github/workflows/v5-cache.yml'
  workflow_dispatch:

jobs:
  export-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn

      - name: Rebuild and validate frozen history
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/ipdisabled/fetch_data/master/ssq_data.csv \
            -o /tmp/ssq_source.csv
          python - <<'PY'
          import csv
          from pathlib import Path

          source = Path('/tmp/ssq_source.csv')
          out = Path('/tmp/base_rebuilt.csv')
          rows = []
          with source.open('r', encoding='utf-8-sig', newline='') as f:
              for row in csv.DictReader(f):
                  if int(row['index']) <= 2026049:
                      rows.append(row)
          if len(rows) != 3446:
              raise SystemExit(f'重建基础期数不符: {len(rows)}')
          if int(rows[0]['index']) != 2003001 or int(rows[-1]['index']) != 2026049:
              raise SystemExit('重建基础首尾期号不符')
          with out.open('w', encoding='utf-8', newline='') as f:
              w = csv.writer(f, lineterminator='\n')
              w.writerow(['seq','red1','red2','red3','red4','red5','red6','blue'])
              for seq, row in enumerate(rows, 1):
                  w.writerow([seq, *(int(row[f'r{i}']) for i in range(1, 7)), int(row['b1'])])
          PY
          gzip -c /tmp/base_rebuilt.csv > data/ssq_history_2003_2026-05-03.csv.gz
          python tools/load_history.py --out /tmp/current_history.csv

      - name: Export causal cache
        run: |
          python tools/v5_export_research_cache.py \
            --out backtests/v5_research/v4_causal_cache.npz \
            --meta backtests/v5_research/v4_causal_cache_meta.json

      - name: Upload cache
        uses: actions/upload-artifact@v4
        with:
          name: v5-causal-cache
          path: |
            backtests/v5_research/v4_causal_cache.npz
            backtests/v5_research/v4_causal_cache_meta.json
          retention-days: 7
