name: 升级构建工具后重新生成校验和与调试包
on:
  push:
    branches:
      - chore/upgrade-build-toolchain-20261008
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verification-refresh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 27
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: 检查新版构建基线
        run: python3 .github/scripts/check-build-baseline.py
      - name: 更新校验和与 Wrapper 并完整编译
        run: |
          set -euo pipefail
          ./gradlew wrapper --gradle-version 9.8.1 --gradle-distribution-sha256-sum dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f --write-verification-metadata sha256 --stacktrace
          ./gradlew :core:test :harness-core:test :harness-runtime-android:test :harness-interop:test :harness-device-android:testDebugUnitTest :mock-harness:test :app:testDebugUnitTest :reference-validation:test :app:assembleDebug :app:lintDebug --write-verification-metadata sha256 --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          # Gradle wrapper 更新时产生尾部空白；使用仓库已有的跨平台启动脚本。
          git restore -- gradlew gradlew.bat
          git diff --check
      - name: 将依赖校验结果提交到升级分支
        run: |
          set -euo pipefail
          git add gradle/verification-metadata.xml gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m '更新新版依赖校验哈希与 Gradle Wrapper'
            git push origin HEAD:chore/upgrade-build-toolchain-20261008
          fi
      - name: 上传新版调试 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-upgraded-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
