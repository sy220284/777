name: v46-outball-features

on:
  push:
    branches:
      - v4-6-nonlinear-challenger
    paths:
      - "tools/v4_6_outball_features.py"
      - ".github/workflows/v46-outball-features.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 编译检查
        run: python -m compileall -q tools/v4_6_outball_features.py models
      - name: 运行出球顺序因果特征实验
        run: python tools/v4_6_outball_features.py
      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: v46-outball-features
          path: backtests/v4_6/outball_features.json
          if-no-files-found: error
