name: Capture README UI

on:
  push:
    branches:
      - docs/readme-user-flow
    paths:
      - '.github/workflows/capture-readme-ui.yml'
      - 'app/src/androidTest/java/com/labteto/dshmobile/ui/screens/local/ReadmeUiScreenshotCaptureTest.kt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "::error::/dev/kvm is unavailable on this runner"
            exit 1
          fi
      - name: Capture current Android UI
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          script: |
            set -eux
            DSH_RUNTIME_ABIS=x86_64 ./gradlew :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.labteto.dshmobile.ui.screens.local.ReadmeUiScreenshotCaptureTest \
              --stacktrace

            mkdir -p docs/images/current
            for file in navigation.png chat.png work.png character-tuning.png usage.png; do
              adb exec-out run-as com.sy220284.dshmobile.debug \
                cat "files/readme-screenshots/${file}" > "docs/images/current/${file}"
              test -s "docs/images/current/${file}"
            done

            python3 - <<'PY'
            from pathlib import Path
            import struct

            expected = {
                "navigation.png",
                "chat.png",
                "work.png",
                "character-tuning.png",
                "usage.png",
            }
            root = Path("docs/images/current")
            found = {p.name for p in root.glob("*.png")}
            if found != expected:
                raise SystemExit(f"截图集合不匹配: expected={sorted(expected)} found={sorted(found)}")
            for path in sorted(root.glob("*.png")):
                data = path.read_bytes()
                if data[:8] != b"\x89PNG\r\n\x1a\n":
                    raise SystemExit(f"{path} 不是有效 PNG")
                width, height = struct.unpack(">II", data[16:24])
                if width < 300 or height < 500:
                    raise SystemExit(f"{path} 尺寸异常: {width}x{height}")
                print(f"{path}: {width}x{height}, {len(data)} bytes")
            PY

      - name: Commit captured screenshots
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/current/*.png
          if git diff --cached --quiet; then
            echo "界面截图没有变化"
            exit 0
          fi
          git commit -m "更新 README 当前界面截图"
          git push origin HEAD:"${GITHUB_REF_NAME}"
