name: Capture README UI

on:
  push:
    branches:
      - docs/readme-screenshot-capture
    paths:
      - '.github/workflows/capture-readme-ui.yml'
      - 'app/src/debug/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "::error::/dev/kvm is unavailable on this runner"
            exit 1
          fi
      - name: Capture current Android UI
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          script: |
            bash <<'BASH'
            set -euo pipefail
            DSH_RUNTIME_ABIS=x86_64 ./gradlew :app:assembleDebug --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            mkdir -p docs/images/current

            capture_screen() {
              local screen="$1"
              local output="$2"
              local ready=0

              adb logcat -c
              adb shell am force-stop com.sy220284.dshmobile.debug
              adb shell am start -W \
                -n com.sy220284.dshmobile.debug/com.labteto.dshmobile.ui.screens.local.ReadmeScreenshotActivity \
                --es readme_screen "$screen"

              for attempt in $(seq 1 80); do
                if adb logcat -d -s ReadmeScreenshot:I '*:S' | grep -Fq "READY:$screen"; then
                  ready=1
                  break
                fi
                sleep 0.25
              done
              test "$ready" -eq 1

              adb exec-out screencap -p > "$output"
              test -s "$output"
            }

            capture_screen navigation docs/images/current/navigation.png
            capture_screen chat docs/images/current/chat.png
            capture_screen work docs/images/current/work.png
            capture_screen character-tuning docs/images/current/character-tuning.png
            capture_screen usage docs/images/current/usage.png

            python3 - <<'PY'
            from pathlib import Path
            import struct

            expected = {
                "navigation.png",
                "chat.png",
                "work.png",
                "character-tuning.png",
                "usage.png",
            }
            files = sorted(Path("docs/images/current").glob("*.png"))
            assert {p.name for p in files} == expected

            for path in files:
                data = path.read_bytes()
                assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), f"{path} invalid PNG"
                width, height = struct.unpack(">II", data[16:24])
                assert width >= 300, f"{path} width={width}"
                assert height >= 500, f"{path} height={height}"
                assert len(data) > 10_000, f"{path} bytes={len(data)}"
            PY
            BASH

      - name: Upload captured screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readme-current-ui
          path: docs/images/current/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit captured screenshots
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/images/current
          if git diff --cached --quiet; then
            echo "界面截图没有变化"
            exit 0
          fi
          git commit -m "更新 README 当前界面截图"
          git push origin HEAD:"${GITHUB_REF_NAME}"
