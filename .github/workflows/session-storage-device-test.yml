name: 本地会话存储 Android 迁移实测

'on':
  pull_request:
    paths:
      - 'app/src/main/java/com/labteto/dshmobile/local/model/LocalRequestMessageSurface.kt'
      - 'app/src/main/java/com/labteto/dshmobile/local/LocalRequestEvidenceSurfaceMemo.kt'
      - 'app/src/main/java/com/labteto/dshmobile/local/LocalModelRequestCoordinator.kt'
      - 'app/src/main/java/com/labteto/dshmobile/local/session/**'
      - 'app/src/main/java/com/labteto/dshmobile/local/runtime/LocalSessionStorageRuntime.kt'
      - 'app/src/androidTest/java/com/labteto/dshmobile/local/session/**'
      - '.github/workflows/session-storage-device-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: session-storage-device-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration:
    name: Android 36 SQLite V6 迁移与搜索回归
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 27
      - uses: ./.github/actions/setup-android-cached
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: 允许模拟器使用 KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: 运行 SQLite 旧数据迁移、空间索引及删除实测
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --max-workers=2 :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.labteto.dshmobile.local.session.SqliteRequestDeltaMigrationAndroidTest,com.labteto.dshmobile.local.session.SqliteEventSearchBlockIndexAndroidTest --stacktrace --console=plain
      - name: 失败时输出真实断言
        if: failure()
        run: |
          find app/build/outputs/androidTest-results -type f -name '*.xml' -print -exec grep -n -A 16 -B 3 -E '<failure|<error' {} \; || true
      - name: 保存模拟器执行结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-storage-v6-android-tests
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7
