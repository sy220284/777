name: 数百兆文件独立完整单测验收
on:
  push:
    branches:
      - fix/large-file-stability-20261031
    paths:
      - .github/workflows/_large-file-unit-once.yml

permissions:
  contents: write

jobs:
  test-large-files:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: 检出待验收代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/large-file-stability-20261031
          persist-credentials: true
      - name: 安装Java编译环境
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 27
      - name: 安装Android构建依赖
        uses: ./.github/actions/setup-android-cached
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: 设置Gradle缓存
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: 全量JVM与功能一致性测试
        run: |
          ./gradlew :core:test :harness-core:test :harness-runtime-android:test :harness-interop:test :harness-device-android:testDebugUnitTest :app:testDebugUnitTest :reference-validation:test --continue --stacktrace
          python3 .github/scripts/check-jvm21-bytecode.py
      - name: 无论结果如何清理临时测试工作流并重新同步源码索引
        if: always()
        run: |
          set -euo pipefail
          rm .github/workflows/_large-file-unit-once.yml
          python3 .github/scripts/sync-feature-tree.py
          python3 .github/scripts/check-feature-tree-sync.py
          python3 .github/scripts/sync-feature-tree.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/FEATURE-TREE.zh-CN.md docs/FEATURE-TREE.zh-CN.html docs/FEATURE-SOURCE-INDEX.auto.json docs/FEATURE-REVIEW.auto.json
          git add -u .github/workflows/_large-file-unit-once.yml
          git commit -m '完成大文件独立单测并清理临时验收工作流'
          git push origin HEAD:fix/large-file-stability-20261031
