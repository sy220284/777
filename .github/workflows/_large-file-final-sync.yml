name: 大文件验收索引一致性修复
on:
  push:
    branches: [fix/large-file-stability-20261031]
    paths:
      - .github/workflows/_large-file-final-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/large-file-stability-20261031
          persist-credentials: true
      - name: 移除一次性配置并生成最终索引
        run: |
          set -euo pipefail
          rm .github/workflows/_large-file-final-sync.yml
          python3 .github/scripts/sync-feature-tree.py
          python3 .github/scripts/check-feature-tree-sync.py
          python3 .github/scripts/sync-feature-tree.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/FEATURE-TREE.zh-CN.md docs/FEATURE-TREE.zh-CN.html docs/FEATURE-SOURCE-INDEX.auto.json docs/FEATURE-REVIEW.auto.json
          git add -u .github/workflows/_large-file-final-sync.yml
          git diff --cached --quiet && exit 0
          git commit -m '修复大文件验收测试后同步功能索引并清理临时工作流'
          git push origin HEAD:fix/large-file-stability-20261031
