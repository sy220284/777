name: 大文件修复分支功能索引一次性同步
on:
  push:
    branches:
      - fix/large-file-stability-20261031
    paths:
      - .github/workflows/_large-file-sync-once.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: 恢复最终工作树并生成权威功能索引
        run: |
          set -euo pipefail
          rm .github/workflows/_large-file-sync-once.yml
          python3 .github/scripts/sync-feature-tree.py
          python3 .github/scripts/check-feature-tree-sync.py
          git add -A .github/workflows/_large-file-sync-once.yml docs/FEATURE-TREE.zh-CN.md docs/FEATURE-TREE.zh-CN.html docs/ACCEPTANCE-MATRIX.json docs/FEATURE-TREE-SOURCE-REGISTRY.json docs/FEATURE-SOURCE-INDEX.auto.json docs/FEATURE-REVIEW.auto.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "按最终源码自动同步功能树和性能修复索引"
          git push origin HEAD:fix/large-file-stability-20261031
