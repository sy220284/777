name: 大文件性能索引最终一致性同步
on:
  push:
    branches:
      - fix/large-file-stability-20261031
    paths:
      - .github/workflows/_large-file-sync-once.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出工作分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/large-file-stability-20261031
          persist-credentials: true
      - name: 删除自身后生成准确索引并提交
        run: |
          set -euo pipefail
          rm .github/workflows/_large-file-sync-once.yml
          python3 .github/scripts/sync-feature-tree.py
          python3 .github/scripts/check-feature-tree-sync.py
          python3 .github/scripts/sync-feature-tree.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/FEATURE-TREE.zh-CN.md docs/FEATURE-TREE.zh-CN.html docs/FEATURE-SOURCE-INDEX.auto.json docs/FEATURE-REVIEW.auto.json
          git add -u .github/workflows/_large-file-sync-once.yml
          git commit -m '同步大文件架构最终代码功能索引并清理一次性工作流'
          git push origin HEAD:fix/large-file-stability-20261031
