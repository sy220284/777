name: 大文件重构后一次性同步功能索引
on:
  push:
    branches:
      - fix/large-file-stability-20261031
    paths:
      - .github/workflows/_large-file-sync-once.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: 检出完整工作分支
        uses: actions/checkout@v4
        with:
          ref: fix/large-file-stability-20261031
          persist-credentials: true
      - name: 运行仓库官方索引生成器并删除一次性工作流
        run: |
          set -euo pipefail
          python3 .github/scripts/sync-feature-tree.py
          python3 .github/scripts/check-feature-tree-sync.py
          rm .github/workflows/_large-file-sync-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/FEATURE-TREE.zh-CN.md docs/FEATURE-TREE.html docs/FEATURE-SOURCE-INDEX.auto.json docs/FEATURE-REVIEW.auto.json
          git add -u .github/workflows/_large-file-sync-once.yml
          git commit -m '同步大文件性能重构后的功能索引并清理一次性工作流'
          git push origin HEAD:fix/large-file-stability-20261031
