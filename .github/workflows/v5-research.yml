name: V5 milestone blind test

on:
  push:
    branches:
      - research/v5-milestone
    paths:
      - 'tools/v5_core_fringe_experiment.py'
      - 'tools/v5_high_hit_diagnostics.py'
      - 'models/**'
      - 'data/**'
      - '.github/workflows/v5-research.yml'
  workflow_dispatch:

jobs:
  blind-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn

      - name: Rebuild and validate frozen history
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/ipdisabled/fetch_data/master/ssq_data.csv \
            -o /tmp/ssq_source.csv
          python - <<'PY'
          import csv
          from pathlib import Path

          source = Path('/tmp/ssq_source.csv')
          base_out = Path('/tmp/base_rebuilt.csv')
          increment = Path('data/increment_2026050_2026104.csv')
          rows = []
          source_by_issue = {}
          with source.open('r', encoding='utf-8-sig', newline='') as f:
              for row in csv.DictReader(f):
                  issue = int(row['index'])
                  source_by_issue[issue] = (
                      tuple(int(row[f'r{i}']) for i in range(1, 7)),
                      int(row['b1']),
                  )
                  if issue <= 2026049:
                      rows.append(row)

          if len(rows) != 3446:
              raise SystemExit(f'重建基础期数不符: {len(rows)} != 3446')
          if int(rows[0]['index']) != 2003001 or int(rows[-1]['index']) != 2026049:
              raise SystemExit('重建基础首尾期号不符')

          with base_out.open('w', encoding='utf-8', newline='') as f:
              w = csv.writer(f, lineterminator='\n')
              w.writerow(['seq','red1','red2','red3','red4','red5','red6','blue'])
              for seq, row in enumerate(rows, 1):
                  w.writerow([seq, *(int(row[f'r{i}']) for i in range(1, 7)), int(row['b1'])])

          overlap_checked = 0
          with increment.open('r', encoding='utf-8-sig', newline='') as f:
              for row in csv.DictReader(f):
                  issue = int(row['issue'])
                  if issue not in source_by_issue:
                      continue
                  expected = source_by_issue[issue]
                  actual = (tuple(int(row[f'red{i}']) for i in range(1, 7)), int(row['blue']))
                  if actual != expected:
                      raise SystemExit(f'增量与独立源不一致: issue={issue} actual={actual} source={expected}')
                  overlap_checked += 1

          print(f'rebuilt_base_draws={len(rows)}')
          print(f'independent_increment_overlap_checked={overlap_checked}')
          print('base_first=', rows[0]['index'], rows[0]['time'])
          print('base_last=', rows[-1]['index'], rows[-1]['time'])
          PY
          gzip -c /tmp/base_rebuilt.csv > data/ssq_history_2003_2026-05-03.csv.gz
          python tools/load_history.py --out /tmp/current_history.csv

      - name: Run causal V5 experiment
        run: |
          python tools/v5_core_fringe_experiment.py \
            --summary backtests/v5_research/core_fringe_summary.json \
            --details backtests/v5_research/core_fringe_details.csv

      - name: Diagnose V4.5 high-hit events
        run: |
          python tools/v5_high_hit_diagnostics.py \
            --out backtests/v5_research/high_hit_diagnostics.json

      - name: Print milestone summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('backtests/v5_research/core_fringe_summary.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          for name, row in d['strategies'].items():
              f = row['full']
              fw = row['new_forward_seq_ge_3447']
              print(
                  name,
                  'highest=', f['highest_prize'],
                  '4+=', f['red_4plus_draws'],
                  '5+=', f['red_5plus_draws'],
                  '6=', f['red_6_draws'],
                  'return=', f['fixed_return_yuan'],
                  'forward_highest=', fw['highest_prize'],
                  'forward_4+=', fw['red_4plus_draws'],
                  'forward_5+=', fw['red_5plus_draws'],
                  'forward_return=', fw['fixed_return_yuan'],
              )
          PY

      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: v5-core-fringe-results
          path: backtests/v5_research/
          retention-days: 7
