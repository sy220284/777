name: PR705 One-Time Feature Tree Rebuild

on:
  push:
    branches: [feat/ui-r4-pluggable]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Regenerate and independently validate the feature tree
        run: |
          set -euo pipefail
          python3 .github/scripts/sync-feature-tree.py --self-test
          python3 .github/scripts/audit-feature-reality.py --self-test
          python3 .github/scripts/sync-feature-tree.py
          python3 .github/scripts/audit-feature-reality.py
          python3 .github/scripts/check-feature-tree-sync.py
          python3 .github/scripts/sync-feature-tree.py --check
          python3 .github/scripts/audit-feature-reality.py --check
      - name: Commit only generated feature-tree evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FEATURE-TREE.zh-CN.md docs/FEATURE-TREE.zh-CN.html \
                  docs/FEATURE-SOURCE-INDEX.auto.json docs/FEATURE-REVIEW.auto.json \
                  docs/ACCEPTANCE-MATRIX.json docs/FEATURE-REALITY-AUDIT.auto.json \
                  docs/FEATURE-REALITY-AUDIT.zh-CN.md
          if git diff --cached --quiet; then
            echo "Generated evidence already current"
          else
            git commit -m "docs(audit): rebuild feature tree evidence from PR705 current sources"
            git push origin HEAD:refs/heads/feat/ui-r4-pluggable
          fi
