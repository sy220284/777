name: 777 聊天与工作真实设备交互回归

'on':
  pull_request:
    paths:
      - 'app/src/main/java/com/labteto/dshmobile/notify/**'
      - 'app/src/androidTest/java/com/labteto/dshmobile/notify/**'
      - 'app/src/main/java/com/labteto/dshmobile/local/chat/**'
      - 'app/src/main/java/com/labteto/dshmobile/local/work/**'
      - 'app/src/main/java/com/labteto/dshmobile/local/model/**'
      - 'app/src/main/java/com/labteto/dshmobile/local/tools/**'
      - 'app/src/main/java/com/labteto/dshmobile/ui/screens/local/**'
      - 'app/src/main/java/com/labteto/dshmobile/ui/screens/settings/**'
      - 'app/src/androidTest/java/com/labteto/dshmobile/ui/screens/local/**'
      - 'app/src/androidTest/java/com/labteto/dshmobile/ui/screens/settings/**'
      - 'app/src/androidTest/java/com/shenyan/designsystem/**'
      - 'app/src/androidTest/java/com/labteto/dshmobile/ui/audit/**'
      - 'app/src/main/java/com/shenyan/designsystem/**'
      - 'app/src/main/java/com/labteto/dshmobile/ui/shenyan/**'
      - 'harness-core/src/**'
      - 'harness-interop/src/**'
      - 'harness-device-android/src/**'
      - '.github/workflows/runtime-user-journey.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-user-journey-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  user-journey:
    name: Android 36 聊天工作权限与结果展示实测
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 27
      - uses: ./.github/actions/setup-android-cached
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: 检查 Android 模拟器硬件加速
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: 模拟器执行聊天输入、工作进度、团队交互和授权引导回归
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            status=0
            ./gradlew --max-workers=2 :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.labteto.dshmobile.ui.screens.local.LocalConversationComposerRegressionTest,com.labteto.dshmobile.ui.screens.local.LocalAgentTeamUiRegressionTest,com.labteto.dshmobile.ui.screens.local.WorkBackgroundReplyAndroidTest,com.labteto.dshmobile.ui.screens.settings.PermissionSetupFlowAndroidTest,com.labteto.dshmobile.notify.NotificationRoutingAndroidTest,com.shenyan.designsystem.components.MobileActionReadabilityTest,com.labteto.dshmobile.ui.screens.local.WorkspaceBrowseLayoutTest --stacktrace --console=plain || status=$?
            mkdir -p app/build/outputs/ui-audit
            if ! adb pull /sdcard/Android/data/com.sy220284.dshmobile.debug/files/ui-audit/. app/build/outputs/ui-audit/; then
              echo "::error::原生界面截图未能导出"
              if [ "$status" -eq 0 ]; then status=1; fi
            fi
            exit "$status"
      - name: 失败时输出真实断言
        if: failure()
        run: |
          find app/build/outputs/androidTest-results -type f -name '*.xml' -print -exec grep -n -A 16 -B 3 -E '<failure|<error' {} \; || true
      - name: 保存 Android 用户路径测试结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-user-journey-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/outputs/ui-audit/
          if-no-files-found: warn
          retention-days: 7
