name: v46-conversion-headroom

on:
  push:
    branches:
      - v4-6-nonlinear-challenger
    paths:
      - "tools/v4_6_conversion_headroom.py"
      - ".github/workflows/v46-conversion-headroom.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 编译检查
        run: python -m compileall -q tools/v4_6_conversion_headroom.py models
      - name: 运行转换上限诊断
        run: python tools/v4_6_conversion_headroom.py
      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: v46-conversion-headroom
          path: backtests/v4_6/conversion_headroom.json
          if-no-files-found: error
