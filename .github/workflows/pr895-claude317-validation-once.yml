name: PR895 Claude317 执行链回归（一次性）

on:
  push:
    branches:
      - fix/pr895-claude317-runtime-contracts-20261114

permissions:
  contents: read

jobs:
  verify:
    name: Kotlin 定向回归和 Android 编译
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 27
      - uses: ./.github/actions/setup-android-cached
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: 回归监听刷新、会话采样与 MCP 来源控制
        run: |
          ./gradlew --max-workers=2 :app:testDebugUnitTest \
            --tests com.labteto.dshmobile.local.files.LocalWorkspaceFileChangesTest \
            --tests com.labteto.dshmobile.local.model.LocalConversationSampleCoordinatorTest \
            --tests com.labteto.dshmobile.local.tools.ipc.LocalMcpNetworkAdmissionTest \
            --tests com.labteto.dshmobile.local.work.LocalWorkReviewObligationsTest \
            --stacktrace --console=plain
      - name: 编译 Android 安装包与仪表测试
        run: ./gradlew --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --console=plain
