name: Generate Gradle verification metadata

on:
  push:
    branches:
      - fix/remaining-root-causes-20261002

permissions:
  contents: read

concurrency:
  group: gradle-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Resolve CI dependency graph and generate verification metadata
        run: |
          ./gradlew --write-verification-metadata sha256 \
            :core:test \
            :harness-core:test \
            :harness-runtime-android:test \
            :harness-interop:test \
            :harness-device-android:testDebugUnitTest \
            :mock-harness:test \
            :app:testDebugUnitTest \
            :reference-validation:test \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :app:assembleOptimized \
            --stacktrace
          test -s gradle/verification-metadata.xml

      - name: Upload Gradle verification metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gradle-verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
