name: Commit Gradle verification metadata

on:
  push:
    branches:
      - fix/remaining-root-causes-20261002

permissions:
  contents: write
  actions: read

concurrency:
  group: gradle-verification-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5

      - name: Restore previously verified Gradle metadata artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11223136401/zip > /tmp/gradle-verification.zip
          echo "ab2ca84a077de00f7d9cb6d0b067e40a67dfb467c27c76e0971e413789c0d87f  /tmp/gradle-verification.zip" | sha256sum -c -
          mkdir -p /tmp/gradle-verification
          unzip -q /tmp/gradle-verification.zip -d /tmp/gradle-verification
          test -s /tmp/gradle-verification/verification-metadata.xml
          mkdir -p gradle
          cp /tmp/gradle-verification/verification-metadata.xml gradle/verification-metadata.xml

      - name: Commit Gradle verification metadata
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "Gradle verification metadata is already current"
          else
            git commit -m "补充 Gradle 依赖完整性校验元数据"
            git push origin HEAD:fix/remaining-root-causes-20261002
          fi
