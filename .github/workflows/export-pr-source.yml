name: PR 源码快照（临时）

on:
  pull_request:
    paths:
      - '.github/workflows/export-pr-source.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 打包当前 PR 源码
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.gradle -czf "$RUNNER_TEMP/777-pr448-source.tar.gz" .
      - name: 上传源码快照
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-pr448-source
          path: ${{ runner.temp }}/777-pr448-source.tar.gz
          retention-days: 1
          if-no-files-found: error
