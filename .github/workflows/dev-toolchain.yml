name: 开发工具链

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 手工验证时重点检查的工具链档位
        required: true
        default: build
        type: choice
        options:
          - build
          - full
  schedule:
    # Artifact 保留 30 天；每月 1 日和 20 日刷新全量组件，客户端下载时仍按缺失项获取。
    - cron: '17 3 1,20 * *'
  pull_request:
    paths:
      - 'tools/dev/**'
      - '.github/workflows/dev-toolchain.yml'
      - '.github/workflows/ci.yml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'gradle/libs.versions.toml'
      - 'docs/DEVELOPMENT.md'
      - 'docs/README.md'
      - 'CONTRIBUTING.md'

permissions:
  contents: read

concurrency:
  group: dev-toolchain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: 打包离线工具链组件
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-toolchain-home

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 验证工具链脚本与离线约束
        run: |
          set -euo pipefail
          bash -n tools/dev/setup-toolchain.sh
          bash -n tools/dev/ai-toolchain.sh
          bash -n tools/dev/install.sh
          bash tools/dev/install.sh --help >/dev/null
          if bash tools/dev/install.sh install build >/dev/null 2>&1; then
            echo "仓库内 install.sh 不应在缺少组件 Artifact 时完成安装。" >&2
            exit 1
          fi
          bash tools/dev/setup-toolchain.sh --self-test
          if grep -RInE '^[[:space:]]*(curl|wget|apt-get)([[:space:]]|$)' tools/dev --include='*.sh' || grep -RIn 'download_verified' tools/dev --include='*.sh'; then
            echo "本地工具链脚本出现外部下载/包管理入口；必须由 Artifact 提供依赖。" >&2
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: 准备 Emulator 与 Android 16/17 镜像
        run: |
          set -euo pipefail
          source tools/dev/toolchain-versions.env
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager emulator "$ANDROID_16_SYSTEM_IMAGE" "$ANDROID_17_SYSTEM_IMAGE"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3

      - name: 准备 actionlint
        run: |
          set -euo pipefail
          source tools/dev/toolchain-versions.env
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ARCHIVE}"
          curl --fail --location --retry 3 "$URL" -o "$RUNNER_TEMP/$ARCHIVE"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_X64_SHA256" "$RUNNER_TEMP/$ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/actionlint-bin"
          "$RUNNER_TEMP/actionlint-bin/actionlint" -version

      - name: 预热 Gradle、Kotlin/AGP、测试与 Runtime 构建依赖
        run: |
          set -euo pipefail
          ./gradlew             :core:test             :harness-core:test             :harness-runtime-android:test             :harness-interop:test             :harness-device-android:testDebugUnitTest             :mock-harness:test             :app:testDebugUnitTest             :reference-validation:test             :app:lintDebug             :app:assembleDebugAndroidTest             :app:assembleOptimized             --stacktrace

      - name: 生成按需组件 Artifact
        run: |
          set -euo pipefail
          source tools/dev/toolchain-versions.env

          ROOT="$RUNNER_TEMP/components"
          STAGE="$RUNNER_TEMP/component-stage"
          rm -rf "$ROOT" "$STAGE"
          mkdir -p "$ROOT" "$STAGE"

          create_component() {
            local component="$1" stage="$2" out="$ROOT/777-toolchain-${component}-latest"
            rm -rf "$out"
            mkdir -p "$out"
            cat > "$out/component.env" <<EOF
ARTIFACT_SCHEMA=3
ARTIFACT_COMPONENT=$component
ARTIFACT_ARCH=x64
ARTIFACT_HEAD_SHA=$GITHUB_SHA
JDK_MAJOR=$JDK_MAJOR
ANDROID_COMPILE_API=$ANDROID_COMPILE_API
ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS
GRADLE_VERSION=$GRADLE_VERSION
KOTLIN_VERSION=$KOTLIN_VERSION
AGP_VERSION=$AGP_VERSION
NODE_VERSION=$NODE_VERSION
ACTIONLINT_VERSION=$ACTIONLINT_VERSION
EOF
            tar -h -C "$stage" -cf - . | gzip -1 > "$out/payload.tar.gz"
            (
              cd "$out"
              sha256sum component.env payload.tar.gz > SHA256SUMS
              sha256sum -c SHA256SUMS
            )
          }

          prepare_stage() {
            local component="$1"
            local dir="$STAGE/$component"
            rm -rf "$dir"
            mkdir -p "$dir"
            printf '%s\n' "$dir"
          }

          JDK_STAGE="$(prepare_stage jdk)"
          ln -s "$JAVA_HOME" "$JDK_STAGE/jdk"
          create_component jdk "$JDK_STAGE"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          PLATFORM_DIR="$SDK_ROOT/platforms/android-$ANDROID_COMPILE_API"
          if [ ! -d "$PLATFORM_DIR" ]; then
            PLATFORM_DIR="$SDK_ROOT/platforms/android-${ANDROID_COMPILE_API}.0"
          fi
          test -d "$PLATFORM_DIR"

          ANDROID_STAGE="$(prepare_stage android-core)"
          mkdir -p "$ANDROID_STAGE/android-sdk/build-tools" "$ANDROID_STAGE/android-sdk/platforms"
          ln -s "$SDK_ROOT/cmdline-tools" "$ANDROID_STAGE/android-sdk/cmdline-tools"
          ln -s "$SDK_ROOT/platform-tools" "$ANDROID_STAGE/android-sdk/platform-tools"
          ln -s "$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS" "$ANDROID_STAGE/android-sdk/build-tools/$ANDROID_BUILD_TOOLS"
          ln -s "$PLATFORM_DIR" "$ANDROID_STAGE/android-sdk/platforms/$(basename "$PLATFORM_DIR")"
          if [ -d "$SDK_ROOT/licenses" ]; then
            ln -s "$SDK_ROOT/licenses" "$ANDROID_STAGE/android-sdk/licenses"
          fi
          create_component android-core "$ANDROID_STAGE"

          GRADLE_BIN="$(find "$GRADLE_USER_HOME/wrapper/dists" -type f -path "*/gradle-$GRADLE_VERSION/bin/gradle" -print -quit)"
          test -n "$GRADLE_BIN"
          GRADLE_DIST_HOME="$(cd "$(dirname "$GRADLE_BIN")/.." && pwd)"

          GRADLE_STAGE="$(prepare_stage gradle-runtime)"
          ln -s "$GRADLE_DIST_HOME" "$GRADLE_STAGE/gradle"
          create_component gradle-runtime "$GRADLE_STAGE"

          rm -rf "$GRADLE_USER_HOME/daemon"
          find "$GRADLE_USER_HOME" -type f -name '*.lock' -delete || true
          GRADLE_DEPS_STAGE="$(prepare_stage gradle-deps)"
          ln -s "$GRADLE_USER_HOME" "$GRADLE_DEPS_STAGE/gradle-user-home"
          create_component gradle-deps "$GRADLE_DEPS_STAGE"

          test -d .gradle/runtime-cache
          RUNTIME_STAGE="$(prepare_stage runtime-cache)"
          ln -s "$GITHUB_WORKSPACE/.gradle/runtime-cache" "$RUNTIME_STAGE/runtime-cache"
          create_component runtime-cache "$RUNTIME_STAGE"

          NODE_BIN="$(readlink -f "$(command -v node)")"
          NODE_HOME="$(cd "$(dirname "$NODE_BIN")/.." && pwd)"
          NODE_STAGE="$(prepare_stage node)"
          ln -s "$NODE_HOME" "$NODE_STAGE/node-current"
          create_component node "$NODE_STAGE"

          ACTIONLINT_STAGE="$(prepare_stage actionlint)"
          mkdir -p "$ACTIONLINT_STAGE/bin"
          ln -s "$RUNNER_TEMP/actionlint-bin/actionlint" "$ACTIONLINT_STAGE/bin/actionlint"
          create_component actionlint "$ACTIONLINT_STAGE"

          test -d "$SDK_ROOT/emulator"
          EMULATOR_STAGE="$(prepare_stage emulator)"
          mkdir -p "$EMULATOR_STAGE/android-sdk"
          ln -s "$SDK_ROOT/emulator" "$EMULATOR_STAGE/android-sdk/emulator"
          create_component emulator "$EMULATOR_STAGE"

          test -d "$SDK_ROOT/system-images/android-36"
          IMAGE16_STAGE="$(prepare_stage android-image-16)"
          mkdir -p "$IMAGE16_STAGE/android-sdk/system-images"
          ln -s "$SDK_ROOT/system-images/android-36" "$IMAGE16_STAGE/android-sdk/system-images/android-36"
          create_component android-image-16 "$IMAGE16_STAGE"

          test -d "$SDK_ROOT/system-images/android-37.0"
          IMAGE17_STAGE="$(prepare_stage android-image-17)"
          mkdir -p "$IMAGE17_STAGE/android-sdk/system-images"
          ln -s "$SDK_ROOT/system-images/android-37.0" "$IMAGE17_STAGE/android-sdk/system-images/android-37.0"
          create_component android-image-17 "$IMAGE17_STAGE"

          du -sh "$ROOT"/*

      - name: 上传 JDK 组件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-jdk-latest
          path: ${{ runner.temp }}/components/777-toolchain-jdk-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 Android 核心组件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-android-core-latest
          path: ${{ runner.temp }}/components/777-toolchain-android-core-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 Gradle Runtime 组件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-gradle-runtime-latest
          path: ${{ runner.temp }}/components/777-toolchain-gradle-runtime-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 Gradle 依赖缓存组件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-gradle-deps-latest
          path: ${{ runner.temp }}/components/777-toolchain-gradle-deps-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 Runtime 缓存组件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-runtime-cache-latest
          path: ${{ runner.temp }}/components/777-toolchain-runtime-cache-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 Node 组件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-node-latest
          path: ${{ runner.temp }}/components/777-toolchain-node-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 actionlint 组件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-actionlint-latest
          path: ${{ runner.temp }}/components/777-toolchain-actionlint-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 Emulator 组件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-emulator-latest
          path: ${{ runner.temp }}/components/777-toolchain-emulator-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 Android 16 镜像组件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-android-image-16-latest
          path: ${{ runner.temp }}/components/777-toolchain-android-image-16-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 Android 17 镜像组件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-android-image-17-latest
          path: ${{ runner.temp }}/components/777-toolchain-android-image-17-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  verify-install:
    name: 离线安装回归（${{ matrix.profile }}）
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile:
          - build
          - full

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 下载 JDK 组件
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-jdk-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-jdk-latest

      - name: 下载 Android 核心组件
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-android-core-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-android-core-latest

      - name: 下载 Gradle Runtime 组件
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-gradle-runtime-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-gradle-runtime-latest

      - name: 下载 Gradle 依赖缓存组件
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-gradle-deps-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-gradle-deps-latest

      - name: 下载 Runtime 缓存组件
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-runtime-cache-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-runtime-cache-latest

      - name: 下载 Node 组件
        if: matrix.profile == 'full'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-node-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-node-latest

      - name: 下载 actionlint 组件
        if: matrix.profile == 'full'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-actionlint-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-actionlint-latest

      - name: 下载 Emulator 组件
        if: matrix.profile == 'full'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-emulator-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-emulator-latest

      - name: 下载 Android 16 镜像组件
        if: matrix.profile == 'full'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-android-image-16-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-android-image-16-latest

      - name: 下载 Android 17 镜像组件
        if: matrix.profile == 'full'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-android-image-17-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-android-image-17-latest

      - name: 从组件 Artifact 按需安装并复检
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/777-tools"
          ENV_FILE="$RUNNER_TEMP/777-dev-toolchain.env"
          STATE_DIR="$RUNNER_TEMP/777-ai-state"
          ARTIFACTS="$RUNNER_TEMP/artifacts"

          export DEV777_TOOLS_ROOT="$TOOLS"
          export DEV777_ANDROID_SDK_ROOT="$TOOLS/android-sdk"
          export DEV777_GRADLE_HOME="$TOOLS/gradle"
          export DEV777_GRADLE_USER_HOME="$TOOLS/gradle-user-home"
          export DEV777_TOOLCHAIN_ENV_FILE="$ENV_FILE"
          export DEV777_TOOLCHAIN_STATE_DIR="$STATE_DIR"
          export DEV777_REPO_ROOT="$GITHUB_WORKSPACE"
          export DEV777_ARTIFACTS_DIR="$ARTIFACTS"

          PLAN_JSON="$(bash tools/dev/ai-toolchain.sh plan --profile "$PROFILE")"
          printf '%s\n' "$PLAN_JSON"

          if [ "$PROFILE" = full ]; then
            bash tools/dev/install.sh install full --artifacts-dir "$ARTIFACTS" --create-avds
          else
            bash tools/dev/install.sh install build --artifacts-dir "$ARTIFACTS"
          fi

          # shellcheck source=/dev/null
          source "$ENV_FILE"

          javac -version
          gradle --version
          adb version
          test -d "$GRADLE_USER_HOME/caches/modules-2"
          test -d "$GITHUB_WORKSPACE/.gradle/runtime-cache"

          CHECK_JSON="$(bash tools/dev/ai-toolchain.sh check --profile "$PROFILE")"
          printf '%s\n' "$CHECK_JSON"
          printf '%s\n' "$CHECK_JSON" | grep -F '"status": "ready"'

          bash tools/dev/ai-toolchain.sh gradle :app:assembleDebug --stacktrace

          if [ "$PROFILE" = full ]; then
            node --version
            actionlint -version
            emulator -version | head -n 1
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" list avd | grep -F 'Name: 777-android16'
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" list avd | grep -F 'Name: 777-android17'
          fi
