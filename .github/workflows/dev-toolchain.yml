name: 开发工具链

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 手工验证时重点检查的工具链档位
        required: true
        default: build
        type: choice
        options:
          - build
          - full
  schedule:
    # Artifact 保留 30 天；每月 1 日和 20 日同时刷新 build/full 两套离线产物。
    - cron: '17 3 1,20 * *'
  pull_request:
    paths:
      - 'tools/dev/**'
      - '.github/workflows/dev-toolchain.yml'
      - '.github/workflows/ci.yml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'gradle/libs.versions.toml'
      - 'docs/DEVELOPMENT.md'
      - 'docs/README.md'
      - 'CONTRIBUTING.md'

permissions:
  contents: read

concurrency:
  group: dev-toolchain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: 打包离线工具链（${{ matrix.profile }}）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile:
          - build
          - full

    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/777-gradle-home

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 验证工具链脚本与离线约束
        run: |
          set -euo pipefail
          bash -n tools/dev/setup-toolchain.sh
          bash -n tools/dev/ai-toolchain.sh
          bash -n tools/dev/install.sh
          if bash tools/dev/install.sh --help >/dev/null 2>&1; then
            echo "仓库内 install.sh 不应在没有 Artifact payload 时进入安装流程" >&2
            exit 1
          fi
          bash tools/dev/setup-toolchain.sh --self-test
          if grep -RInE '\b(curl|wget|apt-get)\b|download_verified' tools/dev --include='*.sh'; then
            echo "本地工具链脚本出现外部下载/包管理入口；必须由 Artifact 提供依赖。" >&2
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: full 档准备 Emulator 与 Android 16/17 镜像
        if: matrix.profile == 'full'
        run: |
          set -euo pipefail
          source tools/dev/toolchain-versions.env
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager emulator "$ANDROID_16_SYSTEM_IMAGE" "$ANDROID_17_SYSTEM_IMAGE"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.profile == 'full'
        with:
          node-version: 22.23.3

      - name: full 档准备 actionlint
        if: matrix.profile == 'full'
        run: |
          set -euo pipefail
          source tools/dev/toolchain-versions.env
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ARCHIVE}"
          curl --fail --location --retry 3 "$URL" -o "$RUNNER_TEMP/$ARCHIVE"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_X64_SHA256" "$RUNNER_TEMP/$ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/actionlint-bin"
          "$RUNNER_TEMP/actionlint-bin/actionlint" -version

      - name: 预热 Gradle、Kotlin/AGP、测试与 Runtime 构建依赖
        run: |
          set -euo pipefail
          ./gradlew             :core:test             :harness-core:test             :harness-runtime-android:test             :harness-interop:test             :harness-device-android:testDebugUnitTest             :mock-harness:test             :app:testDebugUnitTest             :reference-validation:test             :app:assembleDebug             --stacktrace
          if [ "${{ matrix.profile }}" = full ]; then
            ./gradlew :app:lintDebug :app:assembleDebugAndroidTest :app:assembleOptimized --stacktrace
          fi

      - name: 生成完整离线 Artifact payload
        run: |
          set -euo pipefail
          source tools/dev/toolchain-versions.env

          ROOT="$RUNNER_TEMP/777-dev-toolchain-${{ matrix.profile }}"
          PAYLOAD="$RUNNER_TEMP/777-payload-${{ matrix.profile }}"
          rm -rf "$ROOT" "$PAYLOAD"
          mkdir -p "$ROOT/tools" "$ROOT/docs" "$ROOT/payload" "$PAYLOAD"

          cp -a tools/dev "$ROOT/tools/dev"
          cp tools/dev/install.sh "$ROOT/install.sh"
          cp docs/DEVELOPMENT.md "$ROOT/docs/"

          mkdir -p "$PAYLOAD/jdk"
          cp -a "$JAVA_HOME"/. "$PAYLOAD/jdk/"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          mkdir -p "$PAYLOAD/android-sdk"
          cp -a "$SDK_ROOT/cmdline-tools" "$PAYLOAD/android-sdk/"
          cp -a "$SDK_ROOT/platform-tools" "$PAYLOAD/android-sdk/"
          mkdir -p "$PAYLOAD/android-sdk/build-tools" "$PAYLOAD/android-sdk/platforms"
          cp -a "$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS" "$PAYLOAD/android-sdk/build-tools/"
          if [ -d "$SDK_ROOT/platforms/android-$ANDROID_COMPILE_API" ]; then
            cp -a "$SDK_ROOT/platforms/android-$ANDROID_COMPILE_API" "$PAYLOAD/android-sdk/platforms/"
          else
            cp -a "$SDK_ROOT/platforms/android-${ANDROID_COMPILE_API}.0" "$PAYLOAD/android-sdk/platforms/"
          fi
          if [ -d "$SDK_ROOT/licenses" ]; then
            cp -a "$SDK_ROOT/licenses" "$PAYLOAD/android-sdk/"
          fi

          if [ "${{ matrix.profile }}" = full ]; then
            cp -a "$SDK_ROOT/emulator" "$PAYLOAD/android-sdk/"
            mkdir -p "$PAYLOAD/android-sdk/system-images"
            cp -a "$SDK_ROOT/system-images/android-36" "$PAYLOAD/android-sdk/system-images/"
            cp -a "$SDK_ROOT/system-images/android-37.0" "$PAYLOAD/android-sdk/system-images/"
          fi

          GRADLE_BIN="$(find "$GRADLE_USER_HOME/wrapper/dists" -type f -path "*/gradle-$GRADLE_VERSION/bin/gradle" -print -quit)"
          test -n "$GRADLE_BIN"
          GRADLE_DIST_HOME="$(cd "$(dirname "$GRADLE_BIN")/.." && pwd)"
          cp -a "$GRADLE_DIST_HOME" "$PAYLOAD/gradle"

          rm -rf "$GRADLE_USER_HOME/daemon"
          cp -a "$GRADLE_USER_HOME" "$PAYLOAD/gradle-user-home"

          if [ -d .gradle/runtime-cache ]; then
            cp -a .gradle/runtime-cache "$PAYLOAD/runtime-cache"
          else
            echo "预热后仍缺少 .gradle/runtime-cache，无法保证本地离线 Runtime 构建。" >&2
            exit 1
          fi

          if [ "${{ matrix.profile }}" = full ]; then
            NODE_BIN="$(readlink -f "$(command -v node)")"
            NODE_HOME="$(cd "$(dirname "$NODE_BIN")/.." && pwd)"
            cp -a "$NODE_HOME" "$PAYLOAD/node-current"
            mkdir -p "$PAYLOAD/bin"
            cp -a "$RUNNER_TEMP/actionlint-bin/actionlint" "$PAYLOAD/bin/actionlint"
          fi

          cat > "$ROOT/payload/manifest.env" <<EOF
          ARTIFACT_SCHEMA=2
          ARTIFACT_PROFILE=${{ matrix.profile }}
          ARTIFACT_ARCH=x64
          ARTIFACT_HEAD_SHA=$GITHUB_SHA
          JDK_MAJOR=$JDK_MAJOR
          ANDROID_COMPILE_API=$ANDROID_COMPILE_API
          ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS
          GRADLE_VERSION=$GRADLE_VERSION
          KOTLIN_VERSION=$KOTLIN_VERSION
          AGP_VERSION=$AGP_VERSION
          NODE_VERSION=$NODE_VERSION
          ACTIONLINT_VERSION=$ACTIONLINT_VERSION
          EOF

          cat > "$ROOT/安装说明.txt" <<EOF
          777 本地开发工具链（${{ matrix.profile }}）

          本包是完整离线构建产物。
          包内已包含 JDK、Android SDK、Gradle、Kotlin/AGP/项目 Gradle 依赖缓存与 Runtime 构建缓存。
          full 档额外包含 Node.js、actionlint、Android Emulator 和 Android 16/17 system image。

          安装：
            ./install.sh ${{ matrix.profile }}

          AI / Agent：
            bash tools/dev/ai-toolchain.sh bootstrap --profile ${{ matrix.profile }}
            bash tools/dev/ai-toolchain.sh gradle :app:assembleDebug

          本地安装禁止通过其他渠道补齐依赖。
          EOF

          tar -C "$PAYLOAD" -cf - . | gzip -1 > "$ROOT/payload/toolchain.tar.gz"

          (
            cd "$ROOT"
            find install.sh tools docs payload 安装说明.txt -type f -print0               | sort -z               | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

          du -sh "$ROOT" "$ROOT/payload/toolchain.tar.gz"

      - name: 上传 build 离线工具链产物
        if: matrix.profile == 'build'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-dev-toolchain-build-latest
          path: ${{ runner.temp }}/777-dev-toolchain-build
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 full 离线工具链产物
        if: matrix.profile == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-dev-toolchain-full-latest
          path: ${{ runner.temp }}/777-dev-toolchain-full
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  verify-install:
    name: 离线安装回归（${{ matrix.profile }}）
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile:
          - build
          - full

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 下载对应离线工具链产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-dev-toolchain-${{ matrix.profile }}-latest
          path: ${{ runner.temp }}/artifact

      - name: 从 Artifact 安装并复检
        run: |
          set -euo pipefail
          KIT="$RUNNER_TEMP/artifact"
          TOOLS="$RUNNER_TEMP/777-tools"
          ENV_FILE="$RUNNER_TEMP/777-dev-toolchain.env"
          STATE_DIR="$RUNNER_TEMP/777-ai-state"

          export DEV777_TOOLS_ROOT="$TOOLS"
          export DEV777_ANDROID_SDK_ROOT="$TOOLS/android-sdk"
          export DEV777_GRADLE_HOME="$TOOLS/gradle"
          export DEV777_GRADLE_USER_HOME="$TOOLS/gradle-user-home"
          export DEV777_TOOLCHAIN_ENV_FILE="$ENV_FILE"
          export DEV777_TOOLCHAIN_STATE_DIR="$STATE_DIR"
          export DEV777_REPO_ROOT="$GITHUB_WORKSPACE"

          cd "$KIT"
          sha256sum -c SHA256SUMS

          if [ "${{ matrix.profile }}" = full ]; then
            bash "$KIT/install.sh" full --create-avds
          else
            bash "$KIT/install.sh" build
          fi

          # shellcheck source=/dev/null
          source "$ENV_FILE"

          javac -version
          gradle --version
          adb version
          test -d "$GRADLE_USER_HOME/caches/modules-2"
          test -d "$GITHUB_WORKSPACE/.gradle/runtime-cache"

          CHECK_JSON="$(bash "$KIT/tools/dev/ai-toolchain.sh" check --profile "${{ matrix.profile }}")"
          printf '%s\n' "$CHECK_JSON"
          printf '%s\n' "$CHECK_JSON" | grep -F '"status": "ready"'

          cd "$GITHUB_WORKSPACE"
          bash "$KIT/tools/dev/ai-toolchain.sh" gradle :app:assembleDebug --stacktrace

          if [ "${{ matrix.profile }}" = full ]; then
            node --version
            actionlint -version
            emulator -version | head -n 1
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" list avd | grep -F 'Name: 777-android16'
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" list avd | grep -F 'Name: 777-android17'
          fi
