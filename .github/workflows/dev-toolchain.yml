name: 开发工具链

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 要生成并验证的本地工具链档位
        required: true
        default: build
        type: choice
        options:
          - build
          - full
  schedule:
    # Artifact 保留 30 天；每月 1 日和 20 日刷新一次，最长间隔 19 天。
    - cron: '17 3 1,20 * *'
  pull_request:
    paths:
      - 'tools/dev/**'
      - '.github/workflows/dev-toolchain.yml'
      - '.github/workflows/ci.yml'
      - 'docs/DEVELOPMENT.md'
      - 'docs/README.md'
      - 'CONTRIBUTING.md'

permissions:
  contents: read

concurrency:
  group: dev-toolchain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 验证工具链清单与脚本
        run: |
          bash -n tools/dev/setup-toolchain.sh
          bash -n tools/dev/ai-toolchain.sh
          bash -n tools/dev/install.sh
          bash tools/dev/install.sh --help >/dev/null
          bash tools/dev/setup-toolchain.sh --self-test

      - name: 生成一次解压即可使用的工具链包
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/777-dev-toolchain"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/tools" "$ROOT/docs"

          cp -a tools/dev "$ROOT/tools/dev"
          cp tools/dev/install.sh "$ROOT/install.sh"
          cp docs/DEVELOPMENT.md "$ROOT/docs/"

          cat > "$ROOT/安装说明.txt" <<'TXT'
          777 本地开发工具链

          人工使用：
            ./install.sh
            ./install.sh build
            ./install.sh full
            ./install.sh check build

          AI / Agent：
            bash tools/dev/ai-toolchain.sh bootstrap
            bash tools/dev/ai-toolchain.sh gradle :app:assembleDebug

          下载 GitHub Artifact ZIP 后只需要解压一次。
          install.sh 会自动校验包内 SHA256SUMS。
          详细说明见 docs/DEVELOPMENT.md。
          TXT

          chmod +x "$ROOT/install.sh" "$ROOT/tools/dev/install.sh" "$ROOT/tools/dev/setup-toolchain.sh" "$ROOT/tools/dev/ai-toolchain.sh"

          (
            cd "$ROOT"
            find install.sh tools docs 安装说明.txt -type f -print0               | sort -z               | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: 上传可自动续期的工具链产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-dev-toolchain-latest
          path: ${{ runner.temp }}/777-dev-toolchain
          retention-days: 30
          if-no-files-found: error

  verify-install:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 下载刚生成的工具链产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-dev-toolchain-latest
          path: ${{ runner.temp }}/artifact

      - name: 从一次解压产物自动安装并复检
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          PROFILE=build
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ -n "$DISPATCH_PROFILE" ]; then
            PROFILE="$DISPATCH_PROFILE"
          fi

          KIT="$RUNNER_TEMP/artifact"
          cd "$KIT"
          sha256sum -c SHA256SUMS
          test -x "$KIT/install.sh"
          bash "$KIT/install.sh" --help >/dev/null

          SDK="$RUNNER_TEMP/777-android-sdk"
          TOOLS="$RUNNER_TEMP/777-tools"
          ENV_FILE="$RUNNER_TEMP/777-dev-toolchain.env"
          STATE_DIR="$RUNNER_TEMP/777-ai-state"
          AI_TOOLCHAIN="$KIT/tools/dev/ai-toolchain.sh"

          export DEV777_TOOLS_ROOT="$TOOLS"
          export DEV777_ANDROID_SDK_ROOT="$SDK"
          export DEV777_TOOLCHAIN_ENV_FILE="$ENV_FILE"
          export DEV777_TOOLCHAIN_STATE_DIR="$STATE_DIR"
          export DEV777_REPO_ROOT="$GITHUB_WORKSPACE"

          BOOTSTRAP_JSON="$(bash "$AI_TOOLCHAIN" bootstrap --profile "$PROFILE")"
          printf '%s\n' "$BOOTSTRAP_JSON"
          printf '%s\n' "$BOOTSTRAP_JSON" | grep -F '"status": "ready"'

          CHECK_JSON="$(bash "$AI_TOOLCHAIN" check --profile "$PROFILE")"
          printf '%s\n' "$CHECK_JSON"
          printf '%s\n' "$CHECK_JSON" | grep -F '"status": "ready"'

          REPEAT_JSON="$(bash "$AI_TOOLCHAIN" bootstrap --profile "$PROFILE")"
          printf '%s\n' "$REPEAT_JSON"
          printf '%s\n' "$REPEAT_JSON" | grep -F '"status": "ready"'

          # shellcheck source=/dev/null
          source "$ENV_FILE"

          {
            echo "TOOLCHAIN_PROFILE=$PROFILE"
            echo "JAVA_HOME=$JAVA_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "DEV777_TOOLS_ROOT=$TOOLS"
            echo "DEV777_ANDROID_SDK_ROOT=$SDK"
            echo "DEV777_TOOLCHAIN_ENV_FILE=$ENV_FILE"
            echo "DEV777_TOOLCHAIN_STATE_DIR=$STATE_DIR"
            echo "DEV777_REPO_ROOT=$GITHUB_WORKSPACE"
            echo "AI_TOOLCHAIN=$AI_TOOLCHAIN"
          } >> "$GITHUB_ENV"

          {
            printf '%s\n' "$JAVA_HOME/bin"
            printf '%s\n' "$ANDROID_SDK_ROOT/platform-tools"
            printf '%s\n' "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
            printf '%s\n' "$ANDROID_SDK_ROOT/emulator"
            printf '%s\n' "$TOOLS/bin"
            if [ "$PROFILE" = full ]; then
              printf '%s\n' "$TOOLS/node-current/bin"
            fi
          } >> "$GITHUB_PATH"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .gradle/runtime-cache
          key: dev-toolchain-${{ runner.os }}-${{ hashFiles('tools/runtime/prepare-termux-*.sh', 'tools/runtime/prepare-hdiffpatch.sh') }}

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: 真实构建 smoke test
        run: |
          set -euo pipefail
          java -version
          bash "$AI_TOOLCHAIN" gradle -- :app:assembleDebug --stacktrace

  verify-full-pr:
    if: github.event_name == 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 下载同一工具链产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-dev-toolchain-latest
          path: ${{ runner.temp }}/artifact

      - name: 完整 full 档 Artifact 安装回归
        run: |
          set -euo pipefail
          KIT="$RUNNER_TEMP/artifact"
          SDK="$RUNNER_TEMP/777-full-android-sdk"
          TOOLS="$RUNNER_TEMP/777-full-tools"
          ENV_FILE="$RUNNER_TEMP/777-full-toolchain.env"

          cd "$KIT"
          sha256sum -c SHA256SUMS

          bash "$KIT/tools/dev/setup-toolchain.sh"             --auto             --profile full             --tools-root "$TOOLS"             --sdk-root "$SDK"             --env-file "$ENV_FILE"             --accept-android-licenses             --create-avds             --non-interactive

          bash "$KIT/tools/dev/setup-toolchain.sh"             --check             --profile full             --tools-root "$TOOLS"             --sdk-root "$SDK"             --env-file "$ENV_FILE"             --non-interactive

          # shellcheck source=/dev/null
          source "$ENV_FILE"
          node --version
          actionlint -version
          emulator -version | head -n 1
          "$SDK/cmdline-tools/latest/bin/avdmanager" list avd | grep -F 'Name: 777-android16'
          "$SDK/cmdline-tools/latest/bin/avdmanager" list avd | grep -F 'Name: 777-android17'
