name: 开发工具链

on:
  workflow_dispatch:
  schedule:
    # Artifact 保留 30 天；每月 1 日和 20 日刷新组件产物。
    - cron: '17 3 1,20 * *'
  pull_request:
    paths:
      - 'tools/dev/**'
      - '.github/workflows/dev-toolchain.yml'
      - '.github/workflows/ci.yml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'gradle/libs.versions.toml'
      - 'docs/DEVELOPMENT.md'
      - 'docs/README.md'
      - 'CONTRIBUTING.md'

permissions:
  contents: read

concurrency:
  group: dev-toolchain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: 生成按需组件 Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-toolchain-home

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 验证脚本、版本与组件清单
        run: |
          set -euo pipefail
          bash -n tools/dev/setup-toolchain.sh
          bash -n tools/dev/ai-toolchain.sh
          bash -n tools/dev/install.sh
          bash -n tools/dev/lib/components.sh
          bash tools/dev/install.sh --help >/dev/null
          bash tools/dev/setup-toolchain.sh --self-test
          if grep -RInE '^[[:space:]]*(curl|wget|apt-get)([[:space:]]|$)' tools/dev --include='*.sh' ||              grep -RIn 'download_verified' tools/dev --include='*.sh'; then
            echo "本地工具链脚本出现外部下载/包管理入口；组件只能来自 GitHub Actions Artifact。" >&2
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: 准备 Emulator 与 Android 16/17 镜像
        run: |
          set -euo pipefail
          source tools/dev/toolchain-versions.env
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager emulator "$ANDROID_16_SYSTEM_IMAGE" "$ANDROID_17_SYSTEM_IMAGE"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3

      - name: 准备 actionlint
        run: |
          set -euo pipefail
          source tools/dev/toolchain-versions.env
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ARCHIVE}"
          curl --fail --location --retry 3 "$URL" -o "$RUNNER_TEMP/$ARCHIVE"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_X64_SHA256" "$RUNNER_TEMP/$ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/actionlint-bin"
          "$RUNNER_TEMP/actionlint-bin/actionlint" -version

      - name: 预热 Gradle、Kotlin/AGP、测试与 Runtime 构建依赖
        run: |
          set -euo pipefail
          ./gradlew             :core:test             :harness-core:test             :harness-runtime-android:test             :harness-interop:test             :harness-device-android:testDebugUnitTest             :mock-harness:test             :app:testDebugUnitTest             :reference-validation:test             :app:lintDebug             :app:assembleDebug             :app:assembleDebugAndroidTest             :app:assembleOptimized             --stacktrace

      - name: 拆分并校验组件包
        run: |
          set -euo pipefail
          source tools/dev/toolchain-versions.env
          source tools/dev/toolchain-components.env

          OUT="$RUNNER_TEMP/toolchain-artifacts"
          STAGE="$RUNNER_TEMP/toolchain-stage"
          rm -rf "$OUT" "$STAGE"
          mkdir -p "$OUT" "$STAGE"

          make_component() {
            local component="$1" payload="$2"
            local root="$OUT/777-toolchain-$component-latest"
            mkdir -p "$root"
            cat > "$root/component.env" <<EOF
          ARTIFACT_SCHEMA=3
          ARTIFACT_COMPONENT=$component
          ARTIFACT_ARCH=x64
          ARTIFACT_HEAD_SHA=$GITHUB_SHA
          JDK_MAJOR=$JDK_MAJOR
          ANDROID_COMPILE_API=$ANDROID_COMPILE_API
          ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS
          GRADLE_VERSION=$GRADLE_VERSION
          KOTLIN_VERSION=$KOTLIN_VERSION
          AGP_VERSION=$AGP_VERSION
          NODE_VERSION=$NODE_VERSION
          ACTIONLINT_VERSION=$ACTIONLINT_VERSION
          EOF
            tar -h -C "$payload" -cf - . | gzip -1 > "$root/payload.tar.gz"
            (
              cd "$root"
              sha256sum component.env payload.tar.gz > SHA256SUMS
              sha256sum -c SHA256SUMS
            )
          }

          new_stage() {
            local component="$1" dir="$STAGE/$component"
            rm -rf "$dir"
            mkdir -p "$dir"
            printf '%s\n' "$dir"
          }

          JDK_STAGE="$(new_stage jdk)"
          ln -s "$JAVA_HOME" "$JDK_STAGE/jdk"
          make_component jdk "$JDK_STAGE"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          PLATFORM_DIR="$SDK_ROOT/platforms/android-$ANDROID_COMPILE_API"
          if [ ! -d "$PLATFORM_DIR" ]; then
            PLATFORM_DIR="$SDK_ROOT/platforms/android-${ANDROID_COMPILE_API}.0"
          fi
          test -d "$PLATFORM_DIR"

          ANDROID_STAGE="$(new_stage android-core)"
          mkdir -p "$ANDROID_STAGE/android-sdk/build-tools" "$ANDROID_STAGE/android-sdk/platforms"
          ln -s "$SDK_ROOT/cmdline-tools" "$ANDROID_STAGE/android-sdk/cmdline-tools"
          ln -s "$SDK_ROOT/platform-tools" "$ANDROID_STAGE/android-sdk/platform-tools"
          ln -s "$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS" "$ANDROID_STAGE/android-sdk/build-tools/$ANDROID_BUILD_TOOLS"
          ln -s "$PLATFORM_DIR" "$ANDROID_STAGE/android-sdk/platforms/$(basename "$PLATFORM_DIR")"
          if [ -d "$SDK_ROOT/licenses" ]; then
            ln -s "$SDK_ROOT/licenses" "$ANDROID_STAGE/android-sdk/licenses"
          fi
          make_component android-core "$ANDROID_STAGE"

          GRADLE_BIN="$(find "$GRADLE_USER_HOME/wrapper/dists" -type f -path "*/gradle-$GRADLE_VERSION/bin/gradle" -print -quit)"
          test -n "$GRADLE_BIN"
          GRADLE_DIST_HOME="$(cd "$(dirname "$GRADLE_BIN")/.." && pwd)"
          GRADLE_STAGE="$(new_stage gradle-runtime)"
          ln -s "$GRADLE_DIST_HOME" "$GRADLE_STAGE/gradle"
          make_component gradle-runtime "$GRADLE_STAGE"

          rm -rf "$GRADLE_USER_HOME/daemon"
          find "$GRADLE_USER_HOME" -type f -name '*.lock' -delete || true
          GRADLE_DEPS_STAGE="$(new_stage gradle-deps)"
          ln -s "$GRADLE_USER_HOME" "$GRADLE_DEPS_STAGE/gradle-user-home"
          make_component gradle-deps "$GRADLE_DEPS_STAGE"

          test -d .gradle/runtime-cache
          RUNTIME_STAGE="$(new_stage runtime-cache)"
          ln -s "$GITHUB_WORKSPACE/.gradle/runtime-cache" "$RUNTIME_STAGE/runtime-cache"
          make_component runtime-cache "$RUNTIME_STAGE"

          NODE_BIN="$(readlink -f "$(command -v node)")"
          NODE_HOME="$(cd "$(dirname "$NODE_BIN")/.." && pwd)"
          NODE_STAGE="$(new_stage node)"
          ln -s "$NODE_HOME" "$NODE_STAGE/node-current"
          make_component node "$NODE_STAGE"

          ACTIONLINT_STAGE="$(new_stage actionlint)"
          mkdir -p "$ACTIONLINT_STAGE/bin"
          ln -s "$RUNNER_TEMP/actionlint-bin/actionlint" "$ACTIONLINT_STAGE/bin/actionlint"
          make_component actionlint "$ACTIONLINT_STAGE"

          test -d "$SDK_ROOT/emulator"
          EMULATOR_STAGE="$(new_stage emulator)"
          mkdir -p "$EMULATOR_STAGE/android-sdk"
          ln -s "$SDK_ROOT/emulator" "$EMULATOR_STAGE/android-sdk/emulator"
          make_component emulator "$EMULATOR_STAGE"

          test -d "$SDK_ROOT/system-images/android-36"
          IMAGE16_STAGE="$(new_stage android-image-16)"
          mkdir -p "$IMAGE16_STAGE/android-sdk/system-images"
          ln -s "$SDK_ROOT/system-images/android-36" "$IMAGE16_STAGE/android-sdk/system-images/android-36"
          make_component android-image-16 "$IMAGE16_STAGE"

          test -d "$SDK_ROOT/system-images/android-37.0"
          IMAGE17_STAGE="$(new_stage android-image-17)"
          mkdir -p "$IMAGE17_STAGE/android-sdk/system-images"
          ln -s "$SDK_ROOT/system-images/android-37.0" "$IMAGE17_STAGE/android-sdk/system-images/android-37.0"
          make_component android-image-17 "$IMAGE17_STAGE"

          BOOT="$OUT/777-toolchain-bootstrap-latest"
          mkdir -p "$BOOT/tools" "$BOOT/docs"
          cp -a tools/dev "$BOOT/tools/dev"
          cp docs/DEVELOPMENT.md "$BOOT/docs/"
          cat > "$BOOT/组件清单.txt" <<EOF
          build:
            777-toolchain-jdk-latest
            777-toolchain-android-core-latest
            777-toolchain-gradle-runtime-latest
            777-toolchain-gradle-deps-latest
            777-toolchain-runtime-cache-latest

          full 额外:
            777-toolchain-node-latest
            777-toolchain-actionlint-latest
            777-toolchain-emulator-latest
            777-toolchain-android-image-16-latest
            777-toolchain-android-image-17-latest

          使用 tools/dev/ai-toolchain.sh plan 只下载当前真正缺少的项。
          EOF
          (
            cd "$BOOT"
            find tools docs 组件清单.txt -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

          for component in $ALL_COMPONENTS; do
            test -s "$OUT/777-toolchain-$component-latest/payload.tar.gz"
            du -sh "$OUT/777-toolchain-$component-latest"
          done
          du -sh "$BOOT"

      - name: 上传 bootstrap Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-bootstrap-latest
          path: ${{ runner.temp }}/toolchain-artifacts/777-toolchain-bootstrap-latest
          retention-days: 30
          if-no-files-found: error

      - name: 上传 JDK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-jdk-latest
          path: ${{ runner.temp }}/toolchain-artifacts/777-toolchain-jdk-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 Android Core Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-android-core-latest
          path: ${{ runner.temp }}/toolchain-artifacts/777-toolchain-android-core-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 Gradle Runtime Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-gradle-runtime-latest
          path: ${{ runner.temp }}/toolchain-artifacts/777-toolchain-gradle-runtime-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 Gradle 依赖 Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-gradle-deps-latest
          path: ${{ runner.temp }}/toolchain-artifacts/777-toolchain-gradle-deps-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 Runtime Cache Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-runtime-cache-latest
          path: ${{ runner.temp }}/toolchain-artifacts/777-toolchain-runtime-cache-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 Node Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-node-latest
          path: ${{ runner.temp }}/toolchain-artifacts/777-toolchain-node-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 actionlint Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-actionlint-latest
          path: ${{ runner.temp }}/toolchain-artifacts/777-toolchain-actionlint-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 Emulator Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-emulator-latest
          path: ${{ runner.temp }}/toolchain-artifacts/777-toolchain-emulator-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 Android 16 镜像 Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-android-image-16-latest
          path: ${{ runner.temp }}/toolchain-artifacts/777-toolchain-android-image-16-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 上传 Android 17 镜像 Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 777-toolchain-android-image-17-latest
          path: ${{ runner.temp }}/toolchain-artifacts/777-toolchain-android-image-17-latest
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  verify-install:
    name: 按需安装回归（${{ matrix.profile }}）
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        profile:
          - build
          - full

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: 下载 bootstrap
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-bootstrap-latest
          path: ${{ runner.temp }}/bootstrap

      - name: 计算当前真实缺失组件
        id: plan
        env:
          PROFILE: ${{ matrix.profile }}
          DEV777_TOOLS_ROOT: ${{ runner.temp }}/777-tools
          DEV777_ANDROID_SDK_ROOT: ${{ runner.temp }}/777-tools/android-sdk
          DEV777_GRADLE_HOME: ${{ runner.temp }}/777-tools/gradle
          DEV777_GRADLE_USER_HOME: ${{ runner.temp }}/777-tools/gradle-user-home
          DEV777_TOOLCHAIN_ENV_FILE: ${{ runner.temp }}/777-env
          DEV777_TOOLCHAIN_STATE_DIR: ${{ runner.temp }}/777-state
          DEV777_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          PLAN="$(bash "$RUNNER_TEMP/bootstrap/tools/dev/ai-toolchain.sh" plan --profile "$PROFILE")"
          printf '%s\n' "$PLAN"

          if printf '%s\n' "$PLAN" | grep -Fq '777-toolchain-jdk-latest'; then
            echo "已有 JDK 17 时仍要求下载 JDK，按需规划失败。" >&2
            exit 1
          fi

          for component in android-core gradle-runtime gradle-deps runtime-cache node actionlint emulator android-image-16 android-image-17; do
            artifact="777-toolchain-${component}-latest"
            key="${component//-/_}"
            if printf '%s\n' "$PLAN" | grep -Fq "$artifact"; then
              printf 'need_%s=true\n' "$key" >> "$GITHUB_OUTPUT"
            else
              printf 'need_%s=false\n' "$key" >> "$GITHUB_OUTPUT"
            fi
          done

          printf '%s\n' "$PLAN" | grep -F '777-toolchain-android-core-latest'
          printf '%s\n' "$PLAN" | grep -F '777-toolchain-gradle-runtime-latest'
          printf '%s\n' "$PLAN" | grep -F '777-toolchain-gradle-deps-latest'
          printf '%s\n' "$PLAN" | grep -F '777-toolchain-runtime-cache-latest'

      - name: 按需下载 Android Core
        if: steps.plan.outputs.need_android_core == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-android-core-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-android-core-latest

      - name: 按需下载 Gradle Runtime
        if: steps.plan.outputs.need_gradle_runtime == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-gradle-runtime-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-gradle-runtime-latest

      - name: 按需下载 Gradle 依赖
        if: steps.plan.outputs.need_gradle_deps == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-gradle-deps-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-gradle-deps-latest

      - name: 按需下载 Runtime Cache
        if: steps.plan.outputs.need_runtime_cache == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-runtime-cache-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-runtime-cache-latest

      - name: 按需下载 Node
        if: steps.plan.outputs.need_node == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-node-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-node-latest

      - name: 按需下载 actionlint
        if: steps.plan.outputs.need_actionlint == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-actionlint-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-actionlint-latest

      - name: 按需下载 Emulator
        if: steps.plan.outputs.need_emulator == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-emulator-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-emulator-latest

      - name: 按需下载 Android 16 镜像
        if: steps.plan.outputs.need_android_image_16 == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-android-image-16-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-android-image-16-latest

      - name: 按需下载 Android 17 镜像
        if: steps.plan.outputs.need_android_image_17 == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-android-image-17-latest
          path: ${{ runner.temp }}/artifacts/777-toolchain-android-image-17-latest

      - name: 从已下载组件安装并复检
        env:
          PROFILE: ${{ matrix.profile }}
          DEV777_TOOLS_ROOT: ${{ runner.temp }}/777-tools
          DEV777_ANDROID_SDK_ROOT: ${{ runner.temp }}/777-tools/android-sdk
          DEV777_GRADLE_HOME: ${{ runner.temp }}/777-tools/gradle
          DEV777_GRADLE_USER_HOME: ${{ runner.temp }}/777-tools/gradle-user-home
          DEV777_TOOLCHAIN_ENV_FILE: ${{ runner.temp }}/777-env
          DEV777_TOOLCHAIN_STATE_DIR: ${{ runner.temp }}/777-state
          DEV777_REPO_ROOT: ${{ github.workspace }}
          DEV777_ARTIFACTS_DIR: ${{ runner.temp }}/artifacts
        run: |
          set -euo pipefail

          if [ "$PROFILE" = full ]; then
            bash "$RUNNER_TEMP/bootstrap/tools/dev/install.sh" install full --artifacts-dir "$DEV777_ARTIFACTS_DIR" --create-avds
          else
            bash "$RUNNER_TEMP/bootstrap/tools/dev/install.sh" install build --artifacts-dir "$DEV777_ARTIFACTS_DIR"
          fi

          source "$DEV777_TOOLCHAIN_ENV_FILE"

          javac -version
          gradle --version
          adb version
          test -d "$GRADLE_USER_HOME/caches/modules-2"
          test -d "$GITHUB_WORKSPACE/.gradle/runtime-cache"

          AFTER="$(bash "$RUNNER_TEMP/bootstrap/tools/dev/ai-toolchain.sh" plan --profile "$PROFILE")"
          printf '%s\n' "$AFTER"
          printf '%s\n' "$AFTER" | grep -F '"missing_artifacts":[]'

          CHECK_JSON="$(bash "$RUNNER_TEMP/bootstrap/tools/dev/ai-toolchain.sh" check --profile "$PROFILE")"
          printf '%s\n' "$CHECK_JSON"
          printf '%s\n' "$CHECK_JSON" | grep -F '"status": "ready"'

          cd "$GITHUB_WORKSPACE"
          bash "$RUNNER_TEMP/bootstrap/tools/dev/ai-toolchain.sh" gradle :app:assembleDebug --stacktrace

          if [ "$PROFILE" = full ]; then
            node --version
            actionlint -version
            emulator -version | head -n 1
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" list avd | grep -F 'Name: 777-android16'
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" list avd | grep -F 'Name: 777-android17'
          fi

  verify-jdk-artifact:
    name: JDK Artifact 可下载可执行
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 下载 JDK 组件
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 777-toolchain-jdk-latest
          path: ${{ runner.temp }}/jdk-artifact

      - name: 校验并真实运行 javac
        run: |
          set -euo pipefail
          ART="$RUNNER_TEMP/jdk-artifact"
          test -s "$ART/payload.tar.gz"
          (
            cd "$ART"
            sha256sum -c SHA256SUMS
          )
          mkdir -p "$RUNNER_TEMP/jdk-proof"
          tar -xzf "$ART/payload.tar.gz" -C "$RUNNER_TEMP/jdk-proof"
          "$RUNNER_TEMP/jdk-proof/jdk/bin/javac" -version
