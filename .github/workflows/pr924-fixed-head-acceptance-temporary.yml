name: PR924 固定快照独立全链路验收
'on':
  push:
    branches:
      - audit/architecture3-full-callgraph-20261115
permissions:
  contents: read
jobs:
  contracts:
    if: ${{ github.event.head_commit.message == '审计固定快照：独立验证全部功能链路' }}
    name: 全量 JVM 共享契约、Android 编译与 APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 27
      - uses: ./.github/actions/setup-android-cached
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: 全部核心库与 App JVM 单元测试
        run: ./gradlew --max-workers=2 :harness-core:test :harness-interop:test :harness-device-android:testDebugUnitTest :app:testDebugUnitTest --stacktrace --console=plain
      - name: Android 测试包与应用打包
        run: ./gradlew --max-workers=2 :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace --console=plain
      - name: 保存全量单元测试报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr924-fixed-jvm-tests
          path: |
            app/build/test-results/testDebugUnitTest/
            harness-core/build/test-results/test/
            harness-interop/build/test-results/test/
            harness-device-android/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
  android-chat-work:
    if: ${{ github.event.head_commit.message == '审计固定快照：独立验证全部功能链路' }}
    name: Android 36 Chat Work 权限与团队真实交互
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 27
      - uses: ./.github/actions/setup-android-cached
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Android 模拟器可用性
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: 真实模拟器交互回归
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --max-workers=2 :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.labteto.dshmobile.ui.screens.local.LocalConversationComposerRegressionTest,com.labteto.dshmobile.ui.screens.local.LocalAgentTeamUiRegressionTest,com.labteto.dshmobile.ui.screens.local.WorkBackgroundReplyAndroidTest,com.labteto.dshmobile.ui.screens.settings.PermissionSetupFlowAndroidTest,com.labteto.dshmobile.notify.NotificationRoutingAndroidTest --stacktrace --console=plain
      - name: 保留 Android 交互实测结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr924-fixed-chat-work-device
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7
  android-session:
    if: ${{ github.event.head_commit.message == '审计固定快照：独立验证全部功能链路' }}
    name: Android 36 SQLite 会话迁移验证
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 27
      - uses: ./.github/actions/setup-android-cached
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --max-workers=2 :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.labteto.dshmobile.local.session.SqliteRequestDeltaMigrationAndroidTest,com.labteto.dshmobile.local.session.SqliteEventSearchBlockIndexAndroidTest,com.labteto.dshmobile.local.session.SqliteQueuedTranscriptDeltaAndroidTest --stacktrace --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr924-fixed-session-device
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7
  android-marketplace:
    if: ${{ github.event.head_commit.message == '审计固定快照：独立验证全部功能链路' }}
    name: Android 36 扩展市场与授权真实交互
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 27
      - uses: ./.github/actions/setup-android-cached
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --max-workers=2 :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.labteto.dshmobile.ui.screens.tools.ExtensionMarketplaceUiTest,com.labteto.dshmobile.ui.screens.tools.ExtensionCredentialsUiTest,com.labteto.dshmobile.ui.screens.tools.ExtensionOAuthCallbackUiTest --stacktrace --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr924-fixed-market-device
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7
