name: PR904 定向 Kotlin 调试（一次性）
on:
  push:
    branches:
      - fix/pr895-claude317-closure-20261114
    paths:
      - .github/workflows/pr904-kotlin-debug-once.yml

permissions:
  contents: read

jobs:
  focused-kotlin:
    name: 运行 Hooks、Work 审查与 Android JVM 测试
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-toolchain-home
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 27
      - uses: ./.github/actions/setup-android-cached
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: 恢复 Gradle 依赖缓存
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .gradle-toolchain-home/caches/modules-2
            .gradle-toolchain-home/caches/transforms-*
            .gradle-toolchain-home/wrapper/dists
          key: toolchain-deps-${{ runner.os }}-jdk27-v1-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml', '**/gradle.lockfile') }}
      - name: 执行 Harness Core Hooks 测试
        run: |
          ./gradlew --max-workers=2 :harness-core:test --tests 'com.labteto.dshmobile.harness.tools.ToolHookRegistryTest' --stacktrace --console=plain
      - name: 执行相关 Android JVM 回归
        run: |
          ./gradlew --max-workers=2 :app:testDebugUnitTest \
            --tests 'com.labteto.dshmobile.local.work.LocalIndependentReviewCoordinatorReceiptTest' \
            --tests 'com.labteto.dshmobile.local.work.LocalWorkReviewObligationsTest' \
            --tests 'com.labteto.dshmobile.local.tools.LocalTrustedDeviceOriginHookTest' \
            --tests 'com.labteto.dshmobile.local.tools.LocalManagedDeviceProviderTest' \
            --tests 'com.labteto.dshmobile.local.work.LocalWorkDeliveryEvidenceTest' \
            --tests 'com.labteto.dshmobile.local.work.LocalWorkIntegrationDecisionTest' \
            --tests 'com.labteto.dshmobile.local.work.LocalWorkProgressCoordinatorTest' \
            --tests 'com.labteto.dshmobile.local.LocalWorkRuntimeContextTest' \
            --stacktrace --console=plain
      - name: 编译 Android 应用
        run: |
          ./gradlew --max-workers=2 :app:assembleDebug --stacktrace --console=plain

# 复跑：非法 URI 修复、Goal 审查恢复与 Tools Hook 状态

# 完整整改代码最后一次专项编译
