name: v46-low-signal-outball

on:
  push:
    branches:
      - v4-6-nonlinear-challenger
    paths:
      - "tools/v4_6_low_signal_outball.py"
      - "tools/v4_6_outball_poollock.py"
      - "tools/v4_6_outball_corrected.py"
      - ".github/workflows/v46-low-signal-outball.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 编译检查
        run: python -m compileall -q tools/v4_6_low_signal_outball.py tools/v4_6_outball_poollock.py tools/v4_6_outball_corrected.py tools/v4_6_outball_features.py models
      - name: 运行低信号顺序重排实验
        run: python tools/v4_6_low_signal_outball.py
      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: v46-low-signal-outball
          path: backtests/v4_6/low_signal_outball.json
          if-no-files-found: error
