name: Temporary Noto Sans SC source import
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  import-font:
    if: ${{ github.event.pull_request.number == 549 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ui/global-chinese-typography-20261008' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/global-chinese-typography-20261008
          persist-credentials: true
      - name: Import version-pinned full Noto Sans SC variable font
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/fonts/source
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf' \
            -o 'tools/fonts/source/NotoSansSC-wght.ttf'
          test "$(git hash-object tools/fonts/source/NotoSansSC-wght.ttf)" = 'fb0637bafbcd804fe32152370a1225990745b4bc'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/fonts/source/NotoSansSC-wght.ttf
          if git diff --cached --quiet; then
            echo 'Font source already committed.'
          else
            git commit -m '纳入完整 Noto Sans SC 字体母版'
            git push origin HEAD:refs/heads/ui/global-chinese-typography-20261008
          fi
