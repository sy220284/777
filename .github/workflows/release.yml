name: Release APK

'on':
  # 主线 CI 成功后直接发布；低频定时任务只做漏触发补偿。
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      version: ${{ steps.detect.outputs.version }}
      release_sha: ${{ steps.detect.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Detect tested release candidate
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          skip_release() {
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            RELEASE_SHA="$WORKFLOW_RUN_SHA"
            echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
            if [ "$WORKFLOW_RUN_CONCLUSION" != "success" ]; then
              echo "CI 未成功，本次不进入发布：$WORKFLOW_RUN_CONCLUSION"
              skip_release
              exit 0
            fi
          else
            RELEASE_SHA="$(git rev-parse HEAD)"
            echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          fi

          IS_TAG=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            IS_TAG=true
          fi

          if [ "$IS_TAG" = "false" ]; then
            MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            if [ "$RELEASE_SHA" != "$MAIN_SHA" ]; then
              echo "候选提交已经落后于 main：$RELEASE_SHA != $MAIN_SHA"
              skip_release
              exit 0
            fi
          fi

          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then
            SUCCESSFUL_CI_COUNT="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RELEASE_SHA&status=success&per_page=100" \
                --jq '[.workflow_runs[] | select(.name == "CI" and .conclusion == "success")] | length'
            )"
            if [ "$SUCCESSFUL_CI_COUNT" -eq 0 ]; then
              echo "提交尚无成功 CI 记录，跳过发布：$RELEASE_SHA"
              skip_release
              exit 0
            fi
          fi

          if [ "$IS_TAG" = "true" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "标签已有 Release：$GITHUB_REF_NAME"
              skip_release
              exit 0
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_RELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" 2>/dev/null || printf '{}')"
          LATEST_TAG="$(printf '%s' "$LATEST_RELEASE" | jq -r '.tag_name // empty')"
          LATEST_TARGET="$(printf '%s' "$LATEST_RELEASE" | jq -r '.target_commitish // empty')"

          if [ -n "$LATEST_TARGET" ] && [ "$LATEST_TARGET" = "$RELEASE_SHA" ]; then
            echo "当前主线提交已经发布：$RELEASE_SHA"
            skip_release
            exit 0
          fi

          FALLBACK_VERSION="$(tr -d '\r\n' < .github/release-version)"
          if [[ "$LATEST_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+-777\.)([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}$((BASH_REMATCH[2] + 1))"
          elif [[ "$FALLBACK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-777\.[0-9]+$ ]]; then
            VERSION="$FALLBACK_VERSION"
          else
            echo "::error::无法从最新正式版或 .github/release-version 推导发布版本。"
            exit 1
          fi

          echo "检测到已通过 CI 且尚未发布的主线：$RELEASE_SHA -> v$VERSION"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-release.outputs.release_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate release signing material
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$RELEASE_PASSWORD" ]; then
            echo "::error::正式 APK 只需配置两个仓库 Secret：RELEASE_KEYSTORE 与 RELEASE_KEY_PASSWORD。"
            echo "::error::没有稳定签名时禁止发布，以免再次生成无法安装或无法持续升级的 APK。"
            exit 1
          fi

          extract_secret() {
            raw="$1"
            key="$2"
            matched="$(printf '%s\n' "$raw" | sed -n "s/^${key}=//p" | head -n 1)"
            if [ -n "$matched" ]; then
              printf '%s' "$matched"
            else
              printf '%s' "$raw"
            fi
          }

          KEYSTORE_VALUE="$(extract_secret "$KEYSTORE_B64" "RELEASE_KEYSTORE")"
          KEYSTORE_VALUE="${KEYSTORE_VALUE#\"}"
          KEYSTORE_VALUE="${KEYSTORE_VALUE%\"}"
          KEYSTORE_VALUE="$(printf '%s' "$KEYSTORE_VALUE" | tr -d '[:space:]')"

          PASSWORD_VALUE="$(extract_secret "$RELEASE_PASSWORD" "RELEASE_KEY_PASSWORD")"
          PASSWORD_VALUE="${PASSWORD_VALUE#\"}"
          PASSWORD_VALUE="${PASSWORD_VALUE%\"}"
          PASSWORD_VALUE="$(printf '%s' "$PASSWORD_VALUE" | tr -d '\r\n')"

          decode_candidate() {
            value="$1"
            out="$2"
            printf '%s' "$value" | base64 -d > "$out" 2>/dev/null
          }

          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          if decode_candidate "$KEYSTORE_VALUE" "$KEYSTORE_PATH"; then
            :
          else
            remainder=$((${#KEYSTORE_VALUE} % 4))
            case "$remainder" in
              2) PADDED_VALUE="${KEYSTORE_VALUE}==" ;;
              3) PADDED_VALUE="${KEYSTORE_VALUE}=" ;;
              *)
                echo "::error::RELEASE_KEYSTORE 的 Base64 内容不完整或已损坏。"
                exit 1
                ;;
            esac

            if ! decode_candidate "$PADDED_VALUE" "$KEYSTORE_PATH"; then
              echo "::error::RELEASE_KEYSTORE 无法解码。"
              exit 1
            fi

            if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$PASSWORD_VALUE" -alias "777-release" >/dev/null 2>&1; then
              echo "::error::RELEASE_KEYSTORE 看起来被截断：补齐 Base64 填充后仍无法得到有效密钥库。请重新粘贴完整值。"
              exit 1
            fi
            echo "::notice::RELEASE_KEYSTORE 仅缺少 Base64 填充，已安全补齐。"
          fi

          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$PASSWORD_VALUE" -alias "777-release" >/dev/null 2>&1; then
            echo "::error::签名密钥库或密码不匹配。请确认 RELEASE_KEYSTORE 为完整密钥库 Base64，RELEASE_KEY_PASSWORD 为该密钥库与私钥共用密码。"
            exit 1
          fi

          echo "DSH_RELEASE_PASSWORD=$PASSWORD_VALUE" >> "$GITHUB_ENV"

      - name: Derive release version
        id: version
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-777\.[0-9]+$ ]]; then
            echo "::error::发布版本格式无效：$VERSION"
            exit 1
          fi
          echo "DSH_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # CI 已完成单测、Lint、优化包校验与 Android 16/17 仪器测试；
      # 发布阶段只构建正式签名包，避免同一提交重复消耗运行器。

      - name: Build release APK
        env:
          DSH_KEYSTORE: ${{ runner.temp }}/release.keystore
          DSH_KEYSTORE_PASSWORD: ${{ env.DSH_RELEASE_PASSWORD }}
          DSH_KEY_ALIAS: 777-release
          DSH_KEY_PASSWORD: ${{ env.DSH_RELEASE_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify Android 16 APK
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          .github/scripts/verify-android16-apk.sh "$APK"

      - name: Prepare incremental update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_DIR="app/build/outputs/apk/release"
          NEW_APK="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$NEW_APK"

          ASSET_DIR="$GITHUB_WORKSPACE/.release-assets"
          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"

          APK_NAME="$(basename "$NEW_APK")"
          cp "$NEW_APK" "$ASSET_DIR/$APK_NAME"
          NEW_APK="$ASSET_DIR/$APK_NAME"
          NEW_SIZE="$(stat -c '%s' "$NEW_APK")"
          NEW_SHA="$(sha256sum "$NEW_APK" | awk '{print $1}')"
          PATCH_JSON="$RUNNER_TEMP/update-patches.json"
          printf '[]\n' > "$PATCH_JSON"

          PREVIOUS_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name // empty' 2>/dev/null || true)"
          CURRENT_TAG="${{ steps.version.outputs.tag }}"

          if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$CURRENT_TAG" ]; then
            PREVIOUS_DIR="$RUNNER_TEMP/previous-release"
            rm -rf "$PREVIOUS_DIR"
            mkdir -p "$PREVIOUS_DIR"

            if gh release download "$PREVIOUS_TAG" --pattern '*.apk' --dir "$PREVIOUS_DIR"; then
              OLD_APK="$(find "$PREVIOUS_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
              if [ -n "$OLD_APK" ]; then
                HDIFF_VERSION="5.1.3"
                HDIFF_ARCHIVE="hdiffpatch_v${HDIFF_VERSION}_bin_linux64.zip"
                HDIFF_URL="https://github.com/sisong/HDiffPatch/releases/download/v${HDIFF_VERSION}/${HDIFF_ARCHIVE}"
                HDIFF_SHA256="628963bf2ee9108a97260fa5eef44acd9ec94369b76090a957c9182b3abbb558"
                HDIFF_DIR="$RUNNER_TEMP/hdiffpatch"
                HDIFF_ZIP="$RUNNER_TEMP/$HDIFF_ARCHIVE"
                rm -rf "$HDIFF_DIR" "$HDIFF_ZIP"
                mkdir -p "$HDIFF_DIR"

                if curl --fail --location --retry 3 --retry-delay 2 "$HDIFF_URL" --output "$HDIFF_ZIP" &&
                   printf '%s  %s\n' "$HDIFF_SHA256" "$HDIFF_ZIP" | sha256sum -c - &&
                   unzip -q "$HDIFF_ZIP" -d "$HDIFF_DIR"; then
                  HDIFFZ="$(find "$HDIFF_DIR" -type f -name hdiffz -print -quit)"
                  HPATCHZ="$(find "$HDIFF_DIR" -type f -name hpatchz -print -quit)"
                  if [ -n "$HDIFFZ" ] && [ -n "$HPATCHZ" ]; then
                    chmod +x "$HDIFFZ" "$HPATCHZ"
                    FROM_VERSION="${PREVIOUS_TAG#v}"
                    TO_VERSION="$DSH_VERSION_NAME"
                    SAFE_FROM="$(printf '%s' "$FROM_VERSION" | tr -c 'A-Za-z0-9._-' '_')"
                    SAFE_TO="$(printf '%s' "$TO_VERSION" | tr -c 'A-Za-z0-9._-' '_')"
                    PATCH_NAME="delta-${SAFE_FROM}-to-${SAFE_TO}.hpatch"
                    PATCH_PATH="$ASSET_DIR/$PATCH_NAME"
                    REBUILT_APK="$RUNNER_TEMP/rebuilt-from-delta.apk"
                    rm -f "$PATCH_PATH" "$REBUILT_APK"

                    if "$HDIFFZ" -s-64 -WD -w-2m -f -p-4 -c-zstd-19-24 -C-xxh128 \
                         "$OLD_APK" "$NEW_APK" "$PATCH_PATH" &&
                       "$HPATCHZ" -f "$OLD_APK" "$PATCH_PATH" "$REBUILT_APK"; then
                      REBUILT_SHA="$(sha256sum "$REBUILT_APK" | awk '{print $1}')"
                      PATCH_SIZE="$(stat -c '%s' "$PATCH_PATH")"
                      if [ "$REBUILT_SHA" = "$NEW_SHA" ] &&
                         [ "$((PATCH_SIZE * 100))" -lt "$((NEW_SIZE * 65))" ]; then
                        OLD_SHA="$(sha256sum "$OLD_APK" | awk '{print $1}')"
                        PATCH_SHA="$(sha256sum "$PATCH_PATH" | awk '{print $1}')"
                        jq -n \
                          --arg from "$FROM_VERSION" \
                          --arg to "$TO_VERSION" \
                          --arg asset "$PATCH_NAME" \
                          --arg sha256 "$PATCH_SHA" \
                          --arg sourceSha256 "$OLD_SHA" \
                          --arg targetSha256 "$NEW_SHA" \
                          --argjson size "$PATCH_SIZE" \
                          '[{
                            fromVersion: $from,
                            toVersion: $to,
                            algorithm: "hdiffpatch-window-zstd-v1",
                            asset: $asset,
                            size: $size,
                            sha256: $sha256,
                            sourceSha256: $sourceSha256,
                            targetSha256: $targetSha256
                          }]' > "$PATCH_JSON"
                        echo "::notice::已生成增量包：$PATCH_NAME ($PATCH_SIZE / $NEW_SIZE bytes)"
                      else
                        echo "::notice::增量包校验失败或达到完整 APK 的 65%，本版仅发布完整包。"
                        rm -f "$PATCH_PATH"
                      fi
                    else
                      echo "::warning::HDiffPatch 生成或回放失败，本版继续发布完整 APK。"
                      rm -f "$PATCH_PATH" "$REBUILT_APK"
                    fi
                  fi
                else
                  echo "::warning::HDiffPatch 工具下载或校验失败，本版继续发布完整 APK。"
                fi
              fi
            else
              echo "::notice::无法下载上一正式版 APK，本版仅发布完整包。"
            fi
          fi

          MANIFEST_PATH="$ASSET_DIR/update-manifest.json"
          jq -n \
            --arg targetVersion "$DSH_VERSION_NAME" \
            --arg apkName "$APK_NAME" \
            --arg apkSha256 "$NEW_SHA" \
            --argjson apkSize "$NEW_SIZE" \
            --slurpfile patches "$PATCH_JSON" \
            '{
              schema: 1,
              targetVersion: $targetVersion,
              targetApk: {
                name: $apkName,
                size: $apkSize,
                sha256: $apkSha256
              },
              patches: $patches[0]
            }' > "$MANIFEST_PATH"

          (
            cd "$ASSET_DIR"
            rm -f SHA256SUMS.txt
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' |
              sort |
              while IFS= read -r file; do sha256sum "$file"; done > SHA256SUMS.txt
            ls -lh
          )

      - name: Recheck main before publish
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.check-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$MAIN_SHA" = "$RELEASE_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "构建期间 main 已前进到 $MAIN_SHA，本次旧版本不发布。"
          fi

      - name: Publish GitHub Release
        if: steps.freshness.outputs.current == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ needs.check-release.outputs.release_sha }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            .release-assets/*
          generate_release_notes: true
