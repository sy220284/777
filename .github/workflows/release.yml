name: Release APK

'on':
  # 合并到主线后立即检查，定时任务用于补偿 GitHub Actions 的偶发延迟。
  push:
    tags:
      - 'v*'
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect unreleased main commit
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name // empty')"
          LATEST_TARGET="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.target_commitish // empty')"
          if [ -n "$LATEST_TARGET" ] && [ "$LATEST_TARGET" = "$GITHUB_SHA" ]; then
            echo "当前主线提交已经发布：$GITHUB_SHA"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FALLBACK_VERSION="$(tr -d '\r\n' < .github/release-version)"
          if [[ "$LATEST_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+-777\.)([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}$((BASH_REMATCH[2] + 1))"
          elif [[ "$FALLBACK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-777\.[0-9]+$ ]]; then
            VERSION="$FALLBACK_VERSION"
          else
            echo "::error::无法从最新正式版或 .github/release-version 推导发布版本。"
            exit 1
          fi

          echo "检测到主线尚未发布：$GITHUB_SHA -> v$VERSION"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  quality-gate:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify official golden fixture provenance
        run: |
          corepack enable
          bash tools/reference-validation/refresh-official-fixtures.sh
          git diff --exit-code -- reference-validation/src/test/resources/official
      - name: Full unit tests
        run: ./gradlew :core:test :harness-core:test :harness-runtime-android:test :harness-interop:test :harness-device-android:testDebugUnitTest :mock-harness:test :app:testDebugUnitTest --stacktrace
      - name: Official Harness conformance
        run: ./gradlew :reference-validation:test --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Assemble optimized APK
        run: ./gradlew :app:assembleOptimized --stacktrace
      - name: Verify Android 16 APK
        run: .github/scripts/verify-android16-apk.sh app/build/outputs/apk/optimized/app-optimized.apk
      - name: Enforce APK size budget
        run: |
          BYTES="$(stat -c '%s' app/build/outputs/apk/optimized/app-optimized.apk)"
          BUDGET=268435456
          echo "Optimized APK: $BYTES bytes (budget: $BUDGET)"
          test "$BYTES" -le "$BUDGET"

  android-16-instrumented:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::error::/dev/kvm is unavailable on this runner"
            exit 1
          fi
      - name: Android 16 instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          script: |
            DSH_RUNTIME_ABIS=x86_64 ./gradlew :app:connectedDebugAndroidTest :app:assembleDebug :app:assembleOptimized --stacktrace
            adb shell am force-stop com.sy220284.dshmobile.debug || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.sy220284.dshmobile.debug -c android.intent.category.LAUNCHER 1
            sleep 2
            adb shell pidof com.sy220284.dshmobile.debug

            # The publishing path must launch a minified/shrunk build, not only debug.
            adb shell am force-stop com.sy220284.dshmobile.debug || true
            adb install -r app/build/outputs/apk/optimized/app-optimized.apk
            bash .github/scripts/smoke-test-android-startup.sh com.sy220284.dshmobile.debug

  android-17-instrumented:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator platforms;android-37.0 build-tools;37.0.0 system-images;android-37.0;google_apis_ps16k;x86_64'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::error::/dev/kvm is unavailable on this runner"
            exit 1
          fi
      - name: Android 17 instrumentation tests
        run: |
          echo no | avdmanager create avd --force -n android17 \
            --package 'system-images;android-37.0;google_apis_ps16k;x86_64'
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd android17 \
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim &
          adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          DSH_RUNTIME_ABIS=x86_64 ./gradlew :app:connectedDebugAndroidTest :app:assembleDebug --stacktrace
          adb shell am force-stop com.sy220284.dshmobile.debug || true
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell monkey -p com.sy220284.dshmobile.debug -c android.intent.category.LAUNCHER 1
          sleep 2
          adb shell pidof com.sy220284.dshmobile.debug

  release:
    needs: [check-release, quality-gate, android-16-instrumented, android-17-instrumented]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate release signing material
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$RELEASE_PASSWORD" ]; then
            echo "::error::正式 APK 只需配置两个仓库 Secret：RELEASE_KEYSTORE 与 RELEASE_KEY_PASSWORD。"
            echo "::error::没有稳定签名时禁止发布，以免再次生成无法安装或无法持续升级的 APK。"
            exit 1
          fi

          extract_secret() {
            raw="$1"
            key="$2"
            matched="$(printf '%s\n' "$raw" | sed -n "s/^${key}=//p" | head -n 1)"
            if [ -n "$matched" ]; then
              printf '%s' "$matched"
            else
              printf '%s' "$raw"
            fi
          }

          KEYSTORE_VALUE="$(extract_secret "$KEYSTORE_B64" "RELEASE_KEYSTORE")"
          KEYSTORE_VALUE="${KEYSTORE_VALUE#\"}"
          KEYSTORE_VALUE="${KEYSTORE_VALUE%\"}"
          KEYSTORE_VALUE="$(printf '%s' "$KEYSTORE_VALUE" | tr -d '[:space:]')"

          PASSWORD_VALUE="$(extract_secret "$RELEASE_PASSWORD" "RELEASE_KEY_PASSWORD")"
          PASSWORD_VALUE="${PASSWORD_VALUE#\"}"
          PASSWORD_VALUE="${PASSWORD_VALUE%\"}"
          PASSWORD_VALUE="$(printf '%s' "$PASSWORD_VALUE" | tr -d '\r\n')"

          decode_candidate() {
            value="$1"
            out="$2"
            printf '%s' "$value" | base64 -d > "$out" 2>/dev/null
          }

          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          if decode_candidate "$KEYSTORE_VALUE" "$KEYSTORE_PATH"; then
            :
          else
            remainder=$((${#KEYSTORE_VALUE} % 4))
            case "$remainder" in
              2) PADDED_VALUE="${KEYSTORE_VALUE}==" ;;
              3) PADDED_VALUE="${KEYSTORE_VALUE}=" ;;
              *)
                echo "::error::RELEASE_KEYSTORE 的 Base64 内容不完整或已损坏。"
                exit 1
                ;;
            esac

            if ! decode_candidate "$PADDED_VALUE" "$KEYSTORE_PATH"; then
              echo "::error::RELEASE_KEYSTORE 无法解码。"
              exit 1
            fi

            if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$PASSWORD_VALUE" -alias "777-release" >/dev/null 2>&1; then
              echo "::error::RELEASE_KEYSTORE 看起来被截断：补齐 Base64 填充后仍无法得到有效密钥库。请重新粘贴完整值。"
              exit 1
            fi
            echo "::notice::RELEASE_KEYSTORE 仅缺少 Base64 填充，已安全补齐。"
          fi

          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$PASSWORD_VALUE" -alias "777-release" >/dev/null 2>&1; then
            echo "::error::签名密钥库或密码不匹配。请确认 RELEASE_KEYSTORE 为完整密钥库 Base64，RELEASE_KEY_PASSWORD 为该密钥库与私钥共用密码。"
            exit 1
          fi

          echo "DSH_RELEASE_PASSWORD=$PASSWORD_VALUE" >> "$GITHUB_ENV"

      - name: Derive release version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ needs.check-release.outputs.version }}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-777\.[0-9]+$ ]]; then
            echo "::error::发布版本格式无效：$VERSION"
            exit 1
          fi
          echo "DSH_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # quality-gate already runs the full unit-test suite. AGP 9 no longer creates
      # :app:testReleaseUnitTest for this application setup, so do not select a
      # non-existent release-variant test task here.

      - name: Build release APK
        env:
          DSH_KEYSTORE: ${{ runner.temp }}/release.keystore
          DSH_KEYSTORE_PASSWORD: ${{ env.DSH_RELEASE_PASSWORD }}
          DSH_KEY_ALIAS: 777-release
          DSH_KEY_PASSWORD: ${{ env.DSH_RELEASE_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify Android 16 APK
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          .github/scripts/verify-android16-apk.sh "$APK"

      - name: Prepare incremental update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_DIR="app/build/outputs/apk/release"
          NEW_APK="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$NEW_APK"

          ASSET_DIR="$GITHUB_WORKSPACE/.release-assets"
          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"

          APK_NAME="$(basename "$NEW_APK")"
          cp "$NEW_APK" "$ASSET_DIR/$APK_NAME"
          NEW_APK="$ASSET_DIR/$APK_NAME"
          NEW_SIZE="$(stat -c '%s' "$NEW_APK")"
          NEW_SHA="$(sha256sum "$NEW_APK" | awk '{print $1}')"
          PATCH_JSON="$RUNNER_TEMP/update-patches.json"
          printf '[]\n' > "$PATCH_JSON"

          PREVIOUS_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name // empty' 2>/dev/null || true)"
          CURRENT_TAG="${{ steps.version.outputs.tag }}"

          if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$CURRENT_TAG" ]; then
            PREVIOUS_DIR="$RUNNER_TEMP/previous-release"
            rm -rf "$PREVIOUS_DIR"
            mkdir -p "$PREVIOUS_DIR"

            if gh release download "$PREVIOUS_TAG" --pattern '*.apk' --dir "$PREVIOUS_DIR"; then
              OLD_APK="$(find "$PREVIOUS_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
              if [ -n "$OLD_APK" ]; then
                HDIFF_VERSION="5.1.3"
                HDIFF_ARCHIVE="hdiffpatch_v${HDIFF_VERSION}_bin_linux64.zip"
                HDIFF_URL="https://github.com/sisong/HDiffPatch/releases/download/v${HDIFF_VERSION}/${HDIFF_ARCHIVE}"
                HDIFF_SHA256="628963bf2ee9108a97260fa5eef44acd9ec94369b76090a957c9182b3abbb558"
                HDIFF_DIR="$RUNNER_TEMP/hdiffpatch"
                HDIFF_ZIP="$RUNNER_TEMP/$HDIFF_ARCHIVE"
                rm -rf "$HDIFF_DIR" "$HDIFF_ZIP"
                mkdir -p "$HDIFF_DIR"

                if curl --fail --location --retry 3 --retry-delay 2 "$HDIFF_URL" --output "$HDIFF_ZIP" &&
                   printf '%s  %s\n' "$HDIFF_SHA256" "$HDIFF_ZIP" | sha256sum -c - &&
                   unzip -q "$HDIFF_ZIP" -d "$HDIFF_DIR"; then
                  HDIFFZ="$(find "$HDIFF_DIR" -type f -name hdiffz -print -quit)"
                  HPATCHZ="$(find "$HDIFF_DIR" -type f -name hpatchz -print -quit)"
                  if [ -n "$HDIFFZ" ] && [ -n "$HPATCHZ" ]; then
                    chmod +x "$HDIFFZ" "$HPATCHZ"
                    FROM_VERSION="${PREVIOUS_TAG#v}"
                    TO_VERSION="$DSH_VERSION_NAME"
                    SAFE_FROM="$(printf '%s' "$FROM_VERSION" | tr -c 'A-Za-z0-9._-' '_')"
                    SAFE_TO="$(printf '%s' "$TO_VERSION" | tr -c 'A-Za-z0-9._-' '_')"
                    PATCH_NAME="delta-${SAFE_FROM}-to-${SAFE_TO}.hpatch"
                    PATCH_PATH="$ASSET_DIR/$PATCH_NAME"
                    REBUILT_APK="$RUNNER_TEMP/rebuilt-from-delta.apk"
                    rm -f "$PATCH_PATH" "$REBUILT_APK"

                    if "$HDIFFZ" -s-64 -WD -w-2m -f -p-4 -c-zstd-19-24 -C-xxh128 \
                         "$OLD_APK" "$NEW_APK" "$PATCH_PATH" &&
                       "$HPATCHZ" -f "$OLD_APK" "$PATCH_PATH" "$REBUILT_APK"; then
                      REBUILT_SHA="$(sha256sum "$REBUILT_APK" | awk '{print $1}')"
                      PATCH_SIZE="$(stat -c '%s' "$PATCH_PATH")"
                      if [ "$REBUILT_SHA" = "$NEW_SHA" ] &&
                         [ "$((PATCH_SIZE * 100))" -lt "$((NEW_SIZE * 65))" ]; then
                        OLD_SHA="$(sha256sum "$OLD_APK" | awk '{print $1}')"
                        PATCH_SHA="$(sha256sum "$PATCH_PATH" | awk '{print $1}')"
                        jq -n \
                          --arg from "$FROM_VERSION" \
                          --arg to "$TO_VERSION" \
                          --arg asset "$PATCH_NAME" \
                          --arg sha256 "$PATCH_SHA" \
                          --arg sourceSha256 "$OLD_SHA" \
                          --arg targetSha256 "$NEW_SHA" \
                          --argjson size "$PATCH_SIZE" \
                          '[{
                            fromVersion: $from,
                            toVersion: $to,
                            algorithm: "hdiffpatch-window-zstd-v1",
                            asset: $asset,
                            size: $size,
                            sha256: $sha256,
                            sourceSha256: $sourceSha256,
                            targetSha256: $targetSha256
                          }]' > "$PATCH_JSON"
                        echo "::notice::已生成增量包：$PATCH_NAME ($PATCH_SIZE / $NEW_SIZE bytes)"
                      else
                        echo "::notice::增量包校验失败或达到完整 APK 的 65%，本版仅发布完整包。"
                        rm -f "$PATCH_PATH"
                      fi
                    else
                      echo "::warning::HDiffPatch 生成或回放失败，本版继续发布完整 APK。"
                      rm -f "$PATCH_PATH" "$REBUILT_APK"
                    fi
                  fi
                else
                  echo "::warning::HDiffPatch 工具下载或校验失败，本版继续发布完整 APK。"
                fi
              fi
            else
              echo "::notice::无法下载上一正式版 APK，本版仅发布完整包。"
            fi
          fi

          MANIFEST_PATH="$ASSET_DIR/update-manifest.json"
          jq -n \
            --arg targetVersion "$DSH_VERSION_NAME" \
            --arg apkName "$APK_NAME" \
            --arg apkSha256 "$NEW_SHA" \
            --argjson apkSize "$NEW_SIZE" \
            --slurpfile patches "$PATCH_JSON" \
            '{
              schema: 1,
              targetVersion: $targetVersion,
              targetApk: {
                name: $apkName,
                size: $apkSize,
                sha256: $apkSha256
              },
              patches: $patches[0]
            }' > "$MANIFEST_PATH"

          (
            cd "$ASSET_DIR"
            rm -f SHA256SUMS.txt
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' |
              sort |
              while IFS= read -r file; do sha256sum "$file"; done > SHA256SUMS.txt
            ls -lh
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            .release-assets/*
          generate_release_notes: true
