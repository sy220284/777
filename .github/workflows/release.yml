name: Release APK

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` package is no longer published. Asking for it makes
          # current hosted runners fail before Gradle starts.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate release signing material
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          LEGACY_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          LEGACY_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$RELEASE_PASSWORD" ]; then
            echo "::error::正式 APK 只需配置两个仓库 Secret：RELEASE_KEYSTORE 与 RELEASE_KEY_PASSWORD。"
            echo "::error::没有稳定签名时禁止发布，以免再次生成无法安装或无法持续升级的 APK。"
            exit 1
          fi

          extract_secret() {
            raw="$1"
            key="$2"
            matched="$(printf '%s\n' "$raw" | sed -n "s/^${key}=//p" | head -n 1)"
            if [ -n "$matched" ]; then
              printf '%s' "$matched"
            else
              printf '%s' "$raw"
            fi
          }

          normalize_base64() {
            value="$(printf '%s' "$1" | tr -d '[:space:]')"
            remainder=$((${#value} % 4))
            case "$remainder" in
              0) ;;
              2) value="${value}==" ;;
              3) value="${value}=" ;;
              *)
                echo "::error::RELEASE_KEYSTORE 的 Base64 长度非法，无法通过补齐填充修复。"
                return 1
                ;;
            esac
            printf '%s' "$value"
          }

          KEYSTORE_VALUE="$(extract_secret "$KEYSTORE_B64" "RELEASE_KEYSTORE")"
          KEYSTORE_VALUE="${KEYSTORE_VALUE#\"}"
          KEYSTORE_VALUE="${KEYSTORE_VALUE%\"}"
          KEYSTORE_VALUE="$(normalize_base64 "$KEYSTORE_VALUE")"

          if ! printf '%s' "$KEYSTORE_VALUE" | base64 -d > "$RUNNER_TEMP/release.keystore"; then
            echo "::error::RELEASE_KEYSTORE 无法解码，请检查仓库 Secret 内容。"
            exit 1
          fi

          PASSWORD_VALUE="$(extract_secret "$RELEASE_PASSWORD" "RELEASE_KEY_PASSWORD")"
          PASSWORD_VALUE="${PASSWORD_VALUE#\"}"
          PASSWORD_VALUE="${PASSWORD_VALUE%\"}"
          PASSWORD_VALUE="$(printf '%s' "$PASSWORD_VALUE" | tr -d '\r\n')"

          STORE_PASSWORD="$PASSWORD_VALUE"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            if [ -n "$LEGACY_STORE_PASSWORD" ] && keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$LEGACY_STORE_PASSWORD" >/dev/null 2>&1; then
              STORE_PASSWORD="$LEGACY_STORE_PASSWORD"
            else
              echo "::error::密钥库已成功解码，但无法使用当前或旧版仓库密码打开。请核对 RELEASE_KEY_PASSWORD / RELEASE_KEYSTORE_PASSWORD 与该密钥库是否匹配。"
              exit 1
            fi
          fi

          KEY_ALIAS=""
          for CANDIDATE_ALIAS in "$LEGACY_KEY_ALIAS" "777-release"; do
            if [ -n "$CANDIDATE_ALIAS" ] && keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$STORE_PASSWORD" -alias "$CANDIDATE_ALIAS" >/dev/null 2>&1; then
              KEY_ALIAS="$CANDIDATE_ALIAS"
              break
            fi
          done

          if [ -z "$KEY_ALIAS" ]; then
            mapfile -t PRIVATE_ALIASES < <(LC_ALL=C keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$STORE_PASSWORD" | awk -F',' '/PrivateKeyEntry/ { gsub(/^[ \\t]+|[ \\t]+$/, "", $1); print $1 }')
            if [ "${#PRIVATE_ALIASES[@]}" -eq 1 ]; then
              KEY_ALIAS="${PRIVATE_ALIASES[0]}"
            else
              echo "::error::密钥库可以打开，但无法唯一确定签名私钥别名。请配置 RELEASE_KEY_ALIAS，或保证密钥库只有一个 PrivateKeyEntry。"
              exit 1
            fi
          fi

          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          echo "DSH_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "DSH_RELEASE_KEY_PASSWORD=$PASSWORD_VALUE" >> "$GITHUB_ENV"
          echo "DSH_RELEASE_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      # The tag is the single source of the shipped version; see app/build.gradle.kts.
      - name: Derive version from tag
        run: echo "DSH_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :core:test :mock-harness:test :app:testReleaseUnitTest --stacktrace

      - name: Build release APK
        env:
          DSH_KEYSTORE: ${{ runner.temp }}/release.keystore
          DSH_KEYSTORE_PASSWORD: ${{ env.DSH_RELEASE_STORE_PASSWORD }}
          DSH_KEY_ALIAS: ${{ env.DSH_RELEASE_ALIAS }}
          DSH_KEY_PASSWORD: ${{ env.DSH_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify Android 16 APK
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          .github/scripts/verify-android16-apk.sh "$APK"

      - name: Checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          generate_release_notes: true
