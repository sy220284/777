name: Release APK

'on':
  # GitHub schedule 可能漏发：完整 main CI 成功时及时检查，半小时定时兜底。
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # 当前发布批次不可被下一次触发打断；尚未开始的下一批只需处理最新快照。
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-release:
    # 不允许 PR、失败的 CI 或外部仓库的 workflow_run 获得发版资格。
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      version: ${{ steps.detect.outputs.version }}
      release_sha: ${{ steps.detect.outputs.release_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Detect tested release candidate
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          skip_release() {
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          }

          # 每次触发均锁定事件创建时的主线提交，发布中发生的新合并留给下一批。
          BATCH_SHA="$(git rev-parse HEAD)"
          RELEASE_SHA="$BATCH_SHA"

          # A backend-only baseline is intentionally non-user-facing: never create
          # a release, even when all infrastructure and device tests are green.
          if [ -f docs/UI-BACKEND-RESET.zh-CN.md ]; then
            echo "当前分支为无界面后端基线；禁止自动发布空白客户端 APK。"
            skip_release
            exit 0
          fi

          release_equivalent_to_batch() {
            release_sha="$1"
            batch_sha="$2"
            if [ "$release_sha" = "$batch_sha" ]; then
              return 0
            fi

            comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$release_sha...$batch_sha" 2>/dev/null || true)"
            status="$(printf '%s' "$comparison" | jq -r '.status // empty')"
            if [ "$status" != "ahead" ]; then
              return 1
            fi
            # GitHub compare returns at most 300 changed-file entries. Never
            # classify an incomplete change list as release-equivalent.
            count="$(printf '%s' "$comparison" | jq -r '.files | length // 0')"
            if [ "$count" -ge 300 ]; then
              echo "发布等价判断：变更文件达到 API 比较上限，拒绝以不完整文件列表放行。" >&2
              return 1
            fi

            changes="$RUNNER_TEMP/release-change-files.txt"
            printf '%s' "$comparison" | jq -r '.files[]? | (.filename, .previous_filename?) | select(. != null and . != "")' | sort -u > "$changes"
            python3 "$RUNNER_TEMP/classify-ci-scope.py" --paths-file "$changes" --release-safe
          }

          # An ordinary CI success (docs/automation lane) is not release evidence.
          # Only a completed full main CI matrix may authorize a binary release.
          has_full_main_validation() {
            candidate_sha="$1"
            ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$candidate_sha&status=success&per_page=100" \
              --jq '.workflow_runs[] | select(.name == "CI" and .event == "push" and .conclusion == "success") | .id')"
            [ -n "$ids" ] || return 1
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
              if printf '%s' "$jobs" | jq -e '
                [.jobs[] | select(.conclusion == "success") | .name] as $passed
                | (["scope", "static-gates", "architecture-3-gates",
                    "unit-tests", "build-arm64",
                    "device-artifacts-x86", "android-16-instrumented",
                    "android-17-instrumented", "merge-gate"]
                   | all(. as $lane | $passed | index($lane) != null))
              ' >/dev/null; then
                return 0
              fi
            done <<< "$ids"
            return 1
          }

          # 比对目标固定为本次触发快照，绝不追随发布期间变化的 main。
          cp .github/scripts/classify-ci-scope.py "$RUNNER_TEMP/classify-ci-scope.py"

          # An explicitly retired GitHub Release must never be regenerated from
          # an unchanged APK. Preserve the tag and source SHA as audit evidence.
          RETIRED_TAGS=""
          if [ -f .github/scripts/retired-releases.txt ]; then
            while read -r retired_tag retired_sha retired_id; do
              [ -n "$retired_tag" ] || continue
              [[ "$retired_tag" == \#* ]] && continue
              if [[ ! "$retired_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-777\.[0-9]+$ ]] ||
                 [[ ! "$retired_sha" =~ ^[0-9a-f]{40}$ ]] ||
                 [[ ! "$retired_id" =~ ^[0-9]+$ ]]; then
                echo "::error::Invalid retired release ledger entry: $retired_tag"
                exit 1
              fi
              RETIRED_TAGS="${RETIRED_TAGS}${retired_tag}"$'\n'
              if release_equivalent_to_batch "$retired_sha" "$BATCH_SHA"; then
                echo "::notice::Retired $retired_tag matches current APK; refusing to recreate it."
                skip_release
                exit 0
              fi
            done < .github/scripts/retired-releases.txt
          fi

          if ! has_full_main_validation "$RELEASE_SHA"; then
            echo "本批次提交未完成主线完整 CI；寻找与本批次产物等价的已验证候选。"
            FOUND_CANDIDATE=false
            while IFS= read -r candidate_sha; do
              [ -n "$candidate_sha" ] || continue
              if release_equivalent_to_batch "$candidate_sha" "$BATCH_SHA" &&
                 has_full_main_validation "$candidate_sha"; then
                RELEASE_SHA="$candidate_sha"
                FOUND_CANDIDATE=true
                echo "找到本批次等价的完整验证候选：$RELEASE_SHA -> $BATCH_SHA"
                break
              fi
            done < <(
              gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&status=success&per_page=100" \
                --jq '.workflow_runs[] | select(.name == "CI" and .event == "push" and .conclusion == "success") | .head_sha' |
                awk '!seen[$0]++' |
                head -n 50
            )
            if [ "$FOUND_CANDIDATE" != "true" ]; then
              echo "本批次没有符合完整验收的构建候选，本次跳过，下一批重新检查。"
              skip_release
              exit 0
            fi
          fi

          if ! release_equivalent_to_batch "$RELEASE_SHA" "$BATCH_SHA"; then
            echo "候选提交与本批次快照产物不等价：$RELEASE_SHA != $BATCH_SHA"
            skip_release
            exit 0
          fi
          if [ "$RELEASE_SHA" != "$BATCH_SHA" ]; then
            echo "本批次只有不影响 APK 的变更：$RELEASE_SHA -> $BATCH_SHA"
          fi

          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

          RELEASE_TAGS="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-777\.[0-9]+$' || true
          )"
          MAX_RELEASE_TAG="$(printf '%s\n' "$RELEASE_TAGS" | sed '/^$/d' | sort -V | tail -n 1)"
          MAX_RESERVED_TAG="$(printf '%s\n%s\n' "$MAX_RELEASE_TAG" "$RETIRED_TAGS" | sed '/^$/d' | sort -V | tail -n 1)"

          # Compare against the latest *published* binary, not the previous
          # Git commit. A docs-only main change cannot produce a new APK tag.
          classifier="$RUNNER_TEMP/classify-ci-scope.py"
          if [ ! -s "$classifier" ]; then
            git fetch --no-tags --depth=1 origin "$RELEASE_SHA" >/dev/null 2>&1
            git show "$RELEASE_SHA:.github/scripts/classify-ci-scope.py" > "$classifier"
          fi
          if [ -n "$MAX_RELEASE_TAG" ]; then
            git fetch --no-tags --depth=1 origin "$RELEASE_SHA" >/dev/null 2>&1
            git fetch --no-tags --depth=1 origin "refs/tags/$MAX_RELEASE_TAG" >/dev/null 2>&1
            published_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
            changes="$RUNNER_TEMP/release-since-published.txt"
            git diff --no-renames --name-only --diff-filter=ACMRD "$published_sha" "$RELEASE_SHA" > "$changes"
            if python3 "$classifier" --paths-file "$changes" --release-safe; then
              echo "相对上一正式 APK 没有影响产物的变化，不发布新版本。"
              skip_release
              exit 0
            fi
          fi

          if ! has_full_main_validation "$RELEASE_SHA"; then
            echo "缺少与发布提交一致的完整 main CI 验收（双模拟器、ARM64、x86），拒绝发布。"
            skip_release
            exit 0
          fi

          RELEASED_TARGET_TAG="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.draft == false and .prerelease == false and .target_commitish == \"$RELEASE_SHA\") | .tag_name" |
              head -n 1
          )"
          if [ -n "$RELEASED_TARGET_TAG" ]; then
            echo "当前主线提交已经发布：$RELEASE_SHA -> $RELEASED_TARGET_TAG"
            skip_release
            exit 0
          fi

          FALLBACK_VERSION="$(tr -d '\r\n' < .github/release-version)"
          if [[ "$MAX_RESERVED_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+-777\.)([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}$((BASH_REMATCH[2] + 1))"
          elif [[ "$FALLBACK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-777\.[0-9]+$ ]]; then
            VERSION="$FALLBACK_VERSION"
          else
            echo "::error::无法从最高正式 Release 或 .github/release-version 推导发布版本。"
            exit 1
          fi

          CANDIDATE_TAG="v$VERSION"
          if [ -n "$MAX_RESERVED_TAG" ]; then
            HIGHEST_TAG="$(printf '%s\n%s\n' "$CANDIDATE_TAG" "$MAX_RESERVED_TAG" | sort -V | tail -n 1)"
            if [ "$HIGHEST_TAG" != "$CANDIDATE_TAG" ] || [ "$CANDIDATE_TAG" = "$MAX_RESERVED_TAG" ]; then
              echo "::error::拒绝生成非递增版本：$CANDIDATE_TAG <= $MAX_RESERVED_TAG"
              exit 1
            fi
          fi
          echo "检测到已通过 CI 且尚未发布的主线：$RELEASE_SHA -> v$VERSION"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.check-release.outputs.release_sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 27
      - uses: ./.github/actions/setup-android-cached
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .gradle/runtime-cache
          key: runtime-${{ runner.os }}-arm64-v8a-${{ hashFiles('tools/runtime/prepare-termux-*.sh', 'tools/runtime/prepare-hdiffpatch.sh') }}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Validate release signing material
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$RELEASE_PASSWORD" ]; then
            echo "::error::正式 APK 只需配置两个仓库 Secret：RELEASE_KEYSTORE 与 RELEASE_KEY_PASSWORD。"
            echo "::error::没有稳定签名时禁止发布，以免再次生成无法安装或无法持续升级的 APK。"
            exit 1
          fi

          extract_secret() {
            raw="$1"
            key="$2"
            matched="$(printf '%s\n' "$raw" | sed -n "s/^${key}=//p" | head -n 1)"
            if [ -n "$matched" ]; then
              printf '%s' "$matched"
            else
              printf '%s' "$raw"
            fi
          }

          KEYSTORE_VALUE="$(extract_secret "$KEYSTORE_B64" "RELEASE_KEYSTORE")"
          KEYSTORE_VALUE="${KEYSTORE_VALUE#\"}"
          KEYSTORE_VALUE="${KEYSTORE_VALUE%\"}"
          KEYSTORE_VALUE="$(printf '%s' "$KEYSTORE_VALUE" | tr -d '[:space:]')"

          PASSWORD_VALUE="$(extract_secret "$RELEASE_PASSWORD" "RELEASE_KEY_PASSWORD")"
          PASSWORD_VALUE="${PASSWORD_VALUE#\"}"
          PASSWORD_VALUE="${PASSWORD_VALUE%\"}"
          PASSWORD_VALUE="$(printf '%s' "$PASSWORD_VALUE" | tr -d '\r\n')"

          decode_candidate() {
            value="$1"
            out="$2"
            printf '%s' "$value" | base64 -d > "$out" 2>/dev/null
          }

          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          if decode_candidate "$KEYSTORE_VALUE" "$KEYSTORE_PATH"; then
            :
          else
            remainder=$((${#KEYSTORE_VALUE} % 4))
            case "$remainder" in
              2) PADDED_VALUE="${KEYSTORE_VALUE}==" ;;
              3) PADDED_VALUE="${KEYSTORE_VALUE}=" ;;
              *)
                echo "::error::RELEASE_KEYSTORE 的 Base64 内容不完整或已损坏。"
                exit 1
                ;;
            esac

            if ! decode_candidate "$PADDED_VALUE" "$KEYSTORE_PATH"; then
              echo "::error::RELEASE_KEYSTORE 无法解码。"
              exit 1
            fi

            if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$PASSWORD_VALUE" -alias "777-release" >/dev/null 2>&1; then
              echo "::error::RELEASE_KEYSTORE 看起来被截断：补齐 Base64 填充后仍无法得到有效密钥库。请重新粘贴完整值。"
              exit 1
            fi
            echo "::notice::RELEASE_KEYSTORE 仅缺少 Base64 填充，已安全补齐。"
          fi

          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$PASSWORD_VALUE" -alias "777-release" >/dev/null 2>&1; then
            echo "::error::签名密钥库或密码不匹配。请确认 RELEASE_KEYSTORE 为完整密钥库 Base64，RELEASE_KEY_PASSWORD 为该密钥库与私钥共用密码。"
            exit 1
          fi

          echo "DSH_RELEASE_PASSWORD=$PASSWORD_VALUE" >> "$GITHUB_ENV"

      - name: Derive release version
        id: version
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-777\.[0-9]+$ ]]; then
            echo "::error::发布版本格式无效：$VERSION"
            exit 1
          fi
          echo "DSH_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # CI 已完成单测、Lint、优化包校验与 Android 16/17 仪器测试；
      # 发布阶段只构建正式签名包，避免同一提交重复消耗运行器。

      - name: Build release APK
        env:
          DSH_KEYSTORE: ${{ runner.temp }}/release.keystore
          DSH_KEYSTORE_PASSWORD: ${{ env.DSH_RELEASE_PASSWORD }}
          DSH_KEY_ALIAS: 777-release
          DSH_KEY_PASSWORD: ${{ env.DSH_RELEASE_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify Android 16 APK
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          .github/scripts/verify-android16-apk.sh "$APK"

      - name: Prepare incremental update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_DIR="app/build/outputs/apk/release"
          NEW_APK="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$NEW_APK"

          ASSET_DIR="$GITHUB_WORKSPACE/.release-assets"
          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"

          APK_NAME="$(basename "$NEW_APK")"
          cp "$NEW_APK" "$ASSET_DIR/$APK_NAME"
          NEW_APK="$ASSET_DIR/$APK_NAME"
          NEW_SIZE="$(stat -c '%s' "$NEW_APK")"
          NEW_SHA="$(sha256sum "$NEW_APK" | awk '{print $1}')"
          PATCH_JSON="$RUNNER_TEMP/update-patches.json"
          printf '[]\n' > "$PATCH_JSON"

          PREVIOUS_TAG="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' 2>/dev/null |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-777\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
          )"
          CURRENT_TAG="${{ steps.version.outputs.tag }}"

          if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$CURRENT_TAG" ]; then
            PREVIOUS_DIR="$RUNNER_TEMP/previous-release"
            rm -rf "$PREVIOUS_DIR"
            mkdir -p "$PREVIOUS_DIR"

            if gh release download "$PREVIOUS_TAG" --pattern '*.apk' --dir "$PREVIOUS_DIR"; then
              OLD_APK="$(find "$PREVIOUS_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
              if [ -n "$OLD_APK" ]; then
                HDIFF_VERSION="5.1.3"
                HDIFF_ARCHIVE="hdiffpatch_v${HDIFF_VERSION}_bin_linux64.zip"
                HDIFF_URL="https://github.com/sisong/HDiffPatch/releases/download/v${HDIFF_VERSION}/${HDIFF_ARCHIVE}"
                HDIFF_SHA256="628963bf2ee9108a97260fa5eef44acd9ec94369b76090a957c9182b3abbb558"
                HDIFF_DIR="$RUNNER_TEMP/hdiffpatch"
                HDIFF_ZIP="$RUNNER_TEMP/$HDIFF_ARCHIVE"
                rm -rf "$HDIFF_DIR" "$HDIFF_ZIP"
                mkdir -p "$HDIFF_DIR"

                if curl --fail --location --retry 3 --retry-delay 2 "$HDIFF_URL" --output "$HDIFF_ZIP" &&
                   printf '%s  %s\n' "$HDIFF_SHA256" "$HDIFF_ZIP" | sha256sum -c - &&
                   unzip -q "$HDIFF_ZIP" -d "$HDIFF_DIR"; then
                  HDIFFZ="$(find "$HDIFF_DIR" -type f -name hdiffz -print -quit)"
                  HPATCHZ="$(find "$HDIFF_DIR" -type f -name hpatchz -print -quit)"
                  if [ -n "$HDIFFZ" ] && [ -n "$HPATCHZ" ]; then
                    chmod +x "$HDIFFZ" "$HPATCHZ"
                    FROM_VERSION="${PREVIOUS_TAG#v}"
                    TO_VERSION="$DSH_VERSION_NAME"
                    SAFE_FROM="$(printf '%s' "$FROM_VERSION" | tr -c 'A-Za-z0-9._-' '_')"
                    SAFE_TO="$(printf '%s' "$TO_VERSION" | tr -c 'A-Za-z0-9._-' '_')"
                    PATCH_NAME="delta-${SAFE_FROM}-to-${SAFE_TO}.hpatch"
                    PATCH_PATH="$ASSET_DIR/$PATCH_NAME"
                    REBUILT_APK="$RUNNER_TEMP/rebuilt-from-delta.apk"
                    rm -f "$PATCH_PATH" "$REBUILT_APK"

                    if "$HDIFFZ" -s-64 -WD -w-2m -f -p-4 -c-zstd-19-24 -C-xxh128 \
                         "$OLD_APK" "$NEW_APK" "$PATCH_PATH" &&
                       "$HPATCHZ" -f "$OLD_APK" "$PATCH_PATH" "$REBUILT_APK"; then
                      REBUILT_SHA="$(sha256sum "$REBUILT_APK" | awk '{print $1}')"
                      PATCH_SIZE="$(stat -c '%s' "$PATCH_PATH")"
                      if [ "$REBUILT_SHA" = "$NEW_SHA" ] &&
                         [ "$((PATCH_SIZE * 100))" -lt "$((NEW_SIZE * 65))" ]; then
                        OLD_SHA="$(sha256sum "$OLD_APK" | awk '{print $1}')"
                        PATCH_SHA="$(sha256sum "$PATCH_PATH" | awk '{print $1}')"
                        jq -n \
                          --arg from "$FROM_VERSION" \
                          --arg to "$TO_VERSION" \
                          --arg asset "$PATCH_NAME" \
                          --arg sha256 "$PATCH_SHA" \
                          --arg sourceSha256 "$OLD_SHA" \
                          --arg targetSha256 "$NEW_SHA" \
                          --argjson size "$PATCH_SIZE" \
                          '[{
                            fromVersion: $from,
                            toVersion: $to,
                            algorithm: "hdiffpatch-window-zstd-v1",
                            asset: $asset,
                            size: $size,
                            sha256: $sha256,
                            sourceSha256: $sourceSha256,
                            targetSha256: $targetSha256
                          }]' > "$PATCH_JSON"
                        echo "::notice::已生成增量包：$PATCH_NAME ($PATCH_SIZE / $NEW_SIZE bytes)"
                      else
                        echo "::notice::增量包校验失败或达到完整 APK 的 65%，本版仅发布完整包。"
                        rm -f "$PATCH_PATH"
                      fi
                    else
                      echo "::warning::HDiffPatch 生成或回放失败，本版继续发布完整 APK。"
                      rm -f "$PATCH_PATH" "$REBUILT_APK"
                    fi
                  fi
                else
                  echo "::warning::HDiffPatch 工具下载或校验失败，本版继续发布完整 APK。"
                fi
              fi
            else
              echo "::notice::无法下载上一正式版 APK，本版仅发布完整包。"
            fi
          fi

          MANIFEST_PATH="$ASSET_DIR/update-manifest.json"
          jq -n \
            --arg targetVersion "$DSH_VERSION_NAME" \
            --arg apkName "$APK_NAME" \
            --arg apkSha256 "$NEW_SHA" \
            --argjson apkSize "$NEW_SIZE" \
            --slurpfile patches "$PATCH_JSON" \
            '{
              schema: 1,
              targetVersion: $targetVersion,
              targetApk: {
                name: $apkName,
                size: $apkSize,
                sha256: $apkSha256
              },
              patches: $patches[0]
            }' > "$MANIFEST_PATH"

          (
            cd "$ASSET_DIR"
            CHECKSUM_TMP="$RUNNER_TEMP/SHA256SUMS.txt"
            rm -f SHA256SUMS.txt "$CHECKSUM_TMP"
            find . -maxdepth 1 -type f -printf '%f\n' |
              sort |
              while IFS= read -r file; do sha256sum "$file"; done > "$CHECKSUM_TMP"
            mv "$CHECKSUM_TMP" SHA256SUMS.txt
            ls -lh
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ needs.check-release.outputs.release_sha }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            .release-assets/*
          generate_release_notes: true
