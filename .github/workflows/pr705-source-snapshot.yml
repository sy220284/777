name: PR705 源码快照中转
on:
  push:
    branches:
      - chore/pr705-local-snapshot-20261017
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出 PR705 指定提交
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 857605684ecc14a6773eda1eab61f1600ba3dedf
          persist-credentials: false
      - name: 检查快照身份并封装
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "857605684ecc14a6773eda1eab61f1600ba3dedf"
          printf '%s\n' "857605684ecc14a6773eda1eab61f1600ba3dedf" > "$RUNNER_TEMP/SNAPSHOT_SHA"
          tar -czf "$RUNNER_TEMP/PR705-SOURCE.tar.gz" --exclude=.git .
          test -s "$RUNNER_TEMP/PR705-SOURCE.tar.gz"
      - name: 上传源码快照
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr705-source-857605684ecc
          path: |
            ${{ runner.temp }}/PR705-SOURCE.tar.gz
            ${{ runner.temp }}/SNAPSHOT_SHA
          if-no-files-found: error
          retention-days: 1
