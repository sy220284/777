name: PR705 V3 verified compile source
on:
  push:
    branches:
      - chore/pr705-local-snapshot-20261017
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 470f2cf80746f63c60e3782eaf963ee4a62e3bca
          persist-credentials: false
      - name: Archive source
        run: |
          test "$(git rev-parse HEAD)" = "470f2cf80746f63c60e3782eaf963ee4a62e3bca"
          echo "470f2cf80746f63c60e3782eaf963ee4a62e3bca" > "$RUNNER_TEMP/SNAPSHOT_SHA"
          tar -czf "$RUNNER_TEMP/PR705-SOURCE.tar.gz" --exclude=.git .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr705-v3-20-470f2cf80746
          path: |
            ${{ runner.temp }}/PR705-SOURCE.tar.gz
            ${{ runner.temp }}/SNAPSHOT_SHA
          retention-days: 1
