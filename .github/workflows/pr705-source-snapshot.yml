name: PR705 temporary V3 source
on:
  push:
    branches:
      - chore/pr705-local-snapshot-20261017
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d957a0b8b39d38d54902ac9ee3f498fb84dddcdc
          persist-credentials: false
      - name: Export verified snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d957a0b8b39d38d54902ac9ee3f498fb84dddcdc"
          printf '%s\n' "d957a0b8b39d38d54902ac9ee3f498fb84dddcdc" > "$RUNNER_TEMP/SNAPSHOT_SHA"
          tar -czf "$RUNNER_TEMP/PR705-V3-SOURCE.tar.gz" --exclude=.git .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr705-v3-source-d957a0b8b39d
          path: |
            ${{ runner.temp }}/PR705-V3-SOURCE.tar.gz
            ${{ runner.temp }}/SNAPSHOT_SHA
          retention-days: 1
