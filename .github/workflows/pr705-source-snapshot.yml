name: PR705 V3 local source handoff
on:
  push:
    branches:
      - chore/pr705-local-snapshot-20261017
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 79b63948b5e26ef66a22bbe449a34b59346ecfba
          persist-credentials: false
      - name: Export verified source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "79b63948b5e26ef66a22bbe449a34b59346ecfba"
          echo "79b63948b5e26ef66a22bbe449a34b59346ecfba" > "${RUNNER_TEMP}/SNAPSHOT_SHA"
          tar -czf "${RUNNER_TEMP}/PR705-V3-SOURCE.tar.gz" --exclude=.git .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr705-v3-src-79b63948b5e2
          path: |
            ${{ runner.temp }}/PR705-V3-SOURCE.tar.gz
            ${{ runner.temp }}/SNAPSHOT_SHA
          retention-days: 1
