name: 扩展市场与插件链路回归

'on':
  pull_request:
    paths:
      - 'app/src/main/java/com/labteto/dshmobile/ui/screens/tools/**'
      - 'app/src/main/java/com/labteto/dshmobile/local/tools/**'
      - 'app/src/main/java/com/labteto/dshmobile/local/presentation/**'
      - 'app/src/main/java/com/labteto/dshmobile/uicontract/**'
      - 'app/src/test/java/com/labteto/dshmobile/local/tools/**'
      - 'app/src/test/java/com/labteto/dshmobile/ui/screens/tools/**'
      - 'app/src/androidTest/java/com/labteto/dshmobile/ui/screens/tools/**'
      - '.github/workflows/extension-marketplace-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-market-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  market:
    name: 完整单元测试与 Android UI 编译
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 27
      - uses: ./.github/actions/setup-android-cached
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: 应用全部 JVM 单元测试
        run: ./gradlew --max-workers=2 :app:testDebugUnitTest --stacktrace --console=plain
      - name: 编译 Android UI 测试包并构建 APK
        run: ./gradlew --max-workers=2 :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace --console=plain
