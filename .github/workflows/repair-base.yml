name: repair-frozen-base

on:
  push:
    branches: [final-product]
    paths:
      - tools/repair_base_snapshot.py
      - .github/workflows/repair-base.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-product
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 双向核验并重建冻结基线
        run: python tools/repair_base_snapshot.py
      - name: 严格校验修复后的数据链
        run: python tools/load_history.py
      - name: 提交修复后的冻结基线与清单
        run: |
          if git diff --quiet -- data/ssq_history_2003_2026-05-03.csv.gz data/current_manifest.json; then
            echo "no repair changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ssq_history_2003_2026-05-03.csv.gz data/current_manifest.json
          git commit -m "fix: rebuild corrupted frozen history snapshot"
          git push origin HEAD:final-product
