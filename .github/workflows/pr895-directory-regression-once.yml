name: PR895 项目目录迁移单次回归
on:
  push:
    branches:
      - feat/codex-capability-alignment-20261112
    paths:
      - .github/workflows/pr895-directory-regression-once.yml

permissions:
  contents: read

jobs:
  focused-android:
    name: 项目目录 JVM 回归与 Android 编译
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-toolchain-home
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 27
      - uses: ./.github/actions/setup-android-cached
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: 恢复现有 Gradle 依赖
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .gradle-toolchain-home/caches/modules-2
            .gradle-toolchain-home/caches/transforms-*
            .gradle-toolchain-home/wrapper/dists
          key: toolchain-deps-${{ runner.os }}-jdk27-v1-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml', '**/gradle.lockfile') }}
      - name: 执行项目与文件写入相关 JVM 测试
        run: |
          set -euo pipefail
          ./gradlew --max-workers=2 :app:testDebugUnitTest \
            --tests 'com.labteto.dshmobile.local.work.LocalWorkProjectCatalogTest' \
            --tests 'com.labteto.dshmobile.local.LocalWorkspaceTest' \
            --stacktrace --console=plain
      - name: 编译 Android 应用及 Compose 测试安装包
        run: |
          set -euo pipefail
          ./gradlew --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest \
            --stacktrace --console=plain
