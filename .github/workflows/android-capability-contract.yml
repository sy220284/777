name: Android 能力契约回归

'on':
  pull_request:
    paths:
      - 'app/src/main/java/com/labteto/dshmobile/local/tools/**'
      - 'app/src/test/java/com/labteto/dshmobile/local/tools/**'
      - 'app/src/main/java/com/labteto/dshmobile/ui/screens/tools/**'
      - 'app/src/test/java/com/labteto/dshmobile/ui/screens/tools/**'
      - 'app/src/androidTest/java/com/labteto/dshmobile/ui/screens/tools/**'
      - 'app/src/main/res/drawable/ic_ui_*.xml'
      - 'app/src/main/java/com/labteto/dshmobile/local/work/**'
      - 'harness-core/src/main/kotlin/com/labteto/dshmobile/harness/capability/**'
      - 'harness-device-android/src/**'
      - '.github/workflows/android-capability-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-capability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: 编译、单元测试与调试包验证
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 27
      - uses: ./.github/actions/setup-android-cached
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Shared capability contracts run first. A failing fast core/MCP test must not wait
      # behind the full Android application test suite on every corrective commit.
      - name: 共享运行时、MCP 互操作与设备能力单元测试
        run: ./gradlew --max-workers=2 :harness-core:test :harness-interop:test :harness-device-android:testDebugUnitTest --stacktrace --console=plain
      - name: 应用 JVM 单元测试
        run: ./gradlew --max-workers=2 :app:testDebugUnitTest --stacktrace --console=plain
      - name: 编译 Android 界面测试代码
        run: ./gradlew --max-workers=2 :app:compileDebugAndroidTestKotlin --stacktrace --console=plain
      - name: 构建可安装的调试包
        run: ./gradlew --max-workers=2 :app:assembleDebug --stacktrace --console=plain
