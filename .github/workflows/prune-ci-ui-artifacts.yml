name: 777 CI 测试证据只保留最新版

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-ci-ui-artifacts.yml'
      - 'tools/ci/prune_ui_artifacts.py'
      - 'tools/ci/test_prune_ui_artifacts.py'
  pull_request:
    paths:
      - '.github/workflows/prune-ci-ui-artifacts.yml'
      - 'tools/ci/prune_ui_artifacts.py'
      - 'tools/ci/test_prune_ui_artifacts.py'
  workflow_run:
    workflows:
      - 'Android 能力契约回归'
      - '777 聊天与工作真实设备交互回归'
      - '777 扩展市场 Android 交互验证'
      - '本地会话存储 Android 迁移实测'
      - '777 架构 3.0 全仓调用关系审计'
    types: [completed]
  workflow_dispatch:

# 仅检出默认分支的受信任脚本，不执行来源不明的 PR 文件。
permissions:
  contents: read

concurrency:
  group: 777-ci-media-prune
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: CI 证据保留规则单元测试
        run: python3 -m unittest discover -s tools/ci -p 'test_prune_ui_artifacts.py' -v

  prune:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: 测试只保留最新版的删除规则
        run: python3 -m unittest discover -s tools/ci -p 'test_prune_ui_artifacts.py' -v
      - name: 清理旧 CI 截图、视频及指定测试报告 Artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/ci/prune_ui_artifacts.py --apply
