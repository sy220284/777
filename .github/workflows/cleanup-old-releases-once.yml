name: one-time-cleanup-old-releases

on:
  push:
    paths:
      - ".github/workflows/cleanup-old-releases-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only latest three GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "release-cleanup",
          }

          releases = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  batch = json.load(resp)
              if not batch:
                  break
              releases.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          releases.sort(key=lambda r: r.get("published_at") or r.get("created_at") or "", reverse=True)
          keep = releases[:3]
          remove = releases[3:]

          print("Keeping:", ", ".join(r["tag_name"] for r in keep))
          print("Deleting", len(remove), "older releases")

          for rel in remove:
              url = f"https://api.github.com/repos/{repo}/releases/{rel['id']}"
              req = urllib.request.Request(url, headers=headers, method="DELETE")
              with urllib.request.urlopen(req) as resp:
                  if resp.status not in (204, 200):
                      raise RuntimeError(f"Failed deleting {rel['tag_name']}: HTTP {resp.status}")
              print("Deleted:", rel["tag_name"])
          PY
