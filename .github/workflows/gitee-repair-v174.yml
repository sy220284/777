name: Gitee Repair v174

'on':
  push:
    branches:
      - fix/gitee-large-asset-upload

permissions:
  contents: read

concurrency:
  group: gitee-repair-v174
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/gitee-large-asset-upload

      - name: Wait for older v174 repair runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 80); do
            ACTIVE="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
                --jq '[.workflow_runs[] | select(.name == "Gitee Repair v174" and (.id|tostring) != "'"$GITHUB_RUN_ID"'" and .status != "completed")] | length'
            )"
            if [ "$ACTIVE" -eq 0 ]; then
              echo "旧 v174 修复任务已全部结束。"
              exit 0
            fi
            echo "仍有 $ACTIVE 个旧 v174 修复任务运行中，等待..."
            sleep 15
          done
          echo "::error::等待旧 v174 修复任务结束超时。"
          exit 1

      - name: Download v174 GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .release-assets
          mkdir -p .release-assets
          gh release download v0.12.0-777.174 --dir .release-assets
          ls -lh .release-assets

      - name: Repair Gitee v174 mirror
        env:
          UPDATE_MIRROR_BASE_URL: ${{ vars.UPDATE_MIRROR_BASE_URL }}
          GITEE_MIRROR_ACCESS_TOKEN: ${{ secrets.GITEE_MIRROR_ACCESS_TOKEN }}
        run: |
          python3 .github/scripts/publish-gitee-update-mirror.py \
            --asset-dir .release-assets \
            --version 0.12.0-777.174
