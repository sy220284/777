  <!-- specs -->
  <g transform="translate(930 132)">
    <text x="0" y="28" class="h2">视觉规则</text>
    <rect x="0" y="48" width="600" height="250" rx="18" fill="#FFFFFF"/>
    <text x="24" y="82" class="body" font-weight="650">图标</text>
    <text x="24" y="108" class="small">24×24 网格 · 2px 描边 · round cap/join · 无填充 · 单色</text>
    <g transform="translate(28 132)" class="stroke"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></g>
    <g transform="translate(82 132)" class="stroke"><path d="M3 6h8l3 4h10v14H3z"/></g>
    <g transform="translate(136 132)" class="stroke"><path d="M2 13h5l3-8 6 16 3-8h5"/></g>
    <g transform="translate(190 132)" class="stroke"><path d="M3 4h7l3 3v17l-3-2H3z"/><path d="M23 4h-7l-3 3v17l3-2h7z"/></g>
    <text x="24" y="192" class="body" font-weight="650">间距 / 尺寸</text>
    <text x="24" y="218" class="small">侧栏内边距 24 · 行最小 48 · 快捷卡 56 · 圆角 14–18 · 分组间距 16</text>
    <text x="24" y="246" class="body" font-weight="650">色彩</text>
    <rect x="24" y="260" width="38" height="16" rx="8" fill="#F7F8F6"/><text x="72" y="273" class="caption">Canvas</text>
    <rect x="150" y="260" width="38" height="16" rx="8" fill="#FFFFFF" stroke="#E0E6E2"/><text x="198" y="273" class="caption">Surface</text>
    <rect x="286" y="260" width="38" height="16" rx="8" fill="#DCEEEC"/><text x="334" y="273" class="caption">Accent soft</text>
    <rect x="430" y="260" width="38" height="16" rx="8" fill="#3E8E8C"/><text x="478" y="273" class="caption">Accent</text>

    <text x="0" y="346" class="h2">交互规则</text>
    <rect x="0" y="366" width="600" height="314" rx="18" fill="#FFFFFF"/>
    <text x="24" y="404" class="body" font-weight="650">1. 侧栏只负责“进入能力”</text>
    <text x="24" y="430" class="small">管理型能力进入完整页面；快速选择进入 Sheet；确认/风险进入 Dialog。</text>
    <text x="24" y="470" class="body" font-weight="650">2. Chat / Work 骨架不换</text>
    <text x="24" y="496" class="small">只替换当前上下文、四个快捷入口和历史行语义，降低切换认知成本。</text>
    <text x="24" y="536" class="body" font-weight="650">3. 工作历史使用任务语义</text>
    <text x="24" y="562" class="small">运行中 / 完成 / 失败要有独立状态，避免继续用人物头像式会话行。</text>
    <text x="24" y="602" class="body" font-weight="650">4. 动效解释状态变化</text>
    <text x="24" y="628" class="small">点击反馈 80–120ms · 图标切换 120–160ms · 页面进入 180–220ms。</text>

    <text x="0" y="730" class="h2">入口承载</text>
    <rect x="0" y="750" width="600" height="222" rx="18" fill="#FFFFFF"/>
    <text x="24" y="786" class="body">人物 / 日记 / 工作空间 / 运行中心 / 任务 / 工具 / 远程 / 设置</text>
    <text x="24" y="812" class="small">→ 完整页面</text>
    <text x="24" y="852" class="body">人物快速切换 / 模型选择 / 群成员 / 快速运行状态</text>
    <text x="24" y="878" class="small">→ Bottom Sheet</text>
    <text x="24" y="918" class="body">审批 / Ask / 人物调节 / 高风险确认</text>
    <text x="24" y="944" class="small">→ Dialog</text>
