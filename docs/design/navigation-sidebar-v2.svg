      <g transform="translate(38 233)" class="stroke"><circle cx="9" cy="7" r="5"/><circle cx="18" cy="9" r="4"/><path d="M2 23c1-6 5-9 10-9s9 3 10 9"/><path d="M17 16c4 0 7 2 8 6"/></g>
