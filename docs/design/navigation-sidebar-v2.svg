  <!-- Work sidebar -->
  <g transform="translate(480 132)">
    <rect x="0" y="0" width="390" height="840" rx="28" fill="#F7F8F6" stroke="#CFD6D2"/>
    <text x="26" y="48" class="h2">神言神语</text>
    <g transform="translate(302 26)" class="stroke"><path d="M12 2v20M2 12h20"/></g>
    <g transform="translate(342 26)" class="stroke"><circle cx="10" cy="10" r="7"/><path d="M15 15l5 5"/></g>

    <rect x="24" y="70" width="342" height="42" rx="21" fill="#EAEFEC"/>
    <rect x="196" y="74" width="166" height="34" rx="17" fill="#FFFFFF"/>
    <text x="86" y="97" class="body">聊天</text>
    <text x="250" y="97" class="body" font-weight="650">工作</text>

    <rect x="24" y="128" width="342" height="74" rx="18" fill="#FFFFFF" stroke="#E0E6E2"/>
    <circle cx="58" cy="165" r="22" fill="#DCEEEC"/>
    <g transform="translate(46 153)" class="strokeA"><path d="M2 12h5l3-8 6 16 3-8h5"/></g>
    <text x="92" y="158" class="body" font-weight="650">重构侧边栏与导航</text>
    <text x="92" y="181" class="small">GPT-5.6 Sol · 运行中</text>

    <g>
      <rect x="24" y="218" width="166" height="58" rx="15" fill="#FFFFFF"/>
      <g transform="translate(38 233)" class="stroke"><path d="M3 6h8l3 4h10v14H3z"/></g><text x="76" y="252" class="body" font-weight="600">工作空间</text>
      <rect x="200" y="218" width="166" height="58" rx="15" fill="#FFFFFF"/>
      <g transform="translate(214 233)" class="strokeA"><path d="M2 13h5l3-8 6 16 3-8h5"/></g><text x="252" y="252" class="body" font-weight="600">运行中心</text>
      <rect x="24" y="286" width="166" height="58" rx="15" fill="#FFFFFF"/>
      <g transform="translate(38 301)" class="stroke"><circle cx="13" cy="13" r="10"/><path d="M13 7v6l4 2"/></g><text x="76" y="320" class="body" font-weight="600">自动任务</text>
      <rect x="200" y="286" width="166" height="58" rx="15" fill="#FFFFFF"/>
      <g transform="translate(214 301)" class="stroke"><path d="M5 20l6-6M15 4l5 5M12 7l5 5M3 22l6-1 12-12-5-5L4 16z"/></g><text x="252" y="320" class="body" font-weight="600">工具</text>
