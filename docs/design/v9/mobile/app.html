<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>神言 V9 · 极简界面草案</title>
<style>
/* ==========================================================================
   神言 V9 · 界面层
   方向：Minimalism & Swiss（ui-ux-pro-max）
   —— 大留白、几何网格、单一强调色、无装饰；阴影只留给浮层。
   令牌唯一来源：docs/design/v9/tokens.json（由 resolve-tokens.py 注入 CSS 变量）
   ========================================================================== */

:root{
  --canvas:#F7F8FA; --surface:#FFFFFF; --sunken:#EDF0F3;
  --ink:#14171A; --ink2:#565D64; --ink3:#616972;
  --rule:#E7EAEE; --ruleStrong:#D6DBE0;
  --accent:#0E6E78; --accentPressed:#0C5A62; --onAccent:#FFFFFF; --accentSoft:#E2EFF1;
  --success:#16794F; --warning:#9A6B12; --danger:#B42318;
  --persona-lan:#0E6E78; --persona-xiaoqing:#A9642C; --persona-yishu:#3A5A8C; --persona-xingyao:#96375A;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:40px;
  --radius-sm:8px; --radius-control:12px; --radius-card:16px; --radius-sheet:24px; --radius-overlay:16px; --radius-pill:999px;
  --fs-hero:30px; --fs-display:26px; --fs-title:21px; --fs-heading:17px; --fs-bodyStrong:15px;
  --fs-body:15px; --fs-bodyQuiet:14px; --fs-caption:12.5px; --fs-mono:13px;
  --lh-hero:38px; --lh-display:33px; --lh-title:28px; --lh-heading:24px; --lh-bodyStrong:23px;
  --lh-body:26px; --lh-bodyQuiet:22px; --lh-caption:18px; --lh-mono:20px;
  --track-display:-.02em; --track-title:-.02em; --track-heading:-.01em; --track-body:.01em;
  --shadow-card:0 1px 2px rgba(16,20,24,.04);
  --shadow-overlay:0 10px 30px -12px rgba(16,20,24,.20), 0 2px 6px -2px rgba(16,20,24,.08);
  --shadow-menu:0 6px 18px -6px rgba(16,20,24,.16), 0 1px 2px rgba(16,20,24,.05);
  --shadow-none:none;
  --dur-press:80ms; --dur-select:140ms; --dur-push:240ms; --dur-pop:180ms; --dur-sheet:260ms;
  --dur-dialog:200ms; --dur-sidebar:220ms; --dur-fade:140ms; --dur-progress:300ms;
  --ease:cubic-bezier(.2,.8,.2,1); --pressed-scale:.985;
  --touch:48px; --icon-sm:18px; --icon-md:22px; --icon-lg:24px;
  --font-ui:"Outfit","Noto Sans SC","PingFang SC","Microsoft Yahei",system-ui,-apple-system,sans-serif;
  --font-cn:"Noto Sans SC","PingFang SC","Microsoft Yahei",system-ui,sans-serif;
  --font-serif:"Noto Serif SC","Songti SC",serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}

body[data-theme="dark"]{
  --canvas:#0C0E10; --surface:#14171A; --sunken:#1B1F23;
  --ink:#F3F5F6; --ink2:#AAB2B8; --ink3:#848D94;
  --rule:#23282C; --ruleStrong:#333A40;
  --accent:#4FD1D8; --accentPressed:#37BAC1; --onAccent:#032629; --accentSoft:#10333A;
  --success:#4FBF9A; --warning:#E0A458; --danger:#F0837B;
  --shadow-card:0 1px 0 rgba(255,255,255,.03);
  --shadow-overlay:0 16px 40px -16px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.04);
  --shadow-menu:0 10px 26px -10px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.04);
}
body[data-theme="matte"]{
  --canvas:#0A0A0B; --surface:#101112; --sunken:#17181A;
  --ink:#F4F5F6; --ink2:#AEB4B9; --ink3:#838A90;
  --rule:#1E2124; --ruleStrong:#2E3236;
  --accent:#46C4CB; --accentPressed:#2FAEB5; --onAccent:#042629; --accentSoft:#0F3036;
  --shadow-card:none;
  --shadow-overlay:0 16px 40px -16px rgba(0,0,0,.85);
  --shadow-menu:0 10px 26px -10px rgba(0,0,0,.8);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{
  font-family:var(--font-ui);font-size:var(--fs-body);line-height:var(--lh-body);
  letter-spacing:var(--track-body);background:#0D0F11;color:var(--ink);
  transition:background var(--dur-fade) var(--ease),color var(--dur-fade) var(--ease);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{display:block;max-width:100%}
.ico{display:inline-block;width:var(--icon-md);height:var(--icon-md);flex:none;background:currentColor;
  -webkit-mask-image:var(--m);mask-image:var(--m);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
.ico.sm{width:var(--icon-sm);height:var(--icon-sm)}
.ico.lg{width:var(--icon-lg);height:var(--icon-lg)}

/* ==========================================================================
   舞台
   ========================================================================== */
.stage{
  min-height:100dvh;display:grid;place-items:center;
  grid-template-columns:minmax(280px,330px) auto minmax(280px,320px);
  gap:44px;padding:32px;background:#0D0F11;
}
.stage-note{align-self:start;color:#D9D5D0;max-width:330px}
.stage-note .eyebrow{font-size:11px;letter-spacing:.2em;font-weight:700;color:var(--accent)}
.stage-note h1{font-size:30px;line-height:1.2;letter-spacing:-.02em;margin:12px 0 14px;font-weight:700}
.stage-note h1 em{font-style:normal;color:var(--accent)}
.stage-note p{font-size:14px;line-height:1.8;color:#9A958F;margin:0 0 10px}
.stage-note .fine{font-size:12px;line-height:1.7;color:#78736E;margin-top:18px}
.stage-nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}
.stage-nav button{padding:8px 12px;border-radius:10px;border:1px solid #2A2E31;font-size:13px;color:#A8A29C;min-height:36px}
.stage-nav button[aria-current="true"]{background:var(--accent);border-color:transparent;color:var(--onAccent);font-weight:600}
.stage-panel{align-self:start;color:#D9D5D0;max-width:320px;max-height:84dvh;overflow:auto}
.stage-panel h2{font-size:19px;margin:0 0 4px;font-weight:600}
.stage-panel .sub{font-size:13px;color:#78736E;margin:0 0 14px}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pill-row button{padding:7px 12px;border-radius:8px;border:1px solid #2A2E31;font-size:13px;color:#A8A29C;min-height:34px}
.pill-row button[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--onAccent);font-weight:600}
.panel-block{border-top:1px solid #23272B;padding-top:14px;margin-top:14px}
.panel-title{font-size:11px;letter-spacing:.1em;color:#78736E;font-weight:700;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#A8A29C;padding:6px 0;border-bottom:1px solid #1E2124}
.kv:last-child{border-bottom:0}
.kv span:last-child{font-family:var(--font-mono);font-size:12px;color:#D9D5D0}
.swatch-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swatch{display:flex;align-items:center;gap:8px;font-size:12px;color:#A8A29C}
.swatch i{width:18px;height:18px;border-radius:5px;flex:none}
.swatch code{font-family:var(--font-mono);font-size:11px;color:#78736E}

/* ==========================================================================
   应用外壳
   ========================================================================== */
.app{
  position:relative;width:393px;height:852px;max-height:calc(100dvh - 48px);min-height:620px;
  display:flex;flex-direction:column;overflow:hidden;border-radius:40px;
  background:var(--canvas);color:var(--ink);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.6),0 0 0 8px #1A1D1F,0 0 0 9px #2C3134;
  isolation:isolate;
}
/* 极淡冷调呼吸，不做装饰 */
.app::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(110% 46% at 50% -8%,color-mix(in srgb,var(--accent) 6%,transparent),transparent 62%);
}
body[data-theme="matte"] .app::before{display:none}
.app>*{position:relative;z-index:1}

.statusbar{
  height:30px;min-height:30px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 26px 4px;font-size:12px;font-weight:600;color:var(--ink);opacity:.75;
}
.statusbar .glyph{font-size:11px;letter-spacing:.1em;opacity:.6}

/* ---------- 顶栏：无底色、无分隔线、大标题 ---------- */
.topbar{
  min-height:64px;display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-3) var(--space-5) var(--space-3);
}
.top-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.top-title{font-size:var(--fs-title);line-height:var(--lh-title);font-weight:600;letter-spacing:var(--track-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title.serif{font-family:var(--font-serif);font-weight:700;letter-spacing:0}
.top-sub{font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  width:var(--touch);height:var(--touch);min-width:var(--touch);display:grid;place-items:center;
  border-radius:var(--radius-control);color:var(--ink);
}
.icon-btn.quiet{color:var(--ink3)}
.icon-btn:active{background:var(--sunken)}
.runbar{height:2px;background:var(--rule);overflow:hidden}
.runbar::after{
  content:"";display:block;height:100%;width:34%;background:var(--accent);
  animation:slide 1.9s var(--ease) infinite;
}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}

/* ---------- 内容区 ---------- */
.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 var(--space-5) var(--space-6);scrollbar-width:none}
.screen::-webkit-scrollbar{width:0;height:0}
.screen.with-dock{padding-bottom:0}

.page-title{font-size:var(--fs-display);line-height:var(--lh-display);font-weight:700;letter-spacing:var(--track-display);margin:var(--space-4) 0 var(--space-2)}
.page-sub{font-size:var(--fs-bodyQuiet);line-height:var(--lh-bodyQuiet);color:var(--ink2);margin:0 0 var(--space-5)}
.group{
  font-size:var(--fs-caption);line-height:var(--lh-caption);font-weight:600;letter-spacing:.1em;
  color:var(--ink3);margin:var(--space-7) 0 var(--space-2);
}
.group:first-child{margin-top:var(--space-2)}

/* ---------- 搜索与分段控件 ---------- */
.search{
  display:flex;align-items:center;gap:var(--space-2);height:44px;padding:0 var(--space-3);
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius-control);color:var(--ink3);
  margin-bottom:var(--space-3);
}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);font-size:var(--fs-body)}
.search input::placeholder{color:var(--ink3)}
.segs{display:flex;gap:var(--space-1);margin-bottom:var(--space-2);overflow-x:auto;scrollbar-width:none}
.segs::-webkit-scrollbar{height:0}
.segs button{
  min-height:34px;padding:0 var(--space-3);border-radius:var(--radius-control);font-size:var(--fs-bodyQuiet);
  color:var(--ink3);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
}
.segs button[aria-selected="true"]{background:var(--sunken);color:var(--ink);font-weight:600}
.segs button .count{font-size:11px;color:var(--ink3)}

/* ---------- 列表：无分隔线，靠留白与标题分组 ---------- */
.list{display:flex;flex-direction:column}
.item{
  display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
  min-height:60px;padding:var(--space-3) var(--space-2);margin:0 calc(-1 * var(--space-2));
  border-radius:var(--radius-control);color:var(--ink);
}
.item:active{background:var(--sunken)}
.item-icon{color:var(--ink2);flex:none;display:grid;place-items:center;width:var(--icon-lg);height:var(--icon-lg)}
.item-main{flex:1;min-width:0}
.item-title{display:block;font-size:var(--fs-bodyStrong);line-height:1.4;font-weight:600;letter-spacing:-.01em}
.item-desc{display:block;font-size:var(--fs-bodyQuiet);line-height:1.5;color:var(--ink2);margin-top:2px}
.item-meta{display:block;font-size:var(--fs-caption);line-height:1.45;color:var(--ink3);margin-top:3px}
.item-trail{flex:none;display:flex;align-items:center;gap:6px;color:var(--ink3);font-size:var(--fs-caption)}
.item.selected{background:var(--accentSoft)}
.item.selected .item-title{color:var(--ink)}
.item.danger .item-title{color:var(--danger)}

/* ---------- 开关 ---------- */
.switch{
  width:44px;height:26px;flex:none;border-radius:var(--radius-pill);position:relative;
  background:var(--ruleStrong);transition:background var(--dur-select) var(--ease);
}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform var(--dur-select) var(--ease)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--onAccent)}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 var(--space-4);
  border-radius:var(--radius-control);font-size:var(--fs-bodyStrong);font-weight:600;white-space:nowrap;
  transition:background var(--dur-press) var(--ease),transform var(--dur-press) var(--ease);
}
.btn:active{transform:scale(var(--pressed-scale))}
.btn-primary{background:var(--accent);color:var(--onAccent)}
.btn-primary:active{background:var(--accentPressed)}
.btn-secondary{border:1px solid var(--ruleStrong);color:var(--ink)}
.btn-secondary:active{background:var(--sunken)}
.btn-quiet{color:var(--accent);padding:0 var(--space-2);min-height:36px}
.btn-danger{color:var(--danger)}
.btn-row{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center;margin-top:var(--space-4)}

/* ---------- 状态徽标 ---------- */
.chip{
  display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:var(--radius-sm);
  background:var(--sunken);color:var(--ink2);font-size:var(--fs-caption);font-weight:500;white-space:nowrap;
}
.chip.accent{background:var(--accentSoft);color:var(--accent)}
.chip.ok{color:var(--success)} .chip.warn{color:var(--warning)} .chip.bad{color:var(--danger)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink3)}
.dot.ok{background:var(--success)} .dot.warn{background:var(--warning)} .dot.bad{background:var(--danger)}
.dot.run{background:var(--accent);animation:pulse 1.7s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

/* ---------- 面板（唯一使用阴影的容器） ---------- */
.panel{
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius-card);
  box-shadow:var(--shadow-card);padding:var(--space-4);
}
.panel.flat{background:var(--sunken);border-color:transparent;box-shadow:none}
.panel h3{margin:0 0 4px;font-size:var(--fs-bodyStrong);line-height:1.4;font-weight:600}
.panel p{margin:0;font-size:var(--fs-bodyQuiet);line-height:var(--lh-bodyQuiet);color:var(--ink2)}

/* ==========================================================================
   会话
   ========================================================================== */
.thread{display:flex;flex-direction:column;gap:var(--space-5);padding:var(--space-2) 0 var(--space-4)}
.day{display:flex;align-items:center;gap:var(--space-3);color:var(--ink3);font-size:var(--fs-caption)}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--rule)}
.msg{display:flex;flex-direction:column;gap:6px}
.msg.user{align-items:flex-end}
.bubble{
  max-width:78%;padding:10px 14px;border-radius:var(--radius-control);
  background:var(--sunken);color:var(--ink);font-size:var(--fs-body);line-height:var(--lh-body);
}
.reply{width:100%;font-size:var(--fs-body);line-height:var(--lh-body);color:var(--ink)}
.reply p{margin:0 0 var(--space-3)}
.reply p:last-child{margin-bottom:0}
.reply ul,.reply ol{margin:0 0 var(--space-3);padding-left:18px}
.reply li{margin-bottom:8px}
.reply li::marker{color:var(--ink3)}
.reply blockquote{
  margin:0 0 var(--space-3);padding:0 0 0 var(--space-3);
  border-left:2px solid var(--ruleStrong);color:var(--ink2);
}
.reply .code{
  margin:0 0 var(--space-3);border:1px solid var(--rule);border-radius:var(--radius-control);overflow:hidden;background:var(--surface);
}
.reply .code-head{
  display:flex;align-items:center;gap:6px;padding:8px var(--space-3);
  border-bottom:1px solid var(--rule);font-family:var(--font-mono);font-size:11px;color:var(--ink3);
}
.reply .code-body{padding:var(--space-3);font-family:var(--font-mono);font-size:var(--fs-mono);line-height:var(--lh-mono);overflow-x:auto}
.reply table{width:100%;border-collapse:collapse;margin:0 0 var(--space-3);font-size:var(--fs-bodyQuiet)}
.reply th,.reply td{text-align:left;padding:8px;border-bottom:1px solid var(--rule)}
.reply th{font-weight:600;color:var(--ink2)}
.msg-meta{font-size:var(--fs-caption);color:var(--ink3)}
.msg-actions{display:flex;align-items:center;gap:var(--space-1);margin-top:2px}
.act{
  display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:0 6px;border-radius:var(--radius-sm);
  color:var(--ink3);font-size:var(--fs-caption);
}
.act:active{color:var(--accent);background:var(--sunken)}
.act.icon{min-width:32px;justify-content:center}

/* ---------- 工作时间线 ---------- */
.goal{padding:var(--space-4) 0 var(--space-2);border-bottom:1px solid var(--rule)}
.goal-title{font-size:var(--fs-heading);line-height:var(--lh-heading);font-weight:600;letter-spacing:var(--track-heading)}
.goal-sub{font-size:var(--fs-caption);color:var(--ink3);margin-top:4px}
.timeline{display:flex;flex-direction:column;margin-top:var(--space-4)}
.step{display:grid;grid-template-columns:18px minmax(0,1fr);gap:var(--space-3)}
.step-rail{position:relative;display:flex;justify-content:center}
.step-rail::before{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--rule)}
.step:last-child .step-rail::before{height:12px;bottom:auto}
.step-dot{position:relative;z-index:1;margin-top:13px;width:9px;height:9px;border-radius:50%;background:var(--ruleStrong);outline:3px solid var(--canvas)}
.step[data-state="running"] .step-dot{background:var(--accent);outline-color:var(--accentSoft)}
.step[data-state="done"] .step-dot{background:var(--success)}
.step[data-state="failed"] .step-dot{background:var(--danger)}
.step[data-state="waiting"] .step-dot{background:var(--warning)}
.step-body{padding-bottom:var(--space-4)}
.step-card{border-left:2px solid transparent;padding-left:var(--space-3)}
.step[data-state="running"] .step-card{border-left-color:var(--accent)}
.step[data-state="failed"] .step-card{border-left-color:var(--danger)}
.step-title{font-size:var(--fs-bodyStrong);line-height:1.45;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step[data-state="done"] .step-title{font-weight:400;color:var(--ink2)}
.step[data-state="failed"] .step-title{color:var(--danger)}
.step-sub{font-size:var(--fs-bodyQuiet);line-height:1.6;color:var(--ink2);margin-top:3px}
.step[data-state="done"] .step-sub{color:var(--ink3)}
.step-actions{display:flex;gap:var(--space-2);margin-top:var(--space-2);flex-wrap:wrap}

/* ---------- 产物 ---------- */
.artifact{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--rule)}
.artifact:last-child{border-bottom:0}
.file-icon-img{width:28px;height:28px;flex:none;object-fit:contain}
.artifact .file-icon-img{width:30px;height:30px}
.artifact-main{flex:1;min-width:0}
.artifact-name{font-size:var(--fs-bodyStrong);line-height:1.4;font-weight:600;word-break:break-all}
.artifact-meta{font-size:var(--fs-caption);color:var(--ink3);margin-top:2px}

/* ==========================================================================
   输入区：无缝底栏
   ========================================================================== */
.dock{
  border-top:1px solid var(--rule);background:var(--canvas);
  padding:var(--space-3) var(--space-5) var(--space-4);
  display:flex;flex-direction:column;gap:var(--space-2);
}
.dock textarea{
  width:100%;border:0;background:none;outline:none;resize:none;color:var(--ink);
  font-family:var(--font-cn);font-size:var(--fs-body);line-height:var(--lh-body);letter-spacing:var(--track-body);
  padding:0;min-height:44px;max-height:132px;
}
.dock textarea::placeholder{color:var(--ink3)}
.dock-bar{display:flex;align-items:center;gap:var(--space-1)}
.dock-bar .spacer{flex:1}
.dock-btn{
  width:36px;height:36px;min-width:36px;border-radius:var(--radius-control);display:grid;place-items:center;color:var(--ink2);
}
.dock-btn:active{background:var(--sunken);color:var(--accent)}
.dock-chip{
  display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 8px;border-radius:var(--radius-control);
  color:var(--ink3);font-size:var(--fs-caption);
}
.dock-chip:active{background:var(--sunken);color:var(--accent)}
.send{
  width:36px;height:36px;min-width:36px;border-radius:var(--radius-control);background:var(--accent);color:var(--onAccent);
  display:grid;place-items:center;
}
.send:active{transform:scale(var(--pressed-scale))}
.send.stop{background:var(--sunken);color:var(--ink2)}
.dock-hint{display:flex;align-items:center;gap:6px;font-size:var(--fs-caption);color:var(--ink3);padding-left:2px}

/* ==========================================================================
   人物 / 日记 / 工作区
   ========================================================================== */
.people{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.person{
  border:1px solid var(--rule);border-radius:var(--radius-card);overflow:hidden;background:var(--surface);
  text-align:left;position:relative;
}
.person[aria-pressed="true"]{border-color:var(--accent)}
.person-pic{aspect-ratio:1/1;background:var(--sunken)}
.person-pic img{width:100%;height:100%;object-fit:cover}
.person-meta{padding:var(--space-3)}
.person-name{display:block;font-family:var(--font-serif);font-size:17px;font-weight:700;line-height:1.3}
.person-sub{display:block;font-size:var(--fs-caption);color:var(--ink3);margin-top:3px}
.person-dot{position:absolute;top:12px;right:12px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}

.diary{padding:var(--space-6) 0}
.diary-date{font-size:var(--fs-caption);letter-spacing:.12em;color:var(--ink3)}
.diary h2{font-family:var(--font-serif);font-size:23px;line-height:1.4;margin:10px 0 var(--space-4);font-weight:700}
.diary p{font-size:var(--fs-body);line-height:1.9;color:var(--ink2);margin:0 0 var(--space-4)}
.diary p:first-of-type{color:var(--ink)}

.crumb{display:flex;align-items:center;gap:6px;font-size:var(--fs-caption);color:var(--ink3);padding:var(--space-3) 0 0}
.tree{display:flex;flex-direction:column}
.tree-row{display:flex;align-items:center;gap:var(--space-3);min-height:52px;width:100%;text-align:left;color:var(--ink);border-radius:var(--radius-control);padding:0 var(--space-2)}
.tree-row:active{background:var(--sunken)}
.tree-name{flex:1;min-width:0;font-size:var(--fs-bodyQuiet);line-height:1.5;overflow-wrap:anywhere}
.tree-meta{font-family:var(--font-mono);font-size:11px;color:var(--ink3);flex:none}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-2);padding:var(--space-7) var(--space-4)}
.empty .mark{width:56px;height:56px;border-radius:var(--radius-control);display:grid;place-items:center;background:var(--sunken);color:var(--ink3)}
.empty h3{margin:0;font-size:var(--fs-title);line-height:var(--lh-title);font-weight:600}
.empty p{margin:0;max-width:30ch;font-size:var(--fs-bodyQuiet);line-height:var(--lh-bodyQuiet);color:var(--ink2)}

/* ==========================================================================
   浮层
   ========================================================================== */
.scrim{
  position:absolute;inset:0;z-index:40;background:rgba(10,12,14,.28);backdrop-filter:blur(2px);
  opacity:0;visibility:hidden;transition:opacity var(--dur-fade) var(--ease),visibility var(--dur-fade) var(--ease);
}
.scrim.show{opacity:1;visibility:visible}
.drawer{
  position:absolute;top:0;bottom:0;left:0;width:296px;max-width:86%;z-index:50;
  background:var(--surface);border-right:1px solid var(--rule);
  transform:translateX(-102%);transition:transform var(--dur-sidebar) var(--ease);
  display:flex;flex-direction:column;box-shadow:var(--shadow-overlay);
}
.drawer.show{transform:none}
.brand{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-5) var(--space-4) var(--space-4)}
.mark{
  width:32px;height:32px;border-radius:9px;border:1.5px solid var(--accent);color:var(--accent);
  display:grid;place-items:center;font-family:var(--font-serif);font-size:15px;font-weight:700;
}
.brand-text{display:flex;flex-direction:column;line-height:1.3}
.brand-name{font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand-ver{font-size:11px;color:var(--ink3)}
.drawer-search{display:flex;align-items:center;gap:var(--space-2);height:38px;margin:0 var(--space-4) var(--space-3);
  padding:0 var(--space-3);background:var(--sunken);border-radius:var(--radius-control);color:var(--ink3)}
.drawer-search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);font-size:var(--fs-bodyQuiet)}
.drawer-scroll{flex:1;min-height:0;overflow-y:auto;padding:0 var(--space-2) var(--space-6);scrollbar-width:none}
.drawer-scroll::-webkit-scrollbar{width:0}
.drawer-group{font-size:11px;letter-spacing:.1em;color:var(--ink3);font-weight:600;padding:var(--space-5) var(--space-3) var(--space-2)}
.drawer-item{
  display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;min-height:44px;
  padding:6px var(--space-3);border-radius:var(--radius-control);color:var(--ink);font-size:var(--fs-bodyQuiet);
}
.drawer-item:active{background:var(--sunken)}
.drawer-item.active{background:var(--accentSoft);font-weight:600}
.drawer-item .ico{color:var(--ink2)}

.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;box-shadow:var(--shadow-overlay);
  border-top:1px solid var(--rule);
  padding:var(--space-5);
  transform:translateY(101%);transition:transform var(--dur-sheet) var(--ease);
}
.sheet.show{transform:none}
.sheet h3{margin:0 0 4px;font-size:var(--fs-title);line-height:var(--lh-title);font-weight:600}
.sheet .hint{margin:0 0 var(--space-4);font-size:var(--fs-bodyQuiet);color:var(--ink2)}
.sheet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2)}
.sheet-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:var(--space-3) 0;border-radius:var(--radius-control);color:var(--ink)}
.sheet-tile:active{background:var(--sunken)}
.sheet-tile span{font-size:12px;color:var(--ink2)}

.menu-layer{position:absolute;inset:0;z-index:60;display:none}
.menu-layer.show{display:block}
.menu{
  position:absolute;min-width:176px;background:var(--surface);border-radius:var(--radius-overlay);
  box-shadow:var(--shadow-menu);border:1px solid var(--rule);padding:var(--space-2);
}
.menu button{display:flex;align-items:center;gap:var(--space-2);width:100%;min-height:42px;padding:0 var(--space-2);
  border-radius:var(--radius-sm);font-size:var(--fs-bodyQuiet);color:var(--ink);text-align:left}
.menu button:active{background:var(--sunken)}
.menu .sep{height:1px;background:var(--rule);margin:var(--space-2) 0}

.dialog-layer{position:absolute;inset:0;z-index:70;display:none;place-items:center;padding:var(--space-5);
  background:rgba(10,12,14,.28);backdrop-filter:blur(2px)}
.dialog-layer.show{display:grid}
.dialog{
  width:100%;background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-overlay);
  border:1px solid var(--rule);padding:var(--space-5);
}
.dialog h3{margin:0 0 6px;font-size:var(--fs-title);line-height:var(--lh-title);font-weight:600}
.dialog p{margin:0 0 var(--space-5);font-size:var(--fs-bodyQuiet);line-height:var(--lh-bodyQuiet);color:var(--ink2)}
.dialog-actions{display:flex;gap:var(--space-2);justify-content:flex-end}

.toast{
  position:absolute;left:var(--space-5);right:var(--space-5);bottom:110px;z-index:80;
  background:var(--ink);color:var(--canvas);padding:12px var(--space-4);border-radius:var(--radius-control);
  font-size:var(--fs-bodyQuiet);text-align:center;opacity:0;transform:translateY(6px);pointer-events:none;

.toast.show{opacity:1;transform:none}

.home-indicator{height:20px;min-height:20px;display:grid;place-items:center}
.home-indicator span{width:118px;height:4px;border-radius:2px;background:var(--ink3);opacity:.45}

/* 选型工具条（仅评审用） */

.gallery-bar .tag{font-size:11px;color:#8D837A;padding:0 6px}

</script><script>document.addEventListener('DOMContentLoaded',function(){
/* 神言 V9 · 界面逻辑

const Q = new URLSearchParams(location.search);
const THEMES = [['light', '清露'], ['dark', '夜青'], ['matte', '纯黑']];
const ROUTES = ['HOME', 'PERSONA_GALLERY', 'DIARY', 'WORKSPACE', 'TASKS', 'TOOLS', 'SETTINGS'];

};

const state = {
  route: ROUTES.indexOf(Q.get('route')) >= 0 ? Q.get('route') : 'HOME',
  mode: Q.get('mode') === 'WORK' ? 'WORK' : 'CHAT',
  theme: THEMES.some(t => t[0] === Q.get('theme')) ? Q.get('theme') : 'light',
  drawer: Q.get('drawer') === '1',
  sheet: '',
  dialog: '',
  running: true,
  toolTab: 'all',
  selectedPerson: 0,
  tasks: { morning: true, weekly: true, backup: false },
  draft: '',
  sent: [],
};

const PEOPLE = [
  { key: 'lan', name: '岚', sub: '日常故事 · 温柔陪伴', portrait: 'persona-1.svg' },
  { key: 'xiaoqing', name: '小晴', sub: '新的故事正在开始', portrait: 'persona-2.svg' },
  { key: 'yishu', name: '亦书', sub: '专注故事线与记忆', portrait: 'persona-3.svg' },
  { key: 'xingyao', name: '星遥', sub: '人物档案 · 可编辑', portrait: 'persona-4.svg' },
];

const ASSETS = window.V9_ASSETS || {};

function assetUrl(rel) { return ASSETS[rel] || ''; }
function mask(rel, extra) {
  const url = assetUrl(rel);
  if (!url) return '';
  return '<span class="ico ' + (extra || '') + '" style="--m:url(\'' + url + '\')" aria-hidden="true"></span>';
}
function ico(name, extra) { return mask('icons-actions/' + name + '.svg', extra); }
function brandIco(name, extra) { return mask('icons/' + name + '.svg', extra); }
function miscIco(name, extra) { return mask('icons-misc/' + name + '.svg', extra); }
function fileIcon(name, extra) {
  const url = assetUrl('file-icons/' + name + '_' + (state.theme === 'light' ? 'light' : 'dark') + '.svg');
  if (!url) return '';
  return '<img class="file-icon-img ' + (extra || '') + '" src="' + url + '" alt="">';
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function $(id) { return document.getElementById(id); }

/* ------------------------------------------------------------------ 顶栏 --- */
function topbarHTML() {
  if (state.route === 'HOME') {
    const work = state.mode === 'WORK';
    const sub = work
      ? (state.running ? '正在执行 · 第 2 步 / 共 4 步' : '已完成 · 4 步')
      : (state.running ? '执行中' : '就绪');
    return '<header class="topbar">' +
      '<button class="icon-btn" data-action="drawer" aria-label="打开侧栏">' + ico('Menu') + '</button>' +
      '<div class="top-copy"><div class="top-title">Harness</div><div class="top-sub">' + sub + '</div></div>' +
      (state.running ? '<button class="icon-btn quiet" data-action="toast:已加入待处理回合" aria-label="待处理回合">' + ico('Clock') + '</button>' : '') +

      (state.running ? '<div class="runbar"></div>' : '');

    DIARY: ['人物日记', '记录属于她的生活'],
    WORKSPACE: ['工作区', '文件、产物与素材'],

    SETTINGS: ['设置', '体验和账户的掌控权'],

  const serif = state.route === 'PERSONA_GALLERY' || state.route === 'DIARY';

    '<button class="icon-btn" data-action="drawer" aria-label="打开侧栏">' + ico('Menu') + '</button>' +
    '<div class="top-copy"><div class="top-title' + (serif ? ' serif' : '') + '">' + esc(title) + '</div>' +
    '<div class="top-sub">' + esc(sub) + '</div></div></header>';
}

/* --------------------------------------------------------------- HOME 聊天 --- */
function chatHTML() {
  const sent = state.sent.map(text =>
    '<div class="msg user"><div class="bubble">' + esc(text) + '</div></div>').join('');

    '<div class="day">今天</div>' + sent +
    '<div class="msg"><div class="reply">' +
    '<p>我把上一轮的内容重新梳理了一遍，按你要的三块拆开：</p>' +

    '<div class="code"><div class="code-head">' + ico('Code', 'sm') + 'summarize.py</div>' +
    '<div class="code-body">for note in notes:\n    summary = model.summarize(note, tone="calm")\n    report.add(summary)</div></div>' +
    '</div>' +
    '<div class="msg-meta">刚刚 · Harness</div>' +

    '<button class="act" data-action="toast:已复制这条回复">' + ico('Copy', 'sm') + '复制</button>' +
    '<button class="act" data-action="toast:已重新生成">' + ico('RefreshCw', 'sm') + '重试</button>' +
    '<button class="act" data-action="toast:已创建分支会话">' + ico('GitBranch', 'sm') + '分支</button>' +
    '<button class="act icon" data-action="menu:reply" aria-label="更多操作">' + ico('MoreVertical', 'sm') + '</button>' +
    '</div></div></div>';
}

    '</div></div>';

/* ------------------------------------------------------------------- 渲染 --- */
function screenHTML() {
  if (state.route === 'HOME') return state.mode === 'WORK' ? workHTML() : chatHTML();
  if (state.route === 'TOOLS') return toolsHTML();
  if (state.route === 'TASKS') return tasksHTML();
  if (state.route === 'WORKSPACE') return workspaceHTML();
  if (state.route === 'PERSONA_GALLERY') return personaHTML();
  if (state.route === 'DIARY') return diaryHTML();
  return settingsHTML();
}

function render() {
  document.body.dataset.theme = state.theme;
  $('topbar').outerHTML = topbarHTML();
  $('screen').innerHTML = screenHTML();
  $('screen').className = 'screen' + (state.route === 'HOME' ? ' with-dock' : '');
  $('dock').innerHTML = dockHTML();
  $('drawer').innerHTML = drawerHTML();
  $('drawer').classList.toggle('show', state.drawer);
  $('scrim-drawer').classList.toggle('show', state.drawer);
  $('sheet').innerHTML = sheetHTML();
  $('sheet').classList.toggle('show', !!state.sheet);
  $('scrim-sheet').classList.toggle('show', !!state.sheet);
  $('menu-layer').innerHTML = state.dialog === 'menu' ? menuHTML() : '';
  $('menu-layer').classList.toggle('show', state.dialog === 'menu');
  $('dialog-layer').innerHTML = state.dialog === 'stop' ? dialogHTML() : '';
  $('dialog-layer').classList.toggle('show', state.dialog === 'stop');
  renderStageNav();
}

function renderStageNav() {
  const nav = $('stage-nav');
  if (nav) nav.innerHTML = ROUTES.map(r =>
    '<button data-action="route:' + r + '" aria-current="' + (state.route === r) + '">' + ROUTE_LABEL[r] + '</button>').join('');
}

/* ------------------------------------------------------------------- 交互 --- */
function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

function go(route, mode) {
  if (route) state.route = route;
  if (mode) state.mode = mode;
  state.drawer = false;
  state.dialog = '';
  render();
  $('screen').scrollTop = 0;
}

document.addEventListener('click', ev => {
  const btn = ev.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  if (action.startsWith('route:')) {
    const [route, mode] = action.slice(6).split(':');
    go(route, mode === 'WORK' ? 'WORK' : undefined);
  } else if (action === 'drawer') { state.drawer = true; render(); }
  else if (action === 'close-drawer') { state.drawer = false; render(); }
  else if (action.startsWith('sheet:')) { state.sheet = action.slice(6); render(); }
  else if (action === 'close-sheet') { state.sheet = ''; render(); }
  else if (action.startsWith('menu:')) { state.dialog = 'menu'; render(); }
  else if (action === 'dialog:close') { state.dialog = ''; render(); }
  else if (action.startsWith('dialog:')) { state.dialog = action.slice(7); render(); }
  else if (action.startsWith('toast:')) { toast(action.slice(6)); }
  else if (action === 'send') {
    const input = $('composer');
    const text = (input.value || '').trim();
    if (!text) { toast('先写点什么'); return; }
    state.sent.push(text);
    state.draft = '';
    render();
    toast('已发送');
  } else if (action === 'stop') { state.running = false; render(); toast('已停止'); }
  else if (action.startsWith('tool-tab:')) { state.toolTab = action.slice(9); render(); }
  else if (action.startsWith('task:')) {
    const key = action.slice(5);
    state.tasks[key] = !state.tasks[key];
    render();
    toast(state.tasks[key] ? '已启用' : '已暂停');
  } else if (action.startsWith('persona:')) {
    state.selectedPerson = Number(action.slice(7));
    render();
    toast('已切换到 ' + PEOPLE[state.selectedPerson].name);
  }
});

document.addEventListener('input', ev => {
  if (ev.target.id === 'composer') state.draft = ev.target.value;
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { state.sheet = ''; state.dialog = ''; state.drawer = false; render(); }
});

render();

// 供设计稿画廊切换变体 / 主题 / 路由使用（仅评审工具，不进入产品）
window.V9_APP = { state: state, render: render };

});</script>
