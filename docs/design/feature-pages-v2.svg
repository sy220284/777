<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0F1514}
      .title{font-size:30px;font-weight:700}.h2{font-size:18px;font-weight:650}.body{font-size:13px}.small{font-size:11px;fill:#616B67}.cap{font-size:10px;fill:#818B87}
      .line{fill:none;stroke:#616B67;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#3E8E8C;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1800" height="1280" fill="#F0F3F1"/>
  <text x="52" y="58" class="title">777 功能子页面设计稿 V2</text>
  <text x="52" y="86" class="small">完整页面统一：返回 + 标题 + 可选主动作；内容采用白色浮层、低边框、少量青瓷强调。以下为信息架构与视觉密度基准。</text>

  <!-- helper reusable-ish panels drawn manually -->
  <!-- Persona -->
  <g transform="translate(52 120)">
    <rect width="520" height="520" rx="24" fill="#F7F8F6" stroke="#CFD6D2"/>
    <text x="24" y="42" class="h2">← 人物图集</text><text x="466" y="42" class="h2">＋</text>
    <rect x="22" y="62" width="476" height="42" rx="14" fill="#FFFFFF"/><text x="42" y="88" class="small">搜索人物</text>
    <text x="24" y="138" class="small" font-weight="650">当前人物</text>
    <rect x="22" y="152" width="476" height="94" rx="18" fill="#FFFFFF"/>
    <circle cx="64" cy="198" r="28" fill="#DCEEEC"/><text x="56" y="204" class="body" font-weight="700">绫华</text>
    <text x="106" y="188" class="body" font-weight="650">神里绫华</text><text x="106" y="210" class="small">白鹭公主 · 3 条故事线</text>
    <rect x="390" y="181" width="82" height="32" rx="16" fill="#0F1514"/><text x="408" y="202" class="small" fill="#FFFFFF">开始聊天</text>
    <text x="24" y="282" class="small" font-weight="650">其他人物</text>
    <rect x="22" y="296" width="476" height="66" rx="16" fill="#FFFFFF"/><circle cx="54" cy="329" r="20" fill="#F2F4F2"/><text x="46" y="334" class="small">刻晴</text><text x="88" y="324" class="body">刻晴</text><text x="88" y="344" class="cap">璃月 · 2 条故事线</text>
    <rect x="22" y="372" width="476" height="66" rx="16" fill="#FFFFFF"/><circle cx="54" cy="405" r="20" fill="#F2F4F2"/><text x="46" y="410" class="small">甘雨</text><text x="88" y="400" class="body">甘雨</text><text x="88" y="420" class="cap">月海亭 · 1 条故事线</text>
    <text x="24" y="480" class="small">点击人物 → 人物详情 → 故事详情；管理与快速切换分离。</text>
  </g>

  <!-- Diary -->
  <g transform="translate(612 120)">
    <rect width="520" height="520" rx="24" fill="#F7F8F6" stroke="#CFD6D2"/>
    <text x="24" y="42" class="h2">← 角色日记</text>
    <rect x="350" y="22" width="146" height="34" rx="17" fill="#FFFFFF"/><text x="372" y="44" class="small">神里绫华 ▾</text>
    <rect x="22" y="72" width="476" height="40" rx="13" fill="#FFFFFF"/><text x="42" y="97" class="small">搜索日记</text>
    <g transform="translate(22 126)"><rect width="52" height="28" rx="14" fill="#DCEEEC"/><text x="16" y="19" class="cap">全部</text><rect x="60" width="52" height="28" rx="14" fill="#FFFFFF"/><text x="76" y="19" class="cap">单聊</text><rect x="120" width="52" height="28" rx="14" fill="#FFFFFF"/><text x="136" y="19" class="cap">群聊</text><rect x="180" width="62" height="28" rx="14" fill="#FFFFFF"/><text x="196" y="19" class="cap">私密</text></g>
    <text x="24" y="184" class="small" font-weight="650">10 月 3 日</text>
    <rect x="22" y="198" width="476" height="118" rx="18" fill="#FFFFFF"/>
    <text x="42" y="226" class="body" font-weight="650">夏日祭之后的夜晚</text>
    <text x="42" y="251" class="small">她仍然在意白天没有说出口的那句话。</text>
    <text x="42" y="273" class="small">那种迟疑不像后悔，更像在等下一次机会。</text>
    <text x="42" y="298" class="cap">私密 · 单聊 · ★★★★</text>
    <rect x="22" y="328" width="476" height="92" rx="18" fill="#FFFFFF"/>
    <text x="42" y="356" class="body" font-weight="650">雨天回家的路</text><text x="42" y="381" class="small">她记住了伞下很短的一段安静。</text><text x="42" y="404" class="cap">单聊 · ★★★</text>
    <text x="24" y="470" class="small">列表只给摘要；点击进入完整日记详情，保留事件 / 感受 / 内心 / 关系意义 / 余韵。</text>
  </g>

  <!-- Run center -->
  <g transform="translate(1172 120)">
    <rect width="576" height="520" rx="24" fill="#F7F8F6" stroke="#CFD6D2"/>
    <text x="24" y="42" class="h2">← 运行中心</text>
    <rect x="22" y="66" width="532" height="98" rx="18" fill="#FFFFFF"/>
    <text x="42" y="96" class="body" font-weight="650">重构侧边栏与导航</text><text x="42" y="120" class="small">第 4 / 7 步 · 正在更新展示组件</text>
    <rect x="42" y="136" width="404" height="8" rx="4" fill="#EAEFEC"/><rect x="42" y="136" width="232" height="8" rx="4" fill="#3E8E8C"/>
    <text x="24" y="198" class="small" font-weight="650">执行过程</text>
    <g transform="translate(28 216)"><circle cx="10" cy="10" r="9" fill="#DCEEEC"/><text x="7" y="14" class="cap">✓</text><text x="34" y="15" class="body">分析项目结构</text></g>
    <g transform="translate(28 254)"><circle cx="10" cy="10" r="9" fill="#DCEEEC"/><text x="7" y="14" class="cap">✓</text><text x="34" y="15" class="body">核对 UI 规范</text></g>
    <g transform="translate(28 292)"><circle cx="10" cy="10" r="9" fill="#DCEEEC"/><text x="7" y="14" class="cap">✓</text><text x="34" y="15" class="body">补全线性图标</text></g>
    <g transform="translate(28 330)"><circle cx="10" cy="10" r="9" fill="#3E8E8C"/><text x="7" y="14" class="cap" fill="#FFFFFF">●</text><text x="34" y="15" class="body" font-weight="650">更新侧边栏组件</text></g>
    <g transform="translate(28 368)"><circle cx="10" cy="10" r="9" fill="#EAEFEC"/><text x="7" y="14" class="cap">○</text><text x="34" y="15" class="body">运行回归测试</text></g>
    <rect x="356" y="210" width="178" height="154" rx="16" fill="#FFFFFF"/>
    <text x="376" y="238" class="small" font-weight="650">子代理</text><text x="376" y="267" class="small">UI 审查　✓</text><text x="376" y="293" class="small">架构审查　●</text><text x="376" y="319" class="small">测试　　　○</text>
    <text x="24" y="470" class="small">主界面顶部只保留“快速运行 Sheet”；侧边栏进入完整运行中心。</text>
  </g>

  <!-- Workspace -->
  <g transform="translate(52 688)">
    <rect width="520" height="520" rx="24" fill="#F7F8F6" stroke="#CFD6D2"/>
    <text x="24" y="42" class="h2">← 工作空间</text><text x="455" y="42" class="small">刷新</text>
    <g transform="translate(22 66)"><rect width="76" height="32" rx="16" fill="#DCEEEC"/><text x="25" y="21" class="small">文件</text><rect x="84" width="76" height="32" rx="16" fill="#FFFFFF"/><text x="109" y="21" class="small">涉及</text><rect x="168" width="76" height="32" rx="16" fill="#FFFFFF"/><text x="193" y="21" class="small">产物</text></g>
    <text x="24" y="136" class="small">/workspace/777</text>
    <g transform="translate(22 152)">
      <rect width="476" height="54" rx="14" fill="#FFFFFF"/><text x="22" y="33" class="body">▸ app/</text>
      <rect y="62" width="476" height="54" rx="14" fill="#FFFFFF"/><text x="22" y="95" class="body">▸ docs/</text>
      <rect y="124" width="476" height="54" rx="14" fill="#FFFFFF"/><text x="22" y="157" class="body">AGENTS.md</text><text x="390" y="157" class="cap">12 KB</text>
      <rect y="186" width="476" height="54" rx="14" fill="#FFFFFF"/><text x="22" y="219" class="body">README.md</text><text x="390" y="219" class="cap">8 KB</text>
    </g>
    <text x="24" y="438" class="small">文件 → 文件详情 / 预览；图片、Markdown、代码、APK 等使用对应 Artifact Preview。</text>
  </g>

  <!-- Tasks -->
  <g transform="translate(612 688)">
    <rect width="520" height="520" rx="24" fill="#F7F8F6" stroke="#CFD6D2"/>
    <text x="24" y="42" class="h2">← 任务中心</text><text x="466" y="42" class="h2">＋</text>
    <g transform="translate(22 66)"><rect width="94" height="32" rx="16" fill="#DCEEEC"/><text x="23" y="21" class="small">聊天互动</text><rect x="102" width="94" height="32" rx="16" fill="#FFFFFF"/><text x="127" y="21" class="small">工作任务</text></g>
    <rect x="22" y="118" width="476" height="128" rx="18" fill="#FFFFFF"/>
    <text x="42" y="150" class="body" font-weight="650">每天 20:00 · 主动聊天</text><text x="42" y="178" class="small">让绫华主动聊今天发生的事情</text><text x="42" y="205" class="cap">下次：今天 20:00 · 已启用</text>
    <rect x="360" y="196" width="108" height="30" rx="15" fill="#0F1514"/><text x="382" y="216" class="cap" fill="#FFFFFF">立即执行</text>
    <rect x="22" y="260" width="476" height="112" rx="18" fill="#FFFFFF"/>
    <text x="42" y="292" class="body" font-weight="650">每周一 · 项目健康检查</text><text x="42" y="318" class="small">扫描未合并 PR、失败 CI 和架构门禁</text><text x="42" y="345" class="cap">下次：周一 09:00 · 已启用</text>
    <text x="24" y="428" class="small">任务中心 → 任务详情 → 编辑任务。暂停、立即运行和历史执行都放在详情页。</text>
  </g>

  <!-- Tools/Remote -->
  <g transform="translate(1172 688)">
    <rect width="576" height="520" rx="24" fill="#F7F8F6" stroke="#CFD6D2"/>
    <text x="24" y="42" class="h2">← 工具中心</text>
    <g transform="translate(22 70)">
      <rect width="256" height="82" rx="16" fill="#FFFFFF"/><text x="20" y="30" class="body" font-weight="650">终端</text><text x="20" y="55" class="small">Runtime 可用 · Shell 已启用</text>
      <rect x="266" width="256" height="82" rx="16" fill="#FFFFFF"/><text x="286" y="30" class="body" font-weight="650">Android 设备</text><text x="286" y="55" class="small">权限 5 / 5 · 可控制</text>
      <rect y="94" width="256" height="82" rx="16" fill="#FFFFFF"/><text x="20" y="124" class="body" font-weight="650">Vision</text><text x="20" y="149" class="small">模型已配置</text>
      <rect x="266" y="94" width="256" height="82" rx="16" fill="#FFFFFF"/><text x="286" y="124" class="body" font-weight="650">GitHub</text><text x="286" y="149" class="small">已连接 · sy220284</text>
    </g>
    <text x="24" y="286" class="small" font-weight="650">工具详情示例：Android 设备</text>
    <rect x="22" y="302" width="532" height="126" rx="18" fill="#FFFFFF"/>
    <text x="42" y="334" class="body">无障碍服务</text><text x="468" y="334" class="small" fill="#35726F">已开启</text>
    <text x="42" y="364" class="body">通知权限</text><text x="468" y="364" class="small" fill="#35726F">已开启</text>
    <text x="42" y="394" class="body">虚拟屏</text><text x="468" y="394" class="small" fill="#35726F">可用</text>
    <text x="24" y="468" class="small">工具入口先到“能力详情”，再进入设置；远程控制同理：远程中心 → 设备详情 / 配对新设备。</text>
  </g>
</svg>