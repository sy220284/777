<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>神言 V7 · 视觉语言离线设计稿</title>
<style>
/* ==========================================================================
   神言 V7 · 离线设计稿样式
   依据：docs/design/v7/V7-VISUAL-LANGUAGE.zh-CN.md
   令牌：docs/design/v7/tokens.json（由 v7.js 注入为 CSS 变量，本文件不写死任何色值）
   角色变量：--canvas --surface --bar --overlay --solid --ink --ink2 --ink3
             --rule --ruleStrong --accent --accentPressed --onAccent --accentSoft
             --success --persona --warning --danger
   ========================================================================== */

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","PingFang SC","Microsoft Yahei",system-ui,sans-serif;
  background:var(--stage);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  transition:background var(--dur-fade) var(--ease);
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radiusSm)}
img{display:block;max-width:100%}
svg{overflow:visible}

/* ---------- 图标：统一 24 网格遮罩，颜色继承 currentColor ---------- */
.ico{
  display:inline-block;width:var(--iconMax);height:var(--iconMax);flex:none;
  background-color:currentColor;
  -webkit-mask-image:var(--m);mask-image:var(--m);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;
  -webkit-mask-size:contain;mask-size:contain;
}
.ico.sm{width:var(--iconMin);height:var(--iconMin)}
.ico.lg{width:32px;height:32px}

/* ==========================================================================
   展示页外框（设计评审板，非 App 界面）
   ========================================================================== */
.board{
  display:grid;grid-template-columns:minmax(240px,300px) auto minmax(300px,360px);
  gap:28px;align-items:start;justify-content:center;
  max-width:1560px;margin:0 auto;padding:28px 24px 44px;
}
.board-note{
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--radiusCard);
  padding:22px;color:var(--ink);
}
.board-note .eyebrow{font-size:11px;letter-spacing:.19em;color:var(--accent);font-weight:700}
.board-note h1{font-size:30px;line-height:1.25;font-weight:700;margin:12px 0 10px;letter-spacing:-.01em}
.board-note h1 em{font-style:normal;color:var(--accent)}
.board-note p{font-size:var(--type-bodyQuiet-size);line-height:var(--type-bodyQuiet-lh);color:var(--ink2);margin:0 0 14px}
.board-note .mock-note{border-left:2px solid var(--accent);padding:12px 14px;background:var(--canvas);border-radius:0 var(--radiusSm) var(--radiusSm) 0;font-size:13px;line-height:1.6;color:var(--ink2)}
.board-note .fine{font-size:12px;line-height:1.6;color:var(--ink3);margin:16px 0 0}
.board-nav{display:grid;gap:4px;margin-top:18px}
.board-nav button{
  min-height:var(--touch);text-align:left;padding:0 12px;border-radius:var(--radiusControl);
  color:var(--ink2);font-size:15px;line-height:1.5;display:flex;align-items:center;gap:10px;
}
.board-nav button[aria-current="true"]{background:var(--accentSoft);color:var(--ink);font-weight:600}
.board-nav button:active{background:var(--accentSoft)}

.board-panel{
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--radiusCard);
  padding:20px;color:var(--ink);max-height:calc(100dvh - 56px);overflow:auto;
}
.board-panel::-webkit-scrollbar{width:6px}
.board-panel::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.panel-eyebrow{font-size:11px;letter-spacing:.17em;color:var(--accent);font-weight:700}
.panel-head h3{margin:8px 0 0;font-size:var(--type-title-size);line-height:var(--type-title-lh);font-weight:var(--type-title-weight)}
.p-block{margin-top:20px;padding-top:16px;border-top:1px solid var(--rule)}
.p-title{font-size:13px;line-height:1.45;color:var(--ink3);margin-bottom:10px;letter-spacing:.02em}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.pill{
  min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--ruleStrong);
  color:var(--ink2);font-size:13px;line-height:1.45;
}
.pill[aria-pressed="true"]{background:var(--accentSoft);border-color:var(--accent);color:var(--ink);font-weight:600}
.swatch-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.swatch{display:flex;align-items:center;gap:8px;min-width:0}
.swatch-chip{width:22px;height:22px;border-radius:var(--radiusSm);border:1px solid var(--rule);flex:none}
.swatch-name{font-size:12px;color:var(--ink2);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.swatch-hex{font-size:11px;color:var(--ink3);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-left:auto}
.layer-row{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.layer-chip{width:34px;height:34px;border-radius:var(--radiusSm);border:1px solid var(--rule);flex:none}
.layer-name{font-size:13px;font-weight:600}
.layer-meta{font-size:11px;color:var(--ink3);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;line-height:1.5}
.type-row{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule)}
.type-row:last-child{border-bottom:0}
.type-tag{font-size:11px;color:var(--ink3);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;width:74px;flex:none}
.type-sample{flex:1;min-width:0;color:var(--ink)}
.type-meta{font-size:11px;color:var(--ink3);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;flex:none}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--rule);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink2)}
.kv span:last-child{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink)}
.gap-strip{display:flex;align-items:flex-end;gap:6px;margin-top:8px}
.gap-strip i{background:var(--accentSoft);border:1px solid var(--accent);border-radius:3px;display:block}
.accent-card{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule)}
.accent-card:last-child{border-bottom:0}
.accent-chip{width:30px;height:30px;border-radius:var(--radiusSm);flex:none;border:1px solid var(--rule)}
.accent-name{font-size:13px;font-weight:600}
.accent-meta{font-size:11px;color:var(--ink3);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ==========================================================================
   手机壳
   ========================================================================== */
.phone-wrap{display:flex;justify-content:center}
.phone{
  position:relative;width:393px;height:852px;max-height:calc(100dvh - 56px);min-height:560px;
  overflow:hidden;display:flex;flex-direction:column;
  border-radius:40px;background:var(--canvas);color:var(--ink);
  box-shadow:0 32px 80px rgba(0,0,0,.45),0 0 0 8px var(--stage-line);
  isolation:isolate;
}
.statusline{
  height:33px;min-height:33px;display:flex;justify-content:space-between;align-items:flex-end;
  padding:0 26px 3px;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--ink);
  background:var(--canvas);position:relative;z-index:2;
}
.status-glyph{font-size:11px;letter-spacing:.1em;opacity:.7}
.topbar{
  height:60px;min-height:60px;display:flex;align-items:center;gap:var(--gapSm);
  padding:0 var(--gapMd);background:var(--bar);border-bottom:1px solid var(--rule);
  position:relative;z-index:2;
}
.top-copy{flex:1;min-width:0}
.top-title{font-size:var(--type-bodyStrong-size);line-height:1.3;font-weight:var(--type-bodyStrong-weight);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-sub{font-size:var(--type-caption-size);line-height:1.45;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.icon-button{
  width:var(--touch);height:var(--touch);min-width:var(--touch);flex:none;display:flex;align-items:center;justify-content:center;
  color:var(--ink);border-radius:var(--radiusControl);
}
.icon-button:active{background:var(--accentSoft);transform:scale(var(--pressedScale))}
.page-scroll{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:var(--gapPage) var(--gapPage) var(--gapSection);
  scrollbar-width:none;
}
.page-scroll::-webkit-scrollbar,.drawer-scroll::-webkit-scrollbar,.board-panel::-webkit-scrollbar{width:0;height:0}
.home-indicator{height:22px;min-height:22px;display:flex;align-items:center;justify-content:center;background:var(--canvas);position:relative;z-index:2}
.home-indicator span{width:120px;height:4px;border-radius:2px;background:var(--ink3);opacity:.45}

/* ==========================================================================
   页面骨架
   ========================================================================== */
.page-head{margin-bottom:var(--gapSection)}
.page-head h2{margin:0 0 var(--gapSm);font-size:var(--type-title-size);line-height:var(--type-title-lh);font-weight:var(--type-title-weight)}
.page-head p{margin:0;font-size:var(--type-bodyQuiet-size);line-height:var(--type-bodyQuiet-lh);color:var(--ink2)}
.group-title{
  margin:var(--gapSection) 0 var(--gapSm);font-size:var(--type-heading-size);
  line-height:var(--type-heading-lh);font-weight:var(--type-heading-weight);color:var(--ink);
}
.group-title:first-child{margin-top:0}
.group-note{margin:0 0 var(--gapSm);font-size:var(--type-caption-size);line-height:var(--type-caption-lh);color:var(--ink3)}
.rule-list{border-top:1px solid var(--rule)}
.rule-list:last-of-type{border-bottom:1px solid var(--rule)}

/* ---------- 行式列表 ---------- */
.row{
  display:flex;align-items:center;gap:var(--gapMd);width:100%;text-align:left;
  min-height:56px;padding:var(--gapSm) 0;border-bottom:1px solid var(--rule);color:var(--ink);
}
.row:last-child{border-bottom:0}
.row:active{background:var(--accentSoft)}
.row-lead{color:var(--ink2);display:flex;align-items:center;justify-content:center;flex:none}
.row-main{flex:1;min-width:0}
.row-title{font-size:var(--type-bodyStrong-size);line-height:1.4;font-weight:var(--type-bodyStrong-weight)}
.row-desc{font-size:var(--type-bodyQuiet-size);line-height:1.5;color:var(--ink2);margin-top:2px}
.row-meta{font-size:var(--type-caption-size);line-height:var(--type-caption-lh);color:var(--ink3);margin-top:2px}
.row-trail{flex:none;display:flex;align-items:center;gap:6px;color:var(--ink3);font-size:var(--type-caption-size)}
.row-trail .ico{color:var(--ink3)}
.row-actions{display:flex;align-items:center;gap:var(--gapSm);flex:none}
.row-danger .row-title{color:var(--danger)}
.row-selected{background:var(--accentSoft)}

/* ---------- 按钮三级 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--gapSm);
  min-height:var(--touch);padding:0 var(--gapLg);border-radius:var(--radiusControl);
  font-size:var(--type-bodyStrong-size);line-height:1.4;font-weight:var(--type-bodyStrong-weight);
  transition:background var(--dur-press) var(--ease),border-color var(--dur-press) var(--ease),color var(--dur-press) var(--ease),transform var(--dur-press) var(--ease);
}
.btn-primary{background:var(--accent);color:var(--onAccent)}
.btn-primary:active{background:var(--accentPressed);transform:scale(var(--pressedScale))}
.btn-secondary{border:1px solid var(--ruleStrong);color:var(--ink);background:transparent}
.btn-secondary:active{background:var(--accentSoft);transform:scale(var(--pressedScale))}
.btn-quiet{color:var(--accent);padding:0 var(--gapSm)}
.btn-quiet:active{color:var(--accentPressed)}
.btn[disabled]{color:var(--ink3);background:none;border-color:transparent;pointer-events:none}
.btn-icon{width:var(--touch);height:var(--touch);min-width:var(--touch);padding:0;border-radius:var(--radiusControl)}
.btn-row{display:flex;flex-wrap:wrap;gap:var(--gapSm);align-items:center}
.btn-row.split>*{flex:1}

/* ---------- 表单控件 ---------- */
.field{
  display:flex;align-items:center;gap:var(--gapSm);min-height:var(--touch);
  padding:0 var(--gapMd);border:1px solid var(--ruleStrong);border-radius:var(--radiusControl);
  background:var(--solid);color:var(--ink3);
}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:var(--type-bodyQuiet-size);line-height:1.6;color:var(--ink)}
.field input::placeholder{color:var(--ink3)}
.seg{display:flex;gap:4px;padding:4px;background:var(--canvas);border:1px solid var(--rule);border-radius:var(--radiusControl);overflow-x:auto;max-width:100%}
.seg button{
  min-height:var(--touch);padding:0 var(--gapMd);border-radius:var(--radiusSm);
  font-size:var(--type-bodyQuiet-size);line-height:1.4;color:var(--ink2);white-space:nowrap;
}
.seg button[aria-selected="true"]{background:var(--accentSoft);color:var(--ink);font-weight:600}
.switch{
  width:44px;height:26px;flex:none;border-radius:13px;border:1px solid var(--ruleStrong);
  background:var(--canvas);position:relative;transition:background var(--dur-select) var(--ease),border-color var(--dur-select) var(--ease);
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--ink3);transition:transform var(--dur-select) var(--ease),background var(--dur-select) var(--ease);
}
.switch[aria-checked="true"]{background:var(--accentSoft);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--accent)}
.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;
  border-radius:var(--radiusSm);border:1px solid var(--rule);background:var(--canvas);
  font-size:var(--type-caption-size);line-height:1.4;color:var(--ink2);white-space:nowrap;
}
.chip-row{display:flex;gap:var(--gapSm);overflow-x:auto;max-width:100%;padding-bottom:2px}
.radio{display:flex;align-items:center;gap:var(--gapSm);min-height:var(--touch);font-size:var(--type-bodyQuiet-size);color:var(--ink)}
.radio i{width:18px;height:18px;border-radius:50%;border:1px solid var(--ruleStrong);flex:none}
.radio[aria-checked="true"] i{border:5px solid var(--accent)}
.status-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink3)}
.status-dot.success{background:var(--success)}
.status-dot.warning{background:var(--warning)}
.status-dot.danger{background:var(--danger)}
.status-dot.accent{background:var(--accent)}

/* ==========================================================================
   HOME 聊天：助手全宽阅读 + 用户浅染气泡 + 轻量操作行
   ========================================================================== */
.thread{display:flex;flex-direction:column;gap:var(--gapMd)}
.thread-date{font-size:var(--type-caption-size);line-height:var(--type-caption-lh);color:var(--ink3);text-align:center;margin:var(--gapSm) 0}
.msg{display:flex;flex-direction:column;gap:6px}
.msg-user{align-items:flex-end}
.bubble-user{
  max-width:78%;background:var(--accentSoft);color:var(--ink);
  border-radius:var(--radiusCard);padding:10px var(--gapMd);
  font-size:var(--type-body-size);line-height:var(--type-body-lh);
}
.msg-bot .reply{
  width:100%;font-size:var(--type-body-size);line-height:var(--type-body-lh);color:var(--ink);
}
.reply p{margin:0 0 var(--gapMd)}
.reply p:last-child{margin-bottom:0}
.reply ul{margin:0 0 var(--gapMd);padding-left:20px}
.reply li{margin-bottom:6px}
.reply li:last-child{margin-bottom:0}
.reply blockquote{
  margin:0 0 var(--gapMd);padding:2px 0 2px var(--gapMd);
  border-left:2px solid var(--accent);color:var(--ink2);
}
.reply .code{
  margin:0 0 var(--gapMd);padding:var(--gapMd);background:var(--surface);
  border:1px solid var(--rule);border-radius:var(--radiusControl);overflow-x:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:var(--type-mono-size);line-height:var(--type-mono-lh);color:var(--ink);
}
.reply .code code{font:inherit}
.reply table{width:100%;border-collapse:collapse;margin:0 0 var(--gapMd);font-size:var(--type-bodyQuiet-size)}
.reply th,.reply td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule)}
.reply th{font-weight:600;color:var(--ink2)}
.msg-meta{font-size:var(--type-caption-size);line-height:var(--type-caption-lh);color:var(--ink3)}
.msg-actions{display:flex;align-items:center;gap:var(--gapSm);flex-wrap:wrap;margin-top:2px}
.act-text{
  display:inline-flex;align-items:center;gap:6px;min-height:var(--touch);padding:0 6px;
  color:var(--accent);font-size:var(--type-bodyQuiet-size);line-height:1.4;
}
.act-text:active{color:var(--accentPressed)}
.act-icon{
  display:inline-flex;align-items:center;justify-content:center;min-height:var(--touch);min-width:var(--touch);
  color:var(--ink2);
}
.act-icon:active{color:var(--accent)}

/* ---------- HOME 工作：状态轨 + 内容双列 ---------- */
.rail{display:flex;flex-direction:column;gap:var(--gapMd)}
.rail-item{display:grid;grid-template-columns:16px minmax(0,1fr);gap:var(--gapMd);align-items:stretch}
.rail-track{position:relative;display:flex;justify-content:center}
.rail-track::before{content:"";position:absolute;top:0;bottom:calc(-1 * var(--gapMd));width:2px;background:var(--rule)}
.rail-item:last-child .rail-track::before{height:16px;bottom:auto}
.rail-dot{
  position:relative;z-index:1;width:10px;height:10px;border-radius:50%;margin-top:7px;
  background:var(--ruleStrong);outline:3px solid var(--canvas);
}
.rail-item[data-state="done"] .rail-dot{background:var(--ink3)}
.rail-item[data-state="current"] .rail-track::before{background:var(--accent)}
.rail-item[data-state="current"] .rail-dot{background:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
.rail-item[data-state="failed"] .rail-dot{
  width:16px;height:16px;margin-top:3px;background:transparent;color:var(--danger);
  outline:none;display:flex;align-items:center;justify-content:center;
}
.rail-title{font-size:var(--type-bodyStrong-size);line-height:1.5;font-weight:var(--type-bodyStrong-weight)}
.rail-item[data-state="done"] .rail-title{font-weight:400;color:var(--ink3)}
.rail-item[data-state="failed"] .rail-title{color:var(--danger)}
.rail-sub{font-size:var(--type-bodyQuiet-size);line-height:var(--type-bodyQuiet-lh);color:var(--ink2);margin-top:2px}
.rail-item[data-state="done"] .rail-sub{color:var(--ink3)}
.rail-actions{display:flex;gap:var(--gapSm);margin-top:var(--gapSm);flex-wrap:wrap}

/* ---------- 文件样式成果卡 ---------- */
.filecard{
  display:flex;align-items:center;gap:var(--gapMd);padding:var(--gapMd);
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--radiusCard);
}
.filecard .file-icon{width:36px;height:36px;flex:none}
.filecard-main{flex:1;min-width:0}
.filecard-name{font-size:var(--type-bodyStrong-size);line-height:1.4;font-weight:var(--type-bodyStrong-weight);word-break:break-all}
.filecard-meta{font-size:var(--type-caption-size);line-height:var(--type-caption-lh);color:var(--ink3);margin-top:2px}
.filecard-actions{display:flex;align-items:center;gap:var(--gapSm);flex:none}
.notice-row{
  display:flex;align-items:center;gap:var(--gapSm);flex-wrap:wrap;
  padding:var(--gapMd) 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  font-size:var(--type-bodyQuiet-size);line-height:1.6;color:var(--ink2);
}
.notice-row .notice-text{color:var(--ink)}
.notice-row .act-text{font-size:var(--type-bodyQuiet-size)}

/* ==========================================================================
   空态
   ========================================================================== */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--gapSm);padding:var(--gapSection) 0}
.empty .ico{width:56px;height:56px;color:var(--ink3)}
.empty h3{margin:var(--gapSm) 0 0;font-size:var(--type-title-size);line-height:var(--type-title-lh);font-weight:var(--type-title-weight)}
.empty p{margin:0;max-width:30ch;font-size:var(--type-bodyQuiet-size);line-height:var(--type-bodyQuiet-lh);color:var(--ink2)}

/* ==========================================================================
   TOOLS / TASKS / WORKSPACE / PERSONA
   ========================================================================== */
.person-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gapMd)}
.person-card{
  text-align:left;border:1px solid var(--rule);border-radius:var(--radiusCard);
  background:var(--surface);padding:var(--gapMd);display:flex;flex-direction:column;gap:var(--gapSm);
}
.person-card:active{background:var(--accentSoft)}
.person-card[aria-pressed="true"]{border-color:var(--accent);background:var(--accentSoft)}
.person-pic{width:100%;aspect-ratio:1/1;border-radius:var(--radiusControl);overflow:hidden;background:var(--canvas)}

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function rgba(hex, alpha) {
  const c = hexToRgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + alpha + ')';
}
function mix(a, b, ratio) {
  const x = hexToRgb(a), y = hexToRgb(b);
  const m = i => Math.round(x[i] + (y[i] - x[i]) * ratio);
  return 'rgb(' + m(0) + ',' + m(1) + ',' + m(2) + ')';
}
function applyTheme(name) {
  const t = TOKENS.themes[name];
  const root = document.documentElement;
  Object.keys(t).forEach(role => root.style.setProperty('--' + role, t[role]));
  const s = TOKENS.surfaces, ov = TOKENS.overlayVariants, g = TOKENS.geometry, m = TOKENS.motion;
  root.style.setProperty('--overlay-bg', state.reduceTransparency ? t.solid : rgba(t.overlay, s.L4_OVERLAY.opacity));
  root.style.setProperty('--l4-blur', state.reduceTransparency ? '0px' : s.L4_OVERLAY.blur + 'px');
  root.style.setProperty('--radius-menu', ov.menu.radius + 'px');
  root.style.setProperty('--radius-sheet', ov.sheet.radius + 'px');
  root.style.setProperty('--radius-dialog', ov.dialog.radius + 'px');
  root.style.setProperty('--shadow-menu', '0 4px ' + ov.menu.shadow + 'px rgba(0,0,0,.22)');
  root.style.setProperty('--shadow-sheet', '0 -10px ' + ov.sheet.shadow + 'px rgba(0,0,0,.26)');
  root.style.setProperty('--shadow-dialog', '0 14px ' + ov.dialog.shadow + 'px rgba(0,0,0,.30)');
  Object.keys(g).forEach(k => root.style.setProperty('--' + k, g[k] + 'px'));
  Object.keys(TOKENS.type).forEach(k => {
    const t2 = TOKENS.type[k];
    root.style.setProperty('--type-' + k + '-size', t2.size + 'px');
    root.style.setProperty('--type-' + k + '-lh', String(t2.lineHeight));
    root.style.setProperty('--type-' + k + '-weight', String(t2.weight));
  });
  root.style.setProperty('--dur-press', m.pressMs + 'ms');
  root.style.setProperty('--dur-select', m.selectMs + 'ms');
  root.style.setProperty('--dur-push', m.pushMs + 'ms');
  root.style.setProperty('--dur-pop', m.popMs + 'ms');
  root.style.setProperty('--dur-sheet', m.sheetMs + 'ms');
  root.style.setProperty('--dur-dialog', m.dialogMs + 'ms');
  root.style.setProperty('--dur-sidebar', m.sidebarMs + 'ms');
  root.style.setProperty('--dur-fade', m.fadeMs + 'ms');
  root.style.setProperty('--dur-progress', m.progressMs + 'ms');
  root.style.setProperty('--ease', m.easing);
  root.style.setProperty('--pressedScale', String(m.pressedScale));
  const dark = TOKENS.themes.dark;
  root.style.setProperty('--stage', mix(dark.canvas, dark.ink, 0.12));
  root.style.setProperty('--stage-line', mix(dark.canvas, dark.ink, 0.22));
  root.dataset.theme = name;
}

  const lead = o.lead ? '<span class="row-lead">' + o.lead + '</span>' : '';
  const desc = o.desc ? '<div class="row-desc">' + o.desc + '</div>' : '';
  const meta = o.meta ? '<div class="row-meta">' + o.meta + '</div>' : '';
  const trail = o.trail ? '<span class="row-trail">' + o.trail + '</span>' : '';
  const tag = o.action ? ' data-action="' + o.action + '"' : '';
  const cls = 'row' + (o.cls ? ' ' + o.cls : '');
  const inner = lead + '<span class="row-main"><span class="row-title">' + o.title + '</span>' + desc + meta + '</span>' + trail;
  return o.action
    ? '<button class="' + cls + '"' + tag + '>' + inner + '</button>'
    : '<div class="' + cls + '">' + inner + '</div>';
}

function openMenu(key, anchor) {
  const items = MENUS[key] || MENUS.top;
  const layer = $('menu-layer');
  const menu = document.createElement('div');
  menu.className = 'menu';
  menu.setAttribute('role', 'menu');
  menu.innerHTML = items.map((it, i) =>
    (i ? '<div class="menu-sep"></div>' : '') +
    '<button class="menu-item" role="menuitem" data-action="' + it[2] + '">' + ico(it[0], 'sm') + '<span>' + it[1] + '</span></button>').join('');
  layer.innerHTML = '';
  layer.appendChild(menu);
  layer.classList.add('visible');
  state.menuOpen = true;
  const phone = $('phone');
  const pr = phone.getBoundingClientRect();
  const ar = anchor.getBoundingClientRect();
  const mr = menu.getBoundingClientRect();
  let left = ar.right - pr.left - mr.width;
  let top = ar.bottom - pr.top + 4;
  if (top + mr.height > pr.height - 12) top = ar.top - pr.top - mr.height - 4;
  menu.style.left = Math.max(12, Math.min(left, pr.width - mr.width - 12)) + 'px';
  menu.style.top = Math.max(96, top) + 'px';
}
function closeMenu() {
  $('menu-layer').classList.remove('visible');
  $('menu-layer').innerHTML = '';
  state.menuOpen = false;
}

/* ------------------------------------------------------------- Toast --- */
let toastTimer = null;
function toast(message) {
  const n = $('toast');
  n.textContent = message;
  n.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => n.classList.remove('visible'), 1900);
}

/* ------------------------------------------------------ 设计参数面板 --- */
function srgb(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function luminance(hex) {
  const c = hexToRgb(hex);
  return 0.2126 * srgb(c[0]) + 0.7152 * srgb(c[1]) + 0.0722 * srgb(c[2]);
}
function contrast(a, b) {
  const l1 = luminance(a), l2 = luminance(b);
  const hi = Math.max(l1, l2), lo = Math.min(l1, l2);
  return (hi + 0.05) / (lo + 0.05);
}
function hexToHsl(hex) {
  const c = hexToRgb(hex).map(v => v / 255);
  const max = Math.max.apply(null, c), min = Math.min.apply(null, c);
  let h = 0, s = 0; const l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    if (max === c[0]) h = (c[1] - c[2]) / d + (c[1] < c[2] ? 6 : 0);
    else if (max === c[1]) h = (c[2] - c[0]) / d + 2;
    else h = (c[0] - c[1]) / d + 4;
    h *= 60;
  }
  return [h, s, l];
}
function hslToHex(h, s, l) {
  const c = [0, 0, 0];
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  c[0] = f(0); c[1] = f(8); c[2] = f(4);
  return '#' + c.map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join('').toUpperCase();
}
function solveAccent(hex, lightTheme) {
  const on = contrast(POLE_LIGHT, hex) >= contrast(POLE_DARK, hex) ? POLE_LIGHT : POLE_DARK;
  const hsl = hexToHsl(hex);
  const l = Math.max(0.02, Math.min(0.98, lightTheme ? hsl[2] - 0.08 : hsl[2] + 0.08));
  const pressed = hslToHex(hsl[0], hsl[1], l);
  return { on, pressed, onRatio: contrast(on, hex), pressedRatio: contrast(on, pressed) };
}
function renderInspector() {
  const t = TOKENS.themes[state.theme];
  const g = TOKENS.geometry, m = TOKENS.motion;
  let html = '<div class="panel-head"><div class="panel-eyebrow">设计参数 · tokens.json ' + TOKENS.version + '</div>' +
    '<h3>' + (THEMES.find(x => x[0] === state.theme) || ['', ''])[1] + '主题</h3></div>';
  html += '<div class="p-block"><div class="p-title">主题</div><div class="pill-row">' +
    THEMES.map(x => '<button class="pill" aria-pressed="' + (state.theme === x[0]) + '" data-action="theme:' + x[0] + '">' + x[1] + '</button>').join('') +
    '</div></div>';
  html += '<div class="p-block"><div class="p-title">色板 · ' + Object.keys(t).length + ' 个角色</div><div class="swatch-grid">' +
    Object.keys(t).map(k => '<div class="swatch"><span class="swatch-chip" style="background:' + t[k] + '"></span>' +
      '<span class="swatch-name">' + k + '</span><span class="swatch-hex">' + t[k] + '</span></div>').join('') + '</div></div>';
  html += '<div class="p-block"><div class="p-title">材质层级 L1 → L5</div>' +
    Object.keys(TOKENS.surfaces).map(k => {
      const s = TOKENS.surfaces[k];
      return '<div class="layer-row"><span class="layer-chip" style="background:' + t[s.fill] + '"></span>' +
        '<div><div class="layer-name">' + k.replace('_', ' ') + '</div>' +
        '<div class="layer-meta">fill ' + s.fill + ' · α ' + s.opacity + ' · blur ' + s.blur + 'dp · shadow ' + s.shadow + 'dp · border ' + s.border + '</div></div></div>';
    }).join('') + '</div>';
  html += '<div class="p-block"><div class="p-title">排版阶梯</div>' +
    Object.keys(TOKENS.type).map(k => {
      const v = TOKENS.type[k];
      return '<div class="type-row"><span class="type-tag">' + k + '</span>' +
        '<span class="type-sample" style="font-size:' + v.size + 'px;line-height:' + v.lineHeight + ';font-weight:' + v.weight + '">神言正文 Aa</span>' +
        '<span class="type-meta">' + v.size + '/' + v.lineHeight + '/' + v.weight + '</span></div>';
    }).join('') + '</div>';
  html += '<div class="p-block"><div class="p-title">圆角</div>' +
    ['radiusSm', 'radiusControl', 'radiusCard', 'radiusSheet', 'radiusOverlay'].map(k =>
      '<div class="kv"><span>' + k + '</span><span>' + g[k] + 'dp</span></div>').join('') + '</div>';
  html += '<div class="p-block"><div class="p-title">间距</div>' +
    ['gapXs', 'gapSm', 'gapMd', 'gapLg', 'gapSection', 'gapPage', 'touch'].map(k =>
      '<div class="kv"><span>' + k + '</span><span>' + g[k] + 'dp</span></div>').join('') +
    '<div class="gap-strip">' + ['gapXs', 'gapSm', 'gapMd', 'gapLg', 'gapSection'].map(k =>
      '<i style="width:' + g[k] + 'px;height:' + g[k] + 'px"></i>').join('') + '</div></div>';
  html += '<div class="p-block"><div class="p-title">动效时长</div>' +
    Object.keys(m).filter(k => /Ms$/.test(k)).map(k =>
      '<div class="kv"><span>' + k.replace('Ms', '') + '</span><span>' + m[k] + 'ms</span></div>').join('') +
    '<div class="kv"><span>easing</span><span>' + m.easing + '</span></div>' +
    '<div class="kv"><span>pressedScale</span><span>' + m.pressedScale + '</span></div></div>';
  html += '<div class="p-block"><div class="p-title">八色卡 · 前景与按下态求解</div>' +
    TOKENS.primitives.accentCards.map(a => {
      const hex = a[state.theme === 'light' ? 'light' : 'dark'];
      const s = solveAccent(hex, state.theme === 'light');
      return '<div class="accent-card"><span class="accent-chip" style="background:' + hex + '"></span>' +
        '<span><span class="accent-name">' + a.name + '</span><br><span class="accent-meta">on ' + s.on + ' ' + s.onRatio.toFixed(1) +
        ' · pressed ' + s.pressed + ' ' + s.pressedRatio.toFixed(1) + '</span></span></div>';
    }).join('') + '</div>';
  html += '<div class="p-block"><div class="p-title">降级与无障碍</div>' +
    '<div class="kv"><span>减少透明度</span><span>' + (state.reduceTransparency ? 'solid 兜底' : 'overlay + blur 20dp') + '</span></div>' +
    '<div class="kv"><span>最小点击区</span><span>' + g.touch + 'dp</span></div>' +
    '<div class="kv"><span>正文对比门槛</span><span>≥4.5:1</span></div>' +
    '<button class="btn btn-secondary" style="width:100%;margin-top:10px" data-action="toggle-transparency">' +
    (state.reduceTransparency ? '恢复 overlay + blur' : '模拟减少透明度') + '</button></div>';
  $('inspector').innerHTML = html;
}

/* ------------------------------------------------------------- 渲染 --- */
function renderRoute() {
  switch (state.route) {
    case 'HOME': return state.mode === 'WORK' ? renderWork() : renderChat();
    case 'TOOLS': return renderTools();
    case 'TASKS': return renderTasks();
    case 'WORKSPACE': return renderWorkspace();
    case 'PERSONA_GALLERY': return renderPersona();
    case 'DIARY': return renderDiary();
    case 'SETTINGS': return renderSettings();
    default: return '';
  }
}
function drawPage() {
  applyTheme(state.theme);
  $('topbar').innerHTML = topbarHTML();
  $('page').innerHTML = renderRoute();
  renderDock();
  renderDrawer();
  renderSheet();
  renderDialog();
  renderInspector();
  $('board-nav').innerHTML = ROUTES.map(r =>
    '<button data-action="route:' + r + '" aria-current="' + (state.route === r) + '">' +
    '<span style="width:6px;height:6px;border-radius:50%;background:' + (state.route === r ? 'var(--accent)' : 'var(--ruleStrong)') + '"></span>' +
    ROUTE_LABEL[r] + '</button>').join('');
  const toolSearch = $('tool-search');
  if (toolSearch) {
    toolSearch.addEventListener('input', e => {
      state.search = e.target.value;
      const pos = e.target.selectionStart;
      drawPage();
      const next = $('tool-search');
      if (next) { next.focus(); next.setSelectionRange(pos, pos); }
    });
  }
}

/* ------------------------------------------------------------- 行为 --- */
function goRoute(arg) {
  const parts = arg.split(':');
  state.route = parts[0];
  if (parts[0] === 'HOME' && parts[1] === 'WORK') state.mode = 'WORK';
  if (parts[0] === 'HOME') state.mode = 'CHAT';
  if (parts[0] === 'SETTINGS') { state.settings = 'ROOT'; state.settingsStack = ['ROOT']; }
  state.drawer = false;
  state.sheet = '';
  closeMenu();
  drawPage();
  $('page').scrollTop = 0;
}
function backSettings() {
  if (state.settingsStack.length > 1) {
    state.settingsStack.pop();
    state.settings = state.settingsStack[state.settingsStack.length - 1];
  } else if (state.settings !== 'ROOT') {
    state.settings = 'ROOT';
    state.settingsStack = ['ROOT'];
  } else {
    state.route = 'HOME';
  }
  drawPage();
}
function dispatch(code) {
  const parts = code.split(':');
  const verb = parts[0];
  if (verb === 'route') { goRoute(parts.slice(1).join(':')); return; }
  if (verb === 'settings') {
    if (state.route !== 'SETTINGS') state.settingsStack = ['ROOT'];
    if (state.settings !== parts[1]) state.settingsStack.push(parts[1]);
    state.route = 'SETTINGS';
    state.settings = parts[1];
    state.drawer = false;
    state.sheet = '';
    closeMenu();
    drawPage();
    $('page').scrollTop = 0;
    return;
  }
  if (verb === 'persona') {
    state.selectedPerson = Number(parts[1]);
    if (state.route !== 'PERSONA_GALLERY') { state.route = 'PERSONA_GALLERY'; }
    state.drawer = false;
    drawPage();
    return;
  }
  if (verb === 'mode') {
    state.mode = parts[1];
    state.route = 'HOME';
    state.drawer = false;
    drawPage();
    return;
  }
  if (verb === 'theme') {
    state.theme = parts[1];
    drawPage();
    toast('已切换到' + (THEMES.find(x => x[0] === state.theme) || ['', ''])[1] + '主题');
    return;
  }
  if (verb === 'theme-next') {
    const idx = THEMES.findIndex(x => x[0] === state.theme);
    state.theme = THEMES[(idx + 1) % THEMES.length][0];
    drawPage();
    toast('已切换到' + THEMES[(idx + 1) % THEMES.length][1] + '主题');
    return;
  }
  if (verb === 'tool-tab') { state.toolTab = parts[1]; drawPage(); return; }
  if (verb === 'sheet') { state.drawer = false; state.sheet = parts[1]; closeMenu(); renderDrawer(); renderSheet(); return; }
  if (verb === 'dialog') { state.dialog = parts[1]; closeMenu(); renderDialog(); return; }
  if (verb === 'menu') { openMenu(parts[1], document.querySelector('[data-action="menu:' + parts[1] + '"]') || $('topbar')); return; }
  if (verb === 'toast') { toast(parts.slice(1).join(':')); return; }
  switch (code) {
    case 'drawer': state.drawer = true; renderDrawer(); break;
    case 'close-drawer': state.drawer = false; renderDrawer(); break;
    case 'close-sheet': state.sheet = ''; renderSheet(); break;
    case 'close-dialog': state.dialog = ''; renderDialog(); break;
    case 'dialog-ok':
      state.dialog = ''; renderDialog();
      toast('演示确认，不改变任何真实状态');
      break;
    case 'settings-back': backSettings(); break;
    case 'toggle-run':
      state.running = !state.running;
      drawPage();
      toast(state.running ? '已继续运行（模拟）' : '已停止，记录仍保留');
      break;
    case 'toggle-transparency':
      state.reduceTransparency = !state.reduceTransparency;
      drawPage();
      toast(state.reduceTransparency ? '浮层退化为 solid 兜底' : '浮层恢复 overlay + blur');
      break;
    case 'tool-clear': state.search = ''; drawPage(); break;
    case 'focus-search': state.route = 'TOOLS'; state.drawer = false; drawPage(); setTimeout(() => { const i = $('tool-search'); if (i) i.focus(); }, 30); break;
    case 'send':
      if (state.draft.trim()) {
        state.sent.push(state.draft);
        state.draft = '';
        drawPage();
        $('page').scrollTop = $('page').scrollHeight;
        toast('已发送（模拟）');
      } else {
        toast('请输入内容');
      }
      break;
    default: break;
  }
}
document.addEventListener('click', e => {
  if (e.target.id === 'dialog-layer') { state.dialog = ''; renderDialog(); return; }
  const control = e.target.closest('[data-action]');
  if (control) {
    e.preventDefault();
    dispatch(control.dataset.action);
    return;
  }
  if (e.target.closest('#menu-layer') && !e.target.closest('.menu')) closeMenu();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (state.dialog) { state.dialog = ''; renderDialog(); return; }
    if (state.sheet) { state.sheet = ''; renderSheet(); return; }
    if (state.menuOpen) { closeMenu(); return; }
    if (state.drawer) { state.drawer = false; renderDrawer(); return; }
    if (state.route === 'SETTINGS' && state.settings !== 'ROOT') backSettings();
  }
});
window.addEventListener('resize', closeMenu);

/* --------------------------------------------------------------- 启动 --- */
function init() {
  if (Q.get('settings') && SETTINGS[Q.get('settings')]) {
    state.route = 'SETTINGS';
    state.settings = Q.get('settings');
    state.settingsStack = ['ROOT', state.settings];
  }
  drawPage();
  if (state.drawer) renderDrawer();
  if (state.sheet) renderSheet();
}
init();

});</script>
