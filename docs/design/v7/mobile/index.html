<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>神言 V7 · 视觉语言离线设计稿</title>
<link rel="stylesheet" href="v7.css">
<script src="v7.js" defer></script>
</head>
<body>
<div class="board">

  <!-- 评审说明（设计稿外围，不是 App 界面） -->
  <section class="board-note">
    <div class="eyebrow">SHENYAN / VISUAL LANGUAGE</div>
    <h1>神言神语 <em>V7</em></h1>
    <p>按《V7 视觉语言规范》重做的一套纸面：层级交给排版与留白，强调全局只留一种颜色，浮层才允许透明。</p>
    <div class="mock-note">本页是离线设计投影：不请求网络、不连接真实模型或账户，对话、人物、任务、文件、用量全部为模拟数据。</div>
    <nav class="board-nav" id="board-nav" aria-label="主路由"></nav>
    <p class="fine">基准机 393 × 852，兼容 360 / 320 窄屏。<br>令牌唯一来源：docs/design/v7/tokens.json（右侧「设计参数」面板实时读取）。</p>
  </section>

  <!-- 手机壳 -->
  <div class="phone-wrap">
    <div class="phone" id="phone">
      <div class="statusline"><span>9:41</span><span class="status-glyph">●●● ▰</span></div>
      <header class="topbar" id="topbar"></header>
      <main class="page-scroll" id="page" aria-live="polite"></main>
      <div id="dock"></div>
      <div class="home-indicator"><span></span></div>

      <!-- L4 浮层：抽屉 / 底部 Sheet / 菜单 / 对话框 -->
      <div class="scrim" id="scrim-drawer" data-action="close-drawer"></div>
      <aside class="drawer" id="drawer" aria-label="侧栏"></aside>
      <div class="scrim" id="scrim-sheet" data-action="close-sheet"></div>
      <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="当前操作" aria-hidden="true"></section>
      <div class="menu-layer" id="menu-layer"></div>
      <div class="dialog-layer" id="dialog-layer"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>

  <!-- 设计参数面板 -->
  <aside class="board-panel" id="inspector" aria-label="设计参数"></aside>

</div>
</body>
</html>
