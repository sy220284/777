<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>神言神语 V6 · 手机端 38 场景</title>

<style>
:root{
--bg1:#EDE6DA;--ink:#3A342D;--ink2:#6A6156;--ink3:#70665A;--ink4:#BEB4A7;
--glass:rgba(255,255,255,.62);--glass2:rgba(255,255,255,.46);--glass3:rgba(255,255,255,.30);
--gline:rgba(255,255,255,.80);--gline2:rgba(255,255,255,.55);
--acc:#E8A87C;--accD:#D9926B;--accX:rgba(232,168,124,.18);
--mint:#7FBFA8;--mintD:#69AE97;--mintX:rgba(127,191,168,.18);
--lilac:#B9A0D4;--lilacX:rgba(185,160,212,.20);
--clay:#C98B6B;--clayX:rgba(201,139,107,.20);
--warn:#E0A458;--warnX:rgba(224,164,88,.20);
--danger:#D9705F;--dangerX:rgba(217,112,95,.20);
--okInk:#376E5D;--warmInk:#855431;--clayInk:#855036;
--sans:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg1);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.7;-webkit-font-smoothing:antialiased;
 background-image:radial-gradient(1100px 700px at 8% -10%,rgba(232,168,124,.30),transparent 62%),radial-gradient(950px 650px at 92% 4%,rgba(127,191,168,.26),transparent 60%),radial-gradient(800px 700px at 60% 100%,rgba(185,160,212,.18),transparent 60%);
 background-attachment:fixed;overflow:hidden}

/* ─── 顶部导航 ─── */
.topbar{position:fixed;top:0;left:0;right:0;height:54px;background:rgba(250,246,240,.85);backdrop-filter:blur(24px);border-bottom:1px solid var(--gline);display:flex;align-items:center;padding:0 22px;z-index:50;gap:18px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px}
.brand .mk{width:24px;height:24px;border-radius:8px;background:linear-gradient(140deg,var(--acc),var(--mint))}
.crumb{font-size:12.5px;color:var(--ink3);font-family:var(--mono)}
.crumb b{color:var(--ink);font-weight:500}
.crumb .sep{opacity:.4;margin:0 8px}
.topbar .acts{margin-left:auto;display:flex;gap:9px;align-items:center}
.btn{height:30px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.6);border:1px solid var(--gline);display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);cursor:pointer;transition:all 200ms cubic-bezier(.22,1,.36,1)}
.btn:hover{background:rgba(255,255,255,.9);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn svg{width:13px;height:13px}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--accD));color:#fff;border-color:transparent;box-shadow:0 6px 16px -8px rgba(217,146,107,.9)}

/* ─── 侧栏 ─── */
.sb{position:fixed;left:0;top:54px;bottom:0;width:220px;background:rgba(255,255,255,.45);backdrop-filter:blur(30px);border-right:1px solid var(--gline);padding:14px 12px;overflow-y:auto;z-index:40}
.sb-grp{font-family:var(--mono);font-size:9.5px;color:var(--ink3);letter-spacing:.14em;padding:14px 10px 5px}
.sb-i{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;font-size:12.5px;color:var(--ink2);cursor:pointer;transition:background 200ms}
.sb-i:hover{background:rgba(255,255,255,.5)}
.sb-i.on{background:rgba(255,255,255,.78);color:var(--ink);font-weight:500;box-shadow:0 2px 6px -2px rgba(90,72,55,.16)}
.sb-i svg{width:14px;height:14px;flex-shrink:0;opacity:.7}
.sb-i.on svg{opacity:1;color:var(--accD)}
.sb-i .ct{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--ink3)}

/* ─── 主区 ─── */
.main{position:fixed;left:220px;top:54px;right:0;bottom:0;display:flex;flex-direction:column;background:transparent}
.toolbar{flex-shrink:0;height:48px;padding:0 22px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.4)}
.tt{font-size:15.5px;font-weight:600;letter-spacing:-.012em}
.ts{font-size:11.5px;color:var(--ink3);margin-top:1px}
.toolbar .acts{margin-left:auto;display:flex;gap:8px}
.content{flex:1;overflow-y:auto;padding:22px 26px}

/* ─── 卡片 ─── */
.card{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--gline);border-radius:18px;padding:18px 20px;box-shadow:0 6px 22px -16px rgba(90,72,55,.28),inset 0 1px 0 rgba(255,255,255,.5);transition:all 200ms}
.card:hover{box-shadow:0 10px 32px -18px rgba(90,72,55,.34)}
.card .ct{font-size:13.5px;font-weight:600;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.card .ct svg{width:14px;height:14px;color:var(--ink3)}
.card.sm{padding:13px 15px;border-radius:14px}
.card .row{display:flex;align-items:center;gap:11px;padding:8px 0;font-size:13px}
.card .row .v{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink2)}

/* ─── 通用控件 ─── */
.sw{width:38px;height:22px;border-radius:11px;position:relative;background:rgba(160,145,125,.28);cursor:pointer;transition:background 200ms;flex-shrink:0}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(90,72,55,.3);transition:left 200ms cubic-bezier(.22,1,.36,1)}
.sw.on{background:linear-gradient(135deg,var(--mint),var(--mintD))}
.sw.on::after{left:18px}
.tabs{display:flex;gap:0;background:rgba(255,255,255,.5);border:1px solid var(--gline);border-radius:11px;padding:3px;width:fit-content}
.tabs span{padding:5px 12px;border-radius:9px;font-size:12px;color:var(--ink3);cursor:pointer;transition:all 200ms}
.tabs span.on{background:#fff;color:var(--ink);box-shadow:0 2px 5px rgba(90,72,55,.18)}
.tabs span:hover:not(.on){background:rgba(255,255,255,.4)}
.inp{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.56);border:1px solid var(--gline);border-radius:12px;padding:9px 13px;font-size:13px;color:var(--ink3);min-height:38px;transition:all 200ms}
.inp svg{width:14px;height:14px;flex-shrink:0}
.inp.filled{color:var(--ink)}
.inp:focus-within{border-color:var(--acc);background:rgba(255,255,255,.85);box-shadow:0 0 0 3px var(--accX)}
.tagp{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:10px;font-size:10.5px;font-weight:500}
.dotm{width:6px;height:6px;border-radius:50%}
.bar{height:7px;border-radius:5px;background:rgba(140,125,110,.16);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--acc),var(--accD));transition:width 340ms cubic-bezier(.22,1,.36,1)}
.bar.g i{background:linear-gradient(90deg,var(--mint),var(--mintD))}
.list-i{display:flex;align-items:center;gap:11px;padding:10px 8px;border-radius:10px;font-size:13px;transition:background 200ms;cursor:pointer}
.list-i:hover{background:rgba(255,255,255,.5)}
.list-i .ar{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-left:auto}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0}

/* 浮层 */
.overlay{position:fixed;inset:0;background:rgba(40,30,20,.4);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 200ms}
.overlay.show{opacity:1;pointer-events:auto}
.dlg{background:#FAF6EC;border:1px solid var(--gline);border-radius:20px;padding:22px 24px;max-width:380px;transform:scale(.92);transition:transform 280ms cubic-bezier(.22,1,.36,1);box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.overlay.show .dlg{transform:scale(1)}
.sheet{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(40px);background:rgba(250,246,240,.96);backdrop-filter:blur(30px);border:1px solid var(--gline);border-radius:24px;padding:18px 22px 24px;width:480px;max-width:92vw;box-shadow:0 -20px 50px -20px rgba(90,72,55,.4);transition:transform 380ms cubic-bezier(.22,1,.36,1);z-index:100}
.sheet.show{transform:translateX(-50%) translateY(0)}
.sheet .gr{width:38px;height:4px;border-radius:3px;background:rgba(120,104,80,.2);margin:0 auto 14px}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-30px);background:rgba(58,52,45,.92);color:#FBF7F1;padding:10px 18px;border-radius:13px;font-size:13px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);opacity:0;transition:transform 340ms cubic-bezier(.22,1,.36,1),opacity 200ms;z-index:200;display:flex;align-items:center;gap:9px;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* 通用样式 */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.rowflex{display:flex;gap:14px}
.flex1{flex:1}
.note{padding:11px 13px;border-radius:12px;font-size:12.5px;line-height:1.7;display:flex;align-items:flex-start;gap:9px}
.note svg{width:15px;height:15px;flex-shrink:0;margin-top:1px}
.muted{color:var(--ink3)}
.mono{font-family:var(--mono);font-size:11.5px}

/* 头像渐变 */
.av-1{background:linear-gradient(140deg,#F5D9BC,#E8A87C);color:#5a4638}
.av-2{background:linear-gradient(140deg,#BFE3D6,#7FBFA8);color:#3F6B5A}
.av-3{background:linear-gradient(140deg,#E7D9F0,#B9A0D4);color:#6E5490}
.av-4{background:linear-gradient(140deg,#D8E8CF,#A8C99A);color:#3F6B40}


/* V6 三主题语义变量 */
body.theme-dark{
 --okInk:#9AD4BE;--warmInk:#F0B891;--clayInk:#D7A189;
 --bg1:#24211E;--ink:#F5F0E8;--ink2:#D9D0C5;--ink3:#B8AB9B;--ink4:#948B80;
 --glass:rgba(46,43,40,.91);--glass2:rgba(53,49,45,.91);--glass3:rgba(64,58,52,.86);
 --gline:rgba(255,255,255,.13);--gline2:rgba(255,255,255,.09);
 --accX:rgba(232,168,124,.19);--mintX:rgba(127,191,168,.19);
 background-image:radial-gradient(900px 650px at 8% 0%,rgba(232,168,124,.12),transparent 65%),radial-gradient(900px 720px at 92% 4%,rgba(127,191,168,.10),transparent 66%)
}
body.theme-dark .topbar{background:rgba(46,43,40,.96)}
body.theme-dark .sb{background:rgba(46,43,40,.96)}
body.theme-dark .btn,body.theme-dark .inp,body.theme-dark .tabs{background:rgba(64,58,52,.93);color:var(--ink)}
body.theme-dark .tabs span.on{background:#5B4032!important;color:#F5F0E8!important}
body.theme-dark .btn.pri{background:linear-gradient(135deg,var(--acc),var(--accD));color:#302720}
body.theme-dark .dlg,body.theme-dark .sheet{background:#35312D}
body.theme-dark .mobile-menu{background:#403A34;color:var(--ink)}
body.theme-dark .mobile-screen-tabs{background:#35312D}
body.theme-dark .mobile-screen-tabs button.selected{background:#5B4032;color:var(--ink)}
body.theme-dark .sb-i.on{background:#5B4032}
body.theme-dark .prototype-tag{background:rgba(255,255,255,.13);color:var(--ink2)}
body.theme-dark .content [style*="background:rgba(255,255,255"]{background:rgba(64,58,52,.84)!important}
body.theme-dark .content [style*="background:#fff"]{background:#403A34!important}
body.theme-dark .content .card{border-color:var(--gline)}
body.theme-matte{--bg1:#0F0F10;--glass:rgba(24,24,25,.98);--glass2:rgba(35,35,36,.98);--glass3:rgba(43,43,44,.98);background-image:none}
body.theme-matte .topbar,body.theme-matte .sb{background:#202021}

/* V6 离线交互与可读性 */
.prototype-tag{font-size:10px;font-weight:500;padding:1px 7px;border-radius:7px;background:rgba(140,125,110,.14);color:#625548}
.btn.pri{color:var(--ink)}
.btn:focus-visible,.sb-i:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[role="switch"]:focus-visible{outline:3px solid #93603C;outline-offset:3px}
.mobile-menu,.drawer-scrim,.mobile-screen-tabs{display:none}
button.mobile-menu,button.mobile-screen-tabs{font:inherit}
.screen-canvas{padding:22px 24px}
.content{overscroll-behavior:contain}
.content,.content *{overflow-wrap:anywhere}
/* 触摸设备：保障导航、按钮、切换开关的可操作尺寸 */
@media (pointer:coarse){.sb-i,.btn{min-height:44px}.sw{min-width:44px;min-height:32px;border-radius:18px}.sw::after{top:7px;left:6px}.sw.on::after{left:22px}}

@media(max-width:390px){.prototype-tag{display:none}.topbar .brand{font-size:12px}.topbar .acts .btn:last-child{font-size:0}.content{padding:8px}.screen-canvas{padding:9px}.toolbar{padding:8px 10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

/* Final QA: keyboard, readability, touch and device safe areas */
.sheet{visibility:hidden;pointer-events:none;transition:transform 380ms cubic-bezier(.22,1,.36,1),visibility 0s linear 380ms}
.sheet.show{visibility:visible;pointer-events:auto;transition:transform 380ms cubic-bezier(.22,1,.36,1),visibility 0s}

.toast{min-width:0;width:max-content;max-width:min(340px,calc(100vw - 28px));gap:10px;line-height:1.45;white-space:normal;overflow-wrap:anywhere;padding:10px 14px;top:calc(65px + env(safe-area-inset-top,0px));font-size:12px}
.toast svg{width:18px;height:18px;min-width:18px;flex:none;display:block;stroke-width:2.3}
.toast span{display:block;min-width:0;max-width:100%}

:root{color-scheme:light}
body.theme-dark,body.theme-matte{color-scheme:dark}
.content{scrollbar-gutter:stable;overscroll-behavior:contain}
.content :is(button,[role=button],[role=tab],[role=switch],[role=radio],.sb-i,.list-i[onclick]):focus-visible,
.topbar a:focus-visible,.topbar button:focus-visible,.mobile-screen-tabs button:focus-visible{
 outline:3px solid #B27A4E;outline-offset:2px;
}
button:disabled{opacity:.48;cursor:not-allowed;filter:saturate(.6);box-shadow:none!important}
button,.btn,a{touch-action:manipulation}
.chat-compose{display:flex;align-items:flex-end;gap:9px;background:var(--glass);border:1px solid var(--gline);border-radius:20px;padding:9px;margin-top:14px}
.chat-compose textarea{display:block;width:100%;min-width:0;flex:1;background:transparent;border:0;outline:none;color:var(--ink);font:inherit;font-size:14px;resize:vertical;max-height:160px;line-height:1.5}
.chat-compose textarea::placeholder{color:var(--ink3)}
.chat-compose .btn{height:44px;min-width:68px;justify-content:center;flex-shrink:0}
.chat-demo-message{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.chat-demo-message > span{font-size:10px;color:var(--ink3)}
.chat-demo-message > div{padding:10px 14px;background:var(--accX);border-radius:18px 18px 6px 18px;max-width:84%;font-size:14px;white-space:pre-wrap}
.model-status{border-radius:10px;padding:9px 12px;background:var(--glass2);font-size:12px;color:var(--ink2);margin-top:12px;line-height:1.7}
.demo-failure{height:36px;margin-top:8px;max-width:100%;font-size:11px}
.prototype-exit{text-decoration:none}
body.theme-dark .card,body.theme-dark .chat-compose,body.theme-dark .screen-canvas{background:var(--glass)}
body.theme-dark .content [style*='background:rgba(255,255,255,.6)'],body.theme-dark .content [style*='background:rgba(255,255,255,.5)'],body.theme-dark .content [style*='background:rgba(255,255,255,.68)']{background:var(--glass2)!important}
body.theme-dark .content [style*='color:#fff']{color:var(--ink)!important}
body.theme-dark .content .btn.pri{color:#302720!important}
@media(max-width:840px){
 .topbar{padding-top:env(safe-area-inset-top,0px);height:calc(55px + env(safe-area-inset-top,0px))}
 .sb{top:calc(55px + env(safe-area-inset-top,0px))}
 .drawer-scrim{top:calc(55px + env(safe-area-inset-top,0px))}
 .main{top:calc(55px + env(safe-area-inset-top,0px))}
 .prototype-exit{font-size:0!important;min-width:42px;justify-content:center}
 .prototype-exit::after{content:'↗';font-size:20px;font-weight:600}
 .chat-compose textarea{font-size:16px}
 .content{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
}
@media(max-width:390px){.topbar .brand .prototype-tag{display:none}.topbar .acts .prototype-exit::after{font-size:20px}}
@media(prefers-reduced-motion:reduce){.chat-demo-message{animation:none!important}}

/* 最终视觉校准：保留玻璃轨道外观，触控靶区独立扩大；语义色全局统一。 */
@media (pointer:coarse){
 .content .tabs span{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;padding:8px 12px}
 .content .sw{width:48px;height:48px;min-width:48px;min-height:48px;border-radius:12px;background:transparent!important;display:block}
 .content .sw::before{content:"";position:absolute;left:5px;top:13px;width:38px;height:22px;border-radius:11px;background:rgba(160,145,125,.28);transition:background 200ms cubic-bezier(.22,1,.36,1)}
 .content .sw.on::before{background:linear-gradient(135deg,var(--mint),var(--mintD))}
 .content .sw::after{left:7px;top:15px;width:18px;height:18px}
 .content .sw.on::after{left:25px}
 .content .btn{min-height:44px;min-width:44px}
 .content .appearance-swatch{width:44px;height:44px;min-width:44px;min-height:44px}
}
.appearance-swatch:focus-visible{outline:3px solid #815232;outline-offset:3px}
/* 手机聊天：内容占满剩余可用高度，输入区贴近拇指区，不留巨大空白。 */
@media(max-width:840px){
 .main[data-screen="01"] .screen-canvas{height:100%;min-height:100%;}
 .main[data-screen="01"] .screen-canvas > .g2{height:100%;min-height:100%;}
 .main[data-screen="01"][data-mobile-panel="1"] .screen-canvas > .g2 > :nth-child(2){display:flex!important;flex-direction:column;height:100%;min-height:100%;}
 .main[data-screen="01"] .chat-compose{margin-top:auto;}
 .content .mono,.content .tagp{font-size:max(11.5px,0.75rem)}
}
/* 深色模式不继承静态设计演示的固定前景色。 */
body.theme-dark .content .prototype-success{color:var(--mint)!important}


 html,body{min-width:0;overflow:hidden}
 .topbar{height:55px;padding:0 10px;gap:8px}
 .topbar .brand{font-size:13px;white-space:nowrap;overflow:hidden;min-width:0}
 .topbar .brand .mk{width:22px;height:22px;flex-shrink:0}
 .topbar .crumb{display:none}
 .topbar .acts{gap:4px}
 .topbar .acts .btn{font-size:0;padding:0 9px;white-space:nowrap}
 .topbar .acts .btn svg{width:17px;height:17px}
 .topbar .acts .btn:last-child{font-size:11px;padding:0 8px}
 .mobile-menu{display:inline-grid;place-items:center;border:0;background:rgba(255,255,255,.7);border-radius:10px;width:42px;height:42px;flex-shrink:0;cursor:pointer;color:var(--ink)}
 .drawer-scrim{display:block;position:fixed;inset:55px 0 0;background:rgba(35,30,24,.30);z-index:55;opacity:0;pointer-events:none;transition:opacity 180ms}
 .sb{top:55px;bottom:0;z-index:60;width:min(300px,84vw);transform:translateX(-105%);transition:transform 250ms cubic-bezier(.22,1,.36,1);box-shadow:18px 0 35px rgba(35,30,24,.12)}
 .drawer-open .sb{transform:translateX(0)}
 .drawer-open .drawer-scrim{opacity:1;pointer-events:auto}
 .main{left:0;top:55px;right:0;bottom:0;min-width:0;width:100%}
 .toolbar{height:auto;min-height:60px;padding:8px 13px;gap:8px}
 .toolbar>div:first-child{min-width:0;flex:1}
 .toolbar .tt{font-size:15px;line-height:1.3}
 .toolbar .ts{font-size:11px;line-height:1.5}
 .toolbar .acts{flex-shrink:0}
 .content{padding:10px 10px calc(14px + env(safe-area-inset-bottom,0px));min-width:0}
 .screen-canvas{padding:12px 12px 16px;border-radius:19px;min-width:0}
 .card{max-width:100%}
 .content .g2,.content .g3,.content .g4,.content [style*="grid-template-columns"]{grid-template-columns:minmax(0,1fr)!important;min-width:0}
 .content .rowflex{display:flex;flex-direction:column;min-width:0}
 .content .rowflex >*,.content .g2 >*,.content .g3 >*,.content .g4 >*{width:100%;max-width:100%;min-width:0}
 .content [style*="width:"]{max-width:100%}

// 渲染侧栏：导航结构与搜索状态统一，收起时保留图标与无障碍名称。
function renderSB(){
 const items=GROUPS.map(g=>`<div class="sb-grp">${g.n}</div>${g.items.map(it=>`
  <div class="sb-i ${state.sc===it[0]?'on':''}" role="button" title="${it[1]}" aria-label="${it[1]}" onclick="goto('${it[0]}')">${I[it[2]]||I.chat}<span>${it[1]}</span>${it[3]?`<span class="ct">${it[3]}</span>`:''}</div>`).join('')}`).join('');
 const el=document.getElementById('sb');
 el.innerHTML=`<div class="sy-nav-head"><div class="sy-nav-headline">EXPLORE · 界面导航</div><label class="sy-nav-search">${I.search}<input type="search" autocomplete="off" aria-label="筛选 38 个设计页面" placeholder="查找页面 · 38 屏" value="${escapeHtml(state.navQuery||'')}" oninput="filterSidebar(this.value)"></label></div><div class="sy-nav-items" id="navItems">${items}</div><div class="sy-nav-foot"><strong>神言神语 · 空间设计</strong><span>玻璃材质 / 暖色柔光 / 场景动效</span><div class="sy-nav-actions"><button type="button" onclick="goto('26')">外观设置</button><button type="button" onclick="goto('37')">动效预览</button></div></div>`;
 if(state.navQuery)filterSidebar(state.navQuery);
}
function filterSidebar(value){
 state.navQuery=value;
 const needle=value.trim().toLowerCase();let current=[];const el=document.getElementById('navItems');if(!el)return;
 [...el.children].forEach(child=>{
  if(child.classList.contains('sb-grp')){if(current.length)current[0].hidden=current.slice(1).every(item=>item.hidden);current=[child];}
  else {child.hidden=!!needle&&!child.textContent.toLowerCase().includes(needle);current.push(child)}
 });
 if(current.length)current[0].hidden=current.slice(1).every(item=>item.hidden);
}

// 与屏幕编号无关的真实导航历史；同屏控件刷新不会污染返回栈。
const navigationStack=['01'];
function goto(id, fromBack=false){
 if(!Object.prototype.hasOwnProperty.call(SCREENS,id)) return;
 const oldPage=state.sc;
 if(id!==oldPage)state.scrollPositions[oldPage]=document.querySelector('.content').scrollTop;
 if(id!==oldPage && !fromBack) navigationStack.push(id);
 state.sc=id;
 if(id!==oldPage) state.mobilePanel=(id==='01'?1:0);
 closeDialog(); closeSheet();closeMobileMenu();
 const sc=SCREENS[id];
 document.getElementById('screenTitle').textContent=sc.n;
 document.getElementById('screenSub').textContent=sc.s+' · 原型示例';
 document.getElementById('crumb').innerHTML=`<b>${sc.g}</b><span class="sep">›</span><span>${sc.n}</span>`;
 const acts=[];
 if(['01','02','03','04'].includes(id)) acts.push({t:'主题规范',onclick:"goto('26')"});
 if(id==='31') acts.push({t:'跳过',onclick:"goto('01')"});
 if(id==='34'||id==='35') acts.push({t:'重置演示',onclick:'reload()'});
 if(id==='37') acts.push({t:'回聊天',onclick:"goto('01')"});
 document.getElementById('screenActs').innerHTML=acts.map(a=>`<button type="button" class="btn" onclick="${a.onclick}">${a.t}</button>`).join('');
 document.querySelector('.main').dataset.screen=id;
 document.getElementById('content').innerHTML=`<div class="card screen-canvas">${sc.body()}</div>`;
 renderSB(); renderMobilePanels(); upgradeControls(); applyAppearance(); applySceneMaterial(id);
 // 仅真实用户触发页面交互时演示动画；程序化逐屏截图维持稳定的静态基准。
 if(window.event?.isTrusted&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  const canvas=document.querySelector('.screen-canvas');
  if(id!==oldPage){
   canvas.animate([{opacity:.25,transform:`translateX(${fromBack?-20:20}px)`},{opacity:1,transform:'translateX(0)'}],
    {duration:360,easing:'cubic-bezier(.22,1,.36,1)'});
  }else if(window.event?.type==='click'){
   canvas.animate([{opacity:.45,transform:'translateX(20px)'},{opacity:1,transform:'translateX(0)'}],
    {duration:200,easing:'cubic-bezier(.22,1,.36,1)'});
  }
 }
 if(id!==oldPage)document.querySelector('.content').scrollTop=fromBack?(state.scrollPositions[id]||0):0;
}
function goBack(){
 if(document.getElementById('overlay').classList.contains('show')) {closeDialog();return;}
 if(document.getElementById('sheet').classList.contains('show')) {closeSheet();return;}
 if(state.mobileNav){closeMobileMenu();return;}
 if(navigationStack.length>1){navigationStack.pop();goto(navigationStack[navigationStack.length-1],true)}
 else toast('当前已是起始页面');
}

}
function closeMobileMenu(){
 state.mobileNav=false;
 document.body.classList.remove('drawer-open');
 document.getElementById('mobileMenu').setAttribute('aria-expanded','false');
}
function setAppearance(index){
 state.appearance=index;
 applyAppearance();
 goto(state.sc);
}
function applyAppearance(){
 const dark=state.appearance===1||state.appearance===2||
   (state.appearance===3&&window.matchMedia('(prefers-color-scheme: dark)').matches);
 const matte=state.appearance===2;
 document.body.classList.toggle('theme-dark',dark);
 document.body.classList.toggle('theme-matte',matte);
 document.body.style.setProperty('--glass','var(--sy-l3)');
 document.body.style.setProperty('--glass2','var(--sy-l2)');
 document.body.style.setProperty('--glass3','var(--sy-l1)');
 // Preserve three clearly different materials. Slider adjusts physical opacity, not business status colors.
 if(matte){['--sy-l1','--sy-l2','--sy-l3'].forEach(v=>document.body.style.removeProperty(v));}
 else{
  const factor=Math.min(1.28,Math.max(.78,state.glassOpacity/.62));
  const rgb=dark?'255,245,228':'255,255,255';
  const specs=dark?[.055,.085,.12]:[.30,.46,.64];
  ['--sy-l1','--sy-l2','--sy-l3'].forEach((k,i)=>document.body.style.setProperty(k,`rgba(${rgb},${Math.min(dark?.20:.84,specs[i]*factor).toFixed(3)})`));
 }
}
function applySceneMaterial(id){
 const canvas=document.querySelector('.screen-canvas');if(!canvas)return;
 canvas.dataset.scene=id;
 // Real layout sections: not every parent is another translucent card.
 document.querySelectorAll('.content .card:not(.screen-canvas)').forEach(el=>{
  el.dataset.material='l3';
  if(el.parentElement?.closest('.card:not(.screen-canvas)')){el.dataset.material='l5';el.style.setProperty('backdrop-filter','none');}
 });
 const activeNav=document.querySelector('.sb-i.on');if(activeNav&&false){
  activeNav.scrollIntoView({block:'nearest',behavior:'instant'});
 }
}
function setGlass(index){
 state.glassOpacity=[.30,.46,.62,.80][index];
 setTab('glass',index);applyAppearance();
}
function setAccent(index){
 const colors=[['#E8A87C','#D9926B','rgba(232,168,124,.18)'],['#7FBFA8','#69AE97','rgba(127,191,168,.18)'],['#B9A0D4','#9C82BB','rgba(185,160,212,.20)'],['#E0A458','#C18A38','rgba(224,164,88,.20)']];
 const chosen=colors[index];if(!chosen)return;
 setTab('accent',index);
 document.body.style.setProperty('--acc',chosen[0]);
 document.body.style.setProperty('--accD',chosen[1]);
 document.body.style.setProperty('--accX',chosen[2]);
 goto(state.sc);
}

 tabs.innerHTML=panes ? panes.map((title,index)=>

function upgradeControls(){
 // 仅用于本地原型键盘操作；正式 Android 使用 Compose 的原生可访问语义。
 document.querySelectorAll('#content [onclick], #sb [onclick]').forEach(el=>{
  if(el.matches('button,input,select,a,textarea'))return;
  el.setAttribute('tabindex','0');
  if(el.classList.contains('sw')){
   el.setAttribute('role','switch');el.setAttribute('aria-checked',String(el.classList.contains('on')));
   const label=el.parentElement?.textContent?.trim().replace(/\s+/g,' ').slice(0,90);if(label)el.setAttribute('aria-label',label);
  }else if(el.matches('.tabs span')){
   el.setAttribute('role','tab');el.setAttribute('aria-selected',String(el.classList.contains('on')));
  }else if(!el.hasAttribute('role')){el.setAttribute('role','button')}
 });
}
// Esc 支持和键盘按压可用，避免所有操作只能用鼠标点击。
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&!document.getElementById('overlay').classList.contains('show')){e.preventDefault();goto('33');requestAnimationFrame(()=>document.getElementById('searchQuery')?.focus());return;}
 const activeModal=document.getElementById('overlay').classList.contains('show')?document.getElementById('dlgBody'):
 (document.getElementById('sheet').classList.contains('show')?document.getElementById('sheet'):null);
 if(e.key==='Tab'&&activeModal){
  const focusable=[...activeModal.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),[role="button"],[role="radio"],[tabindex="0"]')].filter(el=>el.getClientRects().length&&el!==activeModal);
  if(!focusable.length){e.preventDefault();activeModal.focus();return;}
  const first=focusable[0],last=focusable[focusable.length-1];
  if(e.shiftKey&&(document.activeElement===first||document.activeElement===activeModal)){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===activeModal)){e.preventDefault();first.focus();}
 }
 if(e.key==='Escape'){
  if(document.getElementById('overlay').classList.contains('show'))closeDialog();
  else if(document.getElementById('sheet').classList.contains('show'))closeSheet();
  else closeMobileMenu();
 }
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"],[role="tab"],[role="switch"],[role="radio"]')&&!e.target.matches('button')){
  e.preventDefault();e.target.click();
 }
});

   activeOverlays=1;setInert(true);
  };
 }
 if(typeof nativeCloseDialog==='function'){
  window.closeDialog=function(){
   const layer=document.getElementById('overlay');
   const isDanger=layer?.classList.contains('show')&&layer?.dataset.risk==='danger';
   if(isDanger&&window.event?.type==='keydown'&&window.event?.key==='Escape')return;
   nativeCloseDialog();activeOverlays=0;setInert(false);
  };
 }
 if(typeof nativeOpenSheet==='function'){
  window.openSheet=function(title,body){nativeOpenSheet(title,body);activeOverlays=1;setInert(true)};
 }
 if(typeof nativeCloseSheet==='function'){
  window.closeSheet=function(){nativeCloseSheet();activeOverlays=0;setInert(false)};
 }
 window.startWorkMorph=function(source){
  if(!source){goto('02');return;}
  const before=source.getBoundingClientRect();
  const shouldAnimate=!prefersReduced()&&before.width>0&&before.height>0;
  let ghost=null;
  if(shouldAnimate){
   ghost=document.createElement('div');ghost.className='sy-morph-ghost';ghost.setAttribute('aria-hidden','true');
   ghost.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m13 2-10 12h9l-1 8 10-12h-9z"/></svg><span>迁移鉴权模块 · 创建任务</span>';
   Object.assign(ghost.style,{left:before.left+'px',top:before.top+'px',width:before.width+'px',height:before.height+'px'});
   document.body.appendChild(ghost);
  }
  goto('02');
  const target=document.querySelector('.main[data-screen="02"] .screen-canvas .card');
  if(target){target.classList.add('sy-morph-target');setTimeout(()=>target.classList.remove('sy-morph-target'),550)}
  if(!ghost||!target){ghost?.remove();return;}
  const after=target.getBoundingClientRect();
  const rect=[before,after];
  try{
   ghost.animate(rect.map(r=>({left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',borderRadius:r===before?'13px':'20px',opacity:r===before?1:.77})),{duration:500,easing:'cubic-bezier(.22,1,.36,1)',fill:'forwards'}).finished.catch(()=>{}).finally(()=>ghost.remove());
  }catch(e){ghost.remove()}
 };
 // Shortcut + meaningful states; never hijack typing inside a field.
 document.addEventListener('keydown',e=>{
  if(e.altKey&&!e.ctrlKey&&!e.metaKey&&['1','2','3'].includes(e.key)&&!e.target.closest('input,textarea,[contenteditable]')){
   e.preventDefault();goto(({1:'01',2:'02',3:'03'})[e.key]);
  }
 });

  if(document.visibilityState==='visible'&&document.querySelector('.main[data-screen="01"]')){
   document.querySelector('#inp01')?.setAttribute('aria-describedby','screenSub');
  }
 });

 document.documentElement.dataset.shenyanPageVersion='v6';
