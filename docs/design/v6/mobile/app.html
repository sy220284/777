<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>神言神语 V6 · 现行 Android 单列 UI 交互设计投影</title>
<meta name="description" content="基于 2026-10-14 主线 Compose 七条 Route 重建；示例交互并非真实运行或 Figma 同步。">
<style>
:root{
 --canvas:#EDE6DA;--topbar:#F6F1E9;--ink:#3A342D;--sub:#6A6156;--third:#70665A;
 --l1:rgba(237,230,218,.302);--l2:rgba(241,232,220,.459);--l3:rgba(241,232,220,.639);
 --l4:rgba(241,232,220,.878);--l5:#F1E8DC;--edge:rgba(211,197,181,.40);
 --glint:rgba(246,240,230,.40);--primary:#E8A87C;--pressed:#D9926B;
 --mint:#7FBFA8;--lilac:#B9A0D4;--danger:#D9705F;--warning:#E0A458;
 --radius-control:13px;--radius-card:18px;--radius-sheet:24px;--gap-md:10px;--gap-lg:14px;
 --tempo:1;--ease:cubic-bezier(.22,1,.36,1)
}
body[data-theme="dark"]{--canvas:#24211E;--topbar:#292521;--ink:#F5F0E8;--sub:#D9D0C5;--third:#B8AB9B;--l1:rgba(48,43,39,.102);--l2:rgba(48,43,39,.161);--l3:rgba(53,48,43,.251);--l4:rgba(49,43,38,.878);--l5:#35312D;--edge:rgba(255,255,255,.129);--glint:rgba(255,241,222,.16)}
body[data-theme="matte"]{--canvas:#0F0F10;--topbar:#18181A;--ink:#F5F0E8;--sub:#D9D0C5;--third:#B8AB9B;--l1:#181819;--l2:#1E1E20;--l3:#232324;--l4:#29292B;--l5:#29292B;--edge:rgba(255,255,255,.102);--glint:rgba(255,255,255,.055)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#151310}
body{--scene-glow:radial-gradient(ellipse at 0 0,rgba(232,168,124,.16),transparent 48%),radial-gradient(ellipse at 100% 18%,rgba(127,191,168,.14),transparent 56%);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--pressed);outline-offset:2px}
button:active{transform:scale(.985)}
button:disabled{opacity:.45;cursor:default}
.device{width:min(100%,412px);height:100dvh;min-height:500px;overflow:hidden;margin:auto;position:relative;background:var(--scene-glow),var(--canvas);display:flex;flex-direction:column;box-shadow:0 0 80px rgba(0,0,0,.32)}
@media(min-width:580px){.device{margin:10px auto;height:calc(100dvh - 20px);border-radius:28px;border:1px solid var(--edge)}}
header{z-index:2;display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 14px 6px;background:transparent}
header .headline{min-width:0;flex:1}
header strong{font-size:16px;font-weight:650;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{color:var(--third);font-size:11px}
.icon{min-width:48px;min-height:48px;width:48px;height:48px;border:0;border-radius:13px;background:transparent;display:grid;place-items:center;font-size:22px}
.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scroll{min-height:0;overflow-y:auto;overscroll-behavior:contain;flex:1;padding:10px 14px 22px;scrollbar-width:thin}
.section{padding:8px 0 14px}
.kicker{font-size:12px;color:var(--third);font-weight:550;margin:12px 3px 7px}
.sheet-card,.card{border:1px solid var(--edge);background:var(--l3);border-radius:var(--radius-card);box-shadow:0 7px 18px -14px rgba(47,34,20,.40),inset 0 1px var(--glint)}
.card{padding:14px;margin-bottom:10px}
.card.compact{padding:11px 13px}
.card p{line-height:1.65;color:var(--sub);margin:6px 0 0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.grow{min-width:0;flex:1}
.muted{color:var(--sub);font-size:12px}
.tiny{font-size:11px;color:var(--third)}
.hair{height:1px;background:var(--edge);margin:12px 0}
.pill{display:inline-flex;align-items:center;border:1px solid var(--edge);border-radius:99px;background:var(--l1);padding:5px 9px;font-size:12px;color:var(--sub)}
.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border:1px solid var(--edge);border-radius:var(--radius-control);background:var(--l1);font-size:13px}
.btn.primary{background:var(--primary);border-color:transparent;color:#3A342D;font-weight:650}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.small{padding-inline:9px}
.btn.wide{width:100%}
.title{font-size:16px;font-weight:650;letter-spacing:-.01em}
.list-row{min-height:56px;display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--edge);background:transparent;width:100%;text-align:left;padding:9px 5px}
.list-row:last-child{border-bottom:0}
.list-row .glyph{width:31px;height:31px;border-radius:10px;flex-shrink:0;background:var(--l2);display:grid;place-items:center;font-size:17px}
.list-row .copy{flex:1;min-width:0}
.list-row .copy strong{font-size:13px;display:block}
.list-row .copy small{color:var(--sub);display:block;white-space:normal;font-size:11px;margin-top:3px}
.chat{display:flex;flex-direction:column;gap:12px;padding-bottom:10px}
.message{max-width:91%;line-height:1.65}
.message.assistant{align-self:flex-start;width:91%}
.message.user{align-self:flex-end;max-width:88%}
.message .body{background:var(--l3);border:1px solid var(--edge);border-radius:18px;padding:13px 16px;white-space:pre-wrap}
.message.user .body{background:var(--l2);padding:11px 15px}
.message .actions{display:flex;align-items:center;gap:4px;margin-top:4px}
.message .actions button{min-width:48px;min-height:48px;border:0;background:transparent;border-radius:13px;font-size:12px;color:var(--sub)}
.work-event{border-left:2px solid var(--mint);padding:9px 13px;background:var(--l1);border-radius:3px 13px 13px 3px;margin:5px 0}
.work-event strong{font-size:12px}
.work-event p{margin:4px 0;font-size:12px;color:var(--sub)}
.composer{z-index:1;margin:0 10px 9px;padding:9px;background:var(--l3);border:1px solid var(--edge);border-radius:20px;box-shadow:0 7px 18px -15px #362c25}
.composer textarea{resize:none;width:100%;min-height:54px;max-height:120px;background:transparent;border:0;outline:none;padding:7px 8px;color:var(--ink)}
.composer .tools{display:flex;align-items:center;gap:4px;min-width:0}
.composer .tools .scroll-tools{display:flex;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.composer .tools .btn{flex-shrink:0}
.composer .tools button{min-height:48px}
.tabline{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tabline button{min-height:40px;background:transparent;border:1px solid var(--edge);padding:6px 12px;border-radius:99px}
.tabline button[aria-pressed="true"]{background:var(--l3);font-weight:650}
.notice{color:var(--sub);font-size:12px;line-height:1.6;padding:12px;border:1px dashed var(--edge);border-radius:13px;margin:9px 0}
.skill-card{display:flex;flex-direction:column;gap:8px}
.skill-head{display:flex;gap:10px;align-items:center}
.skill-icon{width:40px;height:40px;min-width:40px;flex:0 0 40px;background:var(--l2);border-radius:12px;display:grid;place-items:center;font-size:19px}
.skill-name{min-width:0;flex:1;font-size:14px;font-weight:650;overflow-wrap:anywhere}
.skill-desc{color:var(--sub);font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.skill-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:7px;border-top:1px solid var(--edge)}
.skill-actions button{min-height:48px}
.slider{width:100%;accent-color:var(--pressed);min-height:40px}
label{display:block}
input[type="search"]{width:100%;min-height:48px;border:1px solid var(--edge);background:var(--l2);border-radius:13px;padding:10px 13px;margin-bottom:10px}
.drawer-cover,.sheet-cover{position:absolute;inset:0;background:rgba(12,10,9,.34);opacity:0;pointer-events:none;transition:opacity calc(200ms*var(--tempo)) var(--ease);z-index:4}
.drawer-cover.open,.sheet-cover.open{opacity:1;pointer-events:auto}
.drawer{position:absolute;inset:0 auto 0 0;width:min(86%,340px);z-index:5;background:var(--scene-glow),var(--canvas);transform:translateX(-105%);transition:transform calc(280ms*var(--tempo)) var(--ease);display:flex;flex-direction:column;box-shadow:5px 0 24px rgba(0,0,0,.16)}
.drawer.open{transform:none}
.drawer .scroll{padding:12px}
.drawer h2{margin:13px 13px 10px;font-size:18px}
.drawer-header{padding:14px 13px 9px;border-bottom:1px solid var(--edge)}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;z-index:7;max-height:85%;overflow-y:auto;background:var(--scene-glow),var(--l5);padding:20px 16px;border:1px solid var(--edge);border-radius:24px;box-shadow:0 -4px 30px rgba(0,0,0,.15);transform:translateY(130%);transition:transform calc(380ms*var(--tempo)) var(--ease)}
.sheet.open{transform:none}
.sheet h3{margin:0 0 9px}
.sheet-menu{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.sheet-menu button{display:grid;justify-items:center;align-content:center;gap:6px;border:0;background:transparent;border-radius:12px;min-height:64px;font-size:11px}
.sheet-menu b{font-size:20px;font-weight:400}
.footer-tip{font-size:10px;color:var(--third);padding:5px 14px;text-align:center}
summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:650}
details .card{margin:8px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:0ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body data-theme="light">
<div class="device" id="app" data-v6-authoritative="compose-2026-10-14">
<header><button class="icon" data-action="menu" aria-label="打开侧边栏">☰</button><div class="headline"><strong id="pageTitle">聊天</strong><small id="pageSub">V6 · 当前实现设计投影</small></div><button class="icon" data-action="theme" aria-label="切换外观主题">◐</button></header>
<main class="scroll" id="content" aria-live="polite"></main>
<div id="composerHost"></div>
<div class="footer-tip">离线示例：按代码结构表达交互，不连接真实任务 · Figma 待同步</div>
<div class="drawer-cover" id="drawerCover" data-action="closeDrawer"></div>
<nav class="drawer" id="drawer" aria-label="侧边栏">
 <div class="drawer-header"><div class="row between"><strong>神言神语 · V6</strong><button class="icon" data-action="closeDrawer" aria-label="关闭侧边栏">×</button></div><div class="tabline" id="modeSwitch"></div></div>
 <div class="scroll"><input type="search" id="drawerSearch" placeholder="搜索会话、人物、任务、文件" aria-label="侧栏统一搜索"><div id="drawerList"></div></div>
</nav>
<div class="sheet-cover" id="sheetCover" data-action="closeSheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="操作弹层"></div>
</div>
<script>
'use strict';
// Manifest is checked against docs/design/v6/current-ui.json by the repository guard.
const V6_ROUTES=["HOME","PERSONA_GALLERY","DIARY","WORKSPACE","TASKS","TOOLS","SETTINGS"];
const routeInfo={HOME:["对话","聊天与工作共用消息时间线"],PERSONA_GALLERY:["人物图集","人物选择与编辑"],DIARY:["人物日记","日记与故事记录"],WORKSPACE:["工作区","真实文件与成果入口"],TASKS:["自动化任务","任务列表与编辑"],TOOLS:["工具与技能","工具、插件和能力"],SETTINGS:["设置","原生设置分类与二级页"]};
const settingsNames={ROOT:"设置",SESSION:"会话",APPEARANCE:"外观",CHAT:"聊天",ACCOUNT:"ChatGPT 账户",MODELS:"模型设置",MODEL_PERFORMANCE:"模型性能",MODEL_USAGE:"模型消耗",MINIMAX_QUOTA:"MiniMax 套餐额度",PRICING:"价格配置",USAGE:"消耗统计",USAGE_LOG:"用量日志",USAGE_DETAIL:"用量详情",MEMORY:"记忆",MEMORY_SETTINGS:"记忆设置",MEMORY_MANAGEMENT:"管理记忆",PERMISSIONS:"权限设备",NOTIFICATIONS:"通知",ADVANCED:"高级",SESSION_STORAGE:"会话存储",DIAGNOSTICS:"运行诊断"};
const rootSettings=["APPEARANCE","MEMORY","SESSION_STORAGE","MODELS","MODEL_PERFORMANCE","ACCOUNT","NOTIFICATIONS","PERMISSIONS","ADVANCED"];
const secondarySettings=Object.keys(settingsNames).filter(x=>!["ROOT"].includes(x));
let route="HOME",mode="CHAT",theme="light",settingsPage="ROOT",modal="",details=false,showAdvanced=false,workRunning=true,skillSearch="",quickDraft="",sent=[];
const el=id=>document.getElementById(id);
const button=(t,act,variant="")=>'<button class="btn '+variant+'" data-action="'+act+'">'+t+'</button>';
const item=(label,hint,act,glyph="›")=>'<button class="list-row" data-action="'+act+'"><span class="glyph">'+glyph+'</span><span class="copy"><strong>'+label+'</strong><small>'+hint+'</small></span><span class="muted">›</span></button>';
const card=(title,body)=>'<section class="card"><div class="title">'+title+'</div>'+body+'</section>';
function updateDrawer(){
 el("modeSwitch").innerHTML='<button data-action="mode:CHAT" aria-pressed="'+(mode==="CHAT")+'">聊天</button><button data-action="mode:WORK" aria-pressed="'+(mode==="WORK")+'">工作</button>';
 const q=el("drawerSearch").value.trim().toLowerCase();
 const links=[["HOME","会话","会话与工作时间线","≡"],["PERSONA_GALLERY","人物图集","人物选择／编辑","◎"],["DIARY","人物日记","已记录的角色经历","▤"],["WORKSPACE","工作区文件","文件列表与成果","▥"],["TASKS","自动化任务","创建／编辑任务","◷"],["TOOLS","工具与技能","插件／技能／连接","⌘"],["SETTINGS","设置","主题、模型、存储与诊断","⚙"]];
 el("drawerList").innerHTML='<div class="kicker">当前功能</div>'+links.filter(a=>(a[1]+a[2]).toLowerCase().includes(q)).map(a=>item(a[1],a[2],"route:"+a[0],a[3])).join('')+
 (q?'':'<div class="kicker">按需进入的功能</div>'+item("群聊","人物图集中的群聊入口","modal:group","◉")+item("全局用量","打开设置内消耗统计","settings:USAGE","◴")+item("MiniMax 套餐额度","设置中的额度二级页","settings:MINIMAX_QUOTA","▱")+item("沉浸阅读","会话内容阅读操作","modal:reader","▤"));
}
function renderHome(){
 const chatMode=mode==="CHAT";
 const transcript=chatMode?[
  '<div class="message user"><div class="body">这次的布局，按我们现在用的版本调整。</div></div>',
  '<div class="message assistant"><div class="body">已经切到当前 V6 的阅读排版。\n单次换行保持原样，操作按钮放到正文卡片外面。</div><div class="actions"><button data-action="modal:copy">复制</button><button data-action="modal:reader">朗读</button><button data-action="modal:branch">分支</button></div></div>'
 ]:[
  '<div class="message user"><div class="body">检查当前设计规范与实现是否一致。</div></div>',
  '<div class="work-event"><strong>运行中 · 已读取实际文件</strong><p>执行事实属于业务 Owner；展示和人工验收必须分开。</p></div>',
  '<div class="message assistant"><div class="body">工作结果将继续写入这条会话时间线，不再切换五段导航。</div><div class="actions"><button data-action="modal:reader">阅读</button><button data-action="modal:workDetail">操作记录</button></div></div>',
  '<div class="card compact"><div class="row between"><strong>成果 · 设计规范</strong><span class="pill">可打开</span></div><p>保留在消息内，不设独立产出空白卡。</p>'+button("打开成果","modal:artifact","ghost")+'</div>',
  '<div class="row">'+button("查看待审批","modal:approval")+button("回答问题","modal:question","ghost")+'</div>'
 ];
 return '<div class="chat"><div class="kicker">'+(chatMode?"聊天记录":"工作消息")+' · 演示数据</div>'+transcript.join('')+sent.map(t=>'<div class="message user"><div class="body">'+t+'</div></div>').join('')+
 '<p class="tiny">操作示例不提交真实工具、模型调用或任务状态。</p></div>';
}
function renderComposer(){
 if(route!=="HOME"){el("composerHost").innerHTML='';return;}
 const canSteer=mode==="WORK"&&workRunning&&quickDraft.trim();
 el("composerHost").innerHTML='<div class="composer"><textarea id="draft" aria-label="消息输入" placeholder="'+(mode==="WORK"?"输入工作要求…":"输入消息…")+'"></textarea>'+
 (canSteer?'<div class="row between" style="margin:5px 6px"><span class="muted">仅在运行中有新指令时展示调整选项</span>'+button("立即调整","modal:steer","ghost")+'</div>':'')+
 '<div class="tools"><div class="scroll-tools"><button class="btn ghost small" data-action="modal:plus" aria-label="添加附件">＋</button>'+
 button("模型","modal:model","ghost")+button("能力","modal:capability","ghost")+(mode==="WORK"?button("计划","modal:plan","ghost"):"")+'</div>'+
 (mode==="WORK"&&workRunning?button("停止","toggleRun","ghost")+button("排队发送","send","primary"):button("发送","send","primary"))+'</div></div>';
 const input=el("draft");input.value=quickDraft;input.addEventListener("input",e=>{quickDraft=e.target.value;const oldScroll=el("content").scrollTop;renderComposer();el("draft").focus();el("draft").setSelectionRange(quickDraft.length,quickDraft.length);el("content").scrollTop=oldScroll;});
}
function renderTools(){
 const list=[["可复用技能","可从当前应用导入、手动建立、搜索说明并调整自动调用。","技能"],["GitHub 插件","连接状态按真实协议判断；不能仅凭缓存显示在线。","插件"],["本地插件","安装或更新时保留已有卡片，详情显示完整说明。","插件"]];
 return '<div class="kicker">能力中心</div>'+card("工具配置",item("技能","查看和管理已安装技能","modal:skills","◇")+item("插件","查看可用插件连接","modal:plugins","⌘")+item("GitHub","配置连接与工具准入","modal:github","◎"))+
 '<div class="kicker">技能与插件列表 · #711 待合并后的布局目标</div><input type="search" id="toolSearch" placeholder="搜索名称与说明" value="'+skillSearch+'">'+
 list.filter(a=>(a[0]+a[1]).toLowerCase().includes(skillSearch.toLowerCase())).map(a=>'<div class="card skill-card"><div class="skill-head"><div class="skill-icon">'+(a[2]==="技能"?"◇":"⌘")+'</div><div class="skill-name">'+a[0]+'</div><span class="pill">'+a[2]+'</span></div><div class="skill-desc">'+a[1]+'</div><div class="skill-actions">'+button("详情","modal:skillDetail","ghost")+button("管理","modal:skillManage")+'</div></div>').join('')+
 '<div class="notice">当前主线仍存在高光绘制影响紧凑容器测量的风险；以上卡片排版是 #711 的待合并设计目标，不冒充已上线。</div>';
}
function renderSettings(){
 if(settingsPage==="ROOT"){return '<div class="kicker">通用设置</div>'+rootSettings.map(s=>item(settingsNames[s],s==="APPEARANCE"?"主题、壁纸、文字和高级外观":s==="MODELS"?"模型、额度与用量":"进入实际设置页面","settings:"+s,"⚙")).join('')+'<div class="kicker">其他已有二级页（非主菜单重复入口）</div>'+secondarySettings.filter(s=>!rootSettings.includes(s)).map(s=>item(settingsNames[s],"按实际内部导航进入","settings:"+s,"·")).join('');}
 if(settingsPage==="APPEARANCE"){
 return '<div class="kicker">外观 · 当前页面紧凑展示</div>'+card("主题",'<div class="tabline">'+["light","dark","matte"].map((x,i)=>'<button data-action="theme:'+x+'" aria-pressed="'+(theme===x)+'">'+["暖纸","烟熏玻璃","哑光黑"][i]+'</button>').join('')+'</div>')+
 card("预览",'<div class="tiny">助手：这是一段短阅读示例</div><div class="message user" style="margin:9px 0 0 auto"><div class="body">用户气泡同步当前外观</div></div>')+
 card("背景",item("自定义壁纸","实际背景取色和裁切由 AppBackgroundHost 处理","modal:wallpaper","▧"))+
 '<details '+(showAdvanced?"open":"")+' id="advancedControls"><summary>高级外观（默认折叠）</summary>'+
 card("色彩与背景",'<label>环境光（仅非自定义壁纸）<input type="range" class="slider" min="0" max="100" value="50" /></label><label><input type="checkbox" checked> 智能对比</label>')+
 card("材质与透明度",'<label>透明度 <input type="range" class="slider" min="0" max="100" value="50"></label>')+
 card("动效与动画",'<label>动画节奏（0.7–1.3）<input type="range" class="slider" min="70" max="130" value="100" data-action="tempo"></label>')+
 card("组件视觉",'<label>强调强度 <input type="range" class="slider" min="0" max="100" value="50"></label>'+button("恢复高级默认","reset"))+'</details>';
 }
 if(settingsPage==="MODELS")return card("模型配置",item("添加／切换模型","按各模型官方能力和授权展示","modal:model","◇")+item("模型消耗","按已配置模型查看使用量","settings:MODEL_USAGE","◴")+item("模型性能","响应和请求参数","settings:MODEL_PERFORMANCE","▤"));
 if(settingsPage==="ACCOUNT")return card("ChatGPT 套餐",'<p>连接测试与套餐可用模型列表分开显示；连接按钮上方不放“模型数量”胶囊。</p>'+button("测试连接","modal:connect")+item("套餐可用模型（示例）","只有真实账户返回的数据才可列出","modal:model","▤"));
 if(settingsPage==="MODEL_USAGE"||settingsPage==="USAGE")return card("模型与用量",'<p>按当前模型、单笔记录和真实已结算数据显示；不能把 API 账单与套餐额度混算。</p>'+item("用量日志","打开请求级明细","settings:USAGE_LOG","◴"));
 if(settingsPage==="NOTIFICATIONS")return card("通知",["运行通知","审批提醒","任务结果","消息提示"].map(s=>'<label class="list-row"><span class="copy">'+s+'</span><input type="checkbox" checked></label>').join(''));
 if(settingsPage==="DIAGNOSTICS"||settingsPage==="ADVANCED")return card("高级设置",item("运行诊断","包含真实错误原因和日志导出","settings:DIAGNOSTICS","▤")+item("检查更新","当前页按钮直接执行；没有独立更新页面","modal:checkUpdate","↻"));
 if(settingsPage==="MEMORY")return card("记忆",item("记忆设置","配置规则","settings:MEMORY_SETTINGS","▤")+item("管理记忆","查看已有记录","settings:MEMORY_MANAGEMENT","◎"));
 if(settingsPage==="SESSION_STORAGE")return card("会话存储",'<p>存储操作以真实磁盘、事件与结果为准。</p>'+button("查看存储","modal:storage"));
 return card(settingsNames[settingsPage]||"设置",'<p>本页仍存在于 SettingsDestination 的原生导航；此设计投影保留真实入口，不伪造实时数据和未核实交互。</p>'+button("返回设置","back","ghost"));
}
function render(){
 el("pageTitle").textContent=route==="HOME"?(mode==="CHAT"?"聊天":"工作"):route==="SETTINGS"?settingsNames[settingsPage]:routeInfo[route][0];
 el("pageSub").textContent=route==="SETTINGS"?"设置 · 返回保留来源":routeInfo[route][1];
 let body="";
 if(route==="HOME")body=renderHome();
 if(route==="PERSONA_GALLERY")body='<div class="kicker">人物</div>'+card("人物档案",'<p>人物信息、关系和编辑沿用专属页面，入口不再带旧数字徽标。</p>'+button("查看人物","modal:persona","ghost")+button("创建群聊","modal:group"))+card("继续对话",'<p>选择人物后返回真实会话；示例不主动创建运行任务。</p>'+button("进入会话","route:HOME","primary"));
 if(route==="DIARY")body=card("人物日记",'<p>保留日记记录和实际可见的故事经历；不复活删除的重复字段。</p>'+button("查看日记","modal:diary"));
 if(route==="WORKSPACE")body='<div class="kicker">工作文件</div>'+card("会话相关文件",item("示例文档.md","通过真实文件列表查询与打开","modal:file","▤")+item("成果预览","仍可由会话中成果卡打开","modal:artifact","▧"));
 if(route==="TASKS")body='<div class="kicker">自动化任务</div>'+card("任务管理",item("新建任务","真实调度和权限归 Automation Owner","modal:task","＋")+item("示例任务","任务状态、编辑和历史","modal:taskDetail","◷"));
 if(route==="TOOLS")body=renderTools();
 if(route==="SETTINGS")body=renderSettings();
 el("content").innerHTML=body;
 renderComposer();updateDrawer();
 const toolSearch=el("toolSearch");if(toolSearch)toolSearch.addEventListener("input",e=>{skillSearch=e.target.value;const p=e.target.selectionStart;el("content").innerHTML=renderTools();el("toolSearch").focus();el("toolSearch").setSelectionRange(p,p)});
 const detailsNode=el("advancedControls");if(detailsNode)detailsNode.addEventListener("toggle",()=>showAdvanced=detailsNode.open);
}
function showDrawer(open){el("drawer").classList.toggle("open",open);el("drawerCover").classList.toggle("open",open);}
function showSheet(type){
 modal=type;
 const descriptions={plus:"附件与创作",approval:"等待审批 · 必须由真实业务回执确定状态",question:"待回答的问题 · 先选后确认，失败可重试",steer:"运行中调整 · 只有有草稿时显示",artifact:"成果文件 · 在时间线中打开真实结果",model:"模型选择 · 只显示真实支持的模型能力",capability:"能力入口 · 由已配置模型能力决定",plan:"工作计划 · 从真实计划事件读取",skills:"技能列表与详情",plugins:"插件连接",reader:"沉浸阅读",group:"群聊成员",checkUpdate:"检查更新 · 设置页直接动作"};
 let content='<h3>'+ (descriptions[type]||"操作详情") +'</h3>';
 if(type==="plus")content+='<div class="sheet-menu">'+["拍照","图片","文件","多模态创作"].map((s,i)=>'<button data-action="modal:selectAttachment"><b>'+["◉","▧","▤","✧"][i]+'</b>'+s+'</button>').join('')+'</div><div class="hair"></div>'+button("团队协作","modal:team","ghost")+button("共享","modal:share","ghost");
 else if(type==="question")content+='<p class="muted">这是交互演示，实际选项由当前 callId 和有效审批身份决定。</p><label class="list-row"><input type="radio" name="demoQ" checked> 选项一（示例）</label><label class="list-row"><input type="radio" name="demoQ"> 选项二（示例）</label>';
 else if(type==="approval")content+='<p class="muted">显示调用来源、权限范围与风险；本离线稿不会授予批准。</p>';
 else content+='<p class="muted">此处展示结构与操作层级。真实数据、功能条件、错误和回执均由对应 Feature 提供；HTML 演示不声称操作成功。</p>';
 content+='<div class="row" style="margin-top:15px;justify-content:flex-end">'+button("关闭","closeSheet","ghost")+(["approval","question"].includes(type)?button("确认示意","closeSheet","primary"):"")+'</div>';
 el("sheet").innerHTML=content;el("sheet").classList.add("open");el("sheetCover").classList.add("open");
}
function closeSheet(){modal="";el("sheet").classList.remove("open");el("sheetCover").classList.remove("open");}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-action]");if(!b)return;
 const a=b.getAttribute("data-action");
 if(a==="menu"){showDrawer(true);return}
 if(a==="closeDrawer"){showDrawer(false);return}
 if(a==="closeSheet"){closeSheet();return}
 if(a.startsWith("route:")){route=a.split(":")[1];settingsPage="ROOT";showDrawer(false);closeSheet();render();return}
 if(a.startsWith("mode:")){mode=a.split(":")[1];route="HOME";showDrawer(false);render();return}
 if(a.startsWith("settings:")){route="SETTINGS";settingsPage=a.split(":")[1];showDrawer(false);render();return}
 if(a.startsWith("modal:")){showDrawer(false);showSheet(a.split(":")[1]);return}
 if(a==="theme"||a.startsWith("theme:")){let list=["light","dark","matte"];theme=a==="theme"?list[(list.indexOf(theme)+1)%3]:a.split(":")[1];document.body.dataset.theme=theme;render();return}
 if(a==="toggleRun"){workRunning=!workRunning;render();return}
 if(a==="send"){if(quickDraft.trim()){sent.push(quickDraft.trim().replace(/[<>&"']/g,""));quickDraft="";render();el("content").scrollTop=el("content").scrollHeight;}return}
 if(a==="reset"){document.documentElement.style.setProperty("--tempo","1");return}
 if(a==="back"){if(route==="SETTINGS"&&settingsPage!=="ROOT"){settingsPage="ROOT";render()}else{route="HOME";render()}return}
});
el("drawerSearch").addEventListener("input",updateDrawer);
document.addEventListener("input",e=>{if(e.target.dataset.action==="tempo"){document.documentElement.style.setProperty("--tempo",String(Number(e.target.value)/100));}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSheet();showDrawer(false)}});
render();
</script>
</body>
