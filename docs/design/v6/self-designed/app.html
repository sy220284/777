<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>神言神语 · V6 自主设计</title><link rel="stylesheet" href="style.css">
<body><aside class="catalogue"><div class="brand"><span class="brandmark">言</span><div><strong>神言神语</strong><small>V6 · 暖纸与墨线</small></div></div><p class="disclosure">38 屏设计演示 · 示例内容<br>依据现行规范自主设计，非原 ZIP 或 Android 截图。</p><label class="navsearch"><span>查找界面</span><input id="sceneSearch" placeholder="名称或编号" autocomplete="off"></label><nav id="sceneList" aria-label="设计场景"></nav></aside>
<main><header class="labbar"><div><small id="sceneIndex"></small><h1 id="sceneTitle"></h1></div><div class="controls"><label>主题<select id="theme"><option value="light">暖纸</option><option value="dark">烟熏玻璃</option><option value="matte">哑光黑</option></select></label><label>宽度<select id="width"><option>393</option><option>412</option></select></label><label>字号<select id="fontScale"><option value="1">100%</option><option value="1.3">130%</option><option value="1.5">150%</option></select></label><label>状态<select id="state"><option value="content">内容</option><option value="empty">空白</option><option value="loading">加载</option><option value="error">错误</option></select></label></div></header><div class="workspace"><div id="phone" class="phone" data-theme="light"><div class="systembar"><span>9:41</span><span aria-hidden="true">▂▃▅ ▰</span></div><div id="screen" class="screen"></div><div class="homebar" aria-hidden="true"></div></div><section class="annotation"><small>页面构图</small><h2 id="intent"></h2><p id="anatomy"></p><div class="rule"></div><h3>本版共用规则</h3><ul><li>实色顶栏，正文留在独立滚动区。</li><li>L1 辅助区域、L2 导航、L3 主内容、L4 浮层。</li><li>功能图标沿用 PR 664 的 26 枚墨线图标。</li><li>48dp 操作目标；放大字体换行。</li><li>强调色用于选择与主操作，状态色表达结果。</li></ul><p class="hint">可操作页签、开关、选择项、搜索和页面入口；演示不连接账户或执行任务。</p><p id="feedback" role="status" aria-live="polite"></p></section></div></main><script src="scenes.js"></script><script src="app.js"></script></body></html>
